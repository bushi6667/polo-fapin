// 逐张写盘 + 索引：单张失败不影响已完成步骤，重试只重做失败步骤。
async function suiteSaveOne({ key, blob, fileKey, rowNum, jobId }) {
    // 文件名直接用输出编号（111/222/333/444/666），与用户约定一致
    const filename = String(key) + '.png';
    // 落盘子目录与颜色图同构：Polo发品_颜色图/<文件名>/rowN/，套图成品与该产品颜色图放同一文件夹，不再平铺根层。
    const subdir = (loadedFileName ? loadedFileName + '/' : '') + 'row' + rowNum;
    const resp = await suiteSend('suiteWriteOutput', { subdir, files: [{ key, filename, dataUrl: await suiteBlobToDataUrl(blob) }] }, 60000);
    if (!resp || !Array.isArray(resp.results) || !resp.ok) {
        throw new Error(`保存失败：${(resp && resp.error) || '扩展未响应或写盘未通过'}`);
    }
    const rec = resp.results.find(r => String(r.key) === String(key)) || resp.results[0] || {};
    if (rec.saved === false) throw new Error(`保存失败：${rec.error || '写盘校验未通过'}`);
    await SuiteCore.ResultStore().put({
        fileKey, rowNum, key: String(key), taskId: jobId, blob,
        meta: {
            filename: rec.filename || filename, bytes: rec.bytes, width: rec.width, height: rec.height,
            verified: rec.saved !== false, contentHash: await suiteContentHash(blob), postprocess: 'customJs',
            channel: resp.mode || 'filesystem'
        }
    });
    return { filename: rec.filename || filename, bytes: rec.bytes, width: rec.width, height: rec.height, mode: resp.mode || 'filesystem', dirName: resp.dirName || '' };
}

// 套图一次请求默认出 3 张（111/444 用产品主图，不消耗生图），正常 30~60 秒就有图。
// 100 秒是「无图即判卡住」的上限（到点抛错让上层重试/跳行），不是生成任务的时长上限。
async function waitSuiteAcquired(taskId, timeoutMs = 100000) {
    const deadline = Date.now() + timeoutMs;
    while (Date.now() < deadline) {
        if (readSuiteAutoState()?.paused) throw Error('当前套图已暂停');
        const r = await suiteSend('suiteGetTask', { taskId, summary: true });
        if (!r.ok || !r.task) throw new Error('任务记录丢失');
        if (r.task.stage === 'acquired') {
            const full = await suiteSend('suiteGetTask', { taskId });
            if (!full.ok || !full.task) throw new Error('结果读取失败');
            return full.task;
        }
        if (['failed', 'interrupted', 'completed'].includes(r.task.stage)) throw new Error(r.task.error || '任务已结束');
        await new Promise(resolve => setTimeout(resolve, 2000));
    }
    throw new Error('等待生成超时，已保留任务；可恢复已有结果');
}

// 单个 AI 步骤：一次创建 + 一次发送 + 单张识别；不复用旧结果的编号分配逻辑。
async function suiteGenerateOneStep({ step, prompt, mainDataUrl, fileKey, rowNum, product }) {
    const key = String(step.key);
    const assets = [{ color: 'main', filename: `row${rowNum}_main.png`, url: mainDataUrl, fileKey, row: rowNum }];
    const created = await suiteSend('suiteCreate', {
        task: {
            fileKey, rowNum, productId: product && product.id,
            mode: 'step-gen', expectCount: 1, targetKeys: [key],
            prompt, assets,
            configSnapshot: { model: step.model || '5.0', ratio: step.ratio || '1:1' }
        }
    });
    if (!created.ok || !created.task) throw new Error(created.error || '任务创建失败');
    const taskId = created.task.taskId;
    suiteTaskIdentities.set(taskId, { fileKey, rowNum });
    const run = await suiteSend('suiteRun', { taskId }, 600000);
    if (!run.ok) throw new Error(run.error || '套图执行失败');
    const task = await waitSuiteAcquired(taskId);
    const rec = await SuiteCore.recognize(task.images || [], [{ key }], { expectCount: 1 });
    if (!rec.ok) throw new Error(`${step.name}：结果识别失败 ${rec.error}`);
    const dataUrl = rec.results[0].url;
    const blob = await suiteBlobFromDataUrl(dataUrl);
    if (!blob || !blob.size) throw new Error(`${step.name}：生成结果为空`);
    return { blob, dataUrl, taskId, bytes: blob.size, type: blob.type || suiteDataUrlHeader(dataUrl) };
}

// 五张成品索引齐全才判定「套图」成功；支持跨任务补齐。
async function suiteBadgeReady(fileKey, rowNum) {
    try {
        const recs = await SuiteCore.ResultStore().list(fileKey, rowNum);
        const keys = new Set((recs || [])
            .filter(r => r.meta && r.meta.verified === true)
            .map(r => String(r.key)));
        if (!SUITE_STEP_KEYS.every(k => keys.has(k))) return false;
        // 跟随磁盘：五张成品全部通过真实磁盘核验才显示「套图」角标（缓存预览不算）
        const verifySubdir = (loadedFileName ? loadedFileName + '/' : '') + 'row' + rowNum;
        const verifyRecs = recs.map(r => ({ key: String(r.key), filename: (r.meta && r.meta.filename) || '', bytes: (r.meta && r.meta.bytes) || 0, contentHash: (r.meta && r.meta.contentHash) || '', savedAt: (r.meta && r.meta.savedAt) || r.savedAt || 0 }));
        const resp = await suiteSend('suiteVerifyOutput', { subdir: verifySubdir, records: verifyRecs }, 30000);
        const items = (resp && Array.isArray(resp.items)) ? resp.items : [];
        return items.length === 5 && items.every(i => i.status === 'verified');
    } catch (_) { return false; }
}

// 角标已取消：保留空实现，避免调用方改动（完成判定请看磁盘上的五张成品）。
async function syncSuiteBadge(fileKey, rowNum) {
    addSuiteGeneratedBadge(rowNum);
}

// total 缺省 5（整套）；指定重生成时传本次要跑的步骤数 —— 否则进度条永远按 5 张算，
// 只重生成 1 张也会显示成"整套套图在跑"（用户实测反馈）。
function suiteSetProgress({ jobId, fileKey, rowNum, phase, done, currentKey, paused, total }) {
    const previous = readSuiteAutoState();
    if (previous?.jobId === jobId && previous.paused) throw Error('当前套图已暂停');
    const goal = Math.max(1, Number(total) || SUITE_FIVE_TOTAL);
    try {
        const wrap = document.getElementById('suiteProgressWrap');
        const fill = document.getElementById('suiteFill');
        if (wrap && fill) {
            wrap.style.display = 'block';
            const pct = Math.max(0, Math.min(100, Math.round(((done || 0) / goal) * 100)));
            fill.style.width = pct + '%';
        }
    } catch (_) {}
    saveSuiteAutoState({
        taskId: jobId, jobId, fileKey, rowNum,
        phase: phase || 'generating', done: done || 0, total: goal,
        currentKey: currentKey || '', paused: !!paused
    });
}

// 五步主流程：预检 → 冻结 → 按配置顺序执行 → 逐张保存 → 角标。
// 参数 keys 可只给一个步骤（指定重生成），顺序始终按该类目当前配置顺序。
async function runSuiteFiveJob({ keys, resume = false, restart = false, targeted = false, stepsOverride = null } = {}) {
    if (typeof targetedRegenerationRunning !== 'undefined' && targetedRegenerationRunning && !targeted) return showToast('指定重生成正在执行');
    if (suiteTaskRunning) return null;
    window.UnifiedTaskStarted?.();
    const product = currentProduct;
    if (!product || !product.row) { showToast('❌ 请先导入 Excel 并选择一个产品'); return null; }
    const fileKey = currentFileKey();
    const rowNum = product.row;
    suiteStatusOwner = fileKey + '::' + rowNum;
    const btn = document.getElementById('suiteGenBtn');
    suiteTaskRunning = true;
    if (btn) { btn.disabled = true; btn.textContent = '⏳ 预检中...'; }
    try {
        // 先显示豆包页面，再做主图解码和任务快照等准备工作。
        const page = await suiteSend('suitePreparePage', {}, 15000);
        if (!page.ok) throw Error(page.error || '豆包页面打开失败');
        if (restart) {
            const active = await suiteSend('suiteListTasks', {fileKey,rowNum,activeOnly:true});
            if (!active.ok) throw Error(active.error || '旧套图任务读取失败');
            for (const task of active.tasks || []) {
                const cancelled = await suiteSend('suiteCancel', {taskId:task.taskId,reason:'从当前产品重新生成整套'});
                if (!cancelled.ok) throw Error(cancelled.error || '旧套图任务停止失败');
            }
            await clearSuiteFive(fileKey,rowNum);
        }
        // ① 恢复任务一律使用任务启动时冻结的 Excel 行、步骤配置与产品主图，不取当前界面产品替代。
        const frozen = resume ? await readSuiteFive(fileKey, rowNum) : null;
        if (resume && (!frozen || !frozen.excelRowSpec || !frozen.main || !frozen.main.dataUrl)) {
            throw new Error('缺少原任务冻结数据（产品主图 / Excel 行 / 步骤配置），不能恢复，未重新生图；请重新发起套图');
        }
        const spec = frozen ? frozen.excelRowSpec : excelRowSpec(rowNum);
        const snapshot = window.ExcelRow.build(spec);
        const steps = (frozen && Array.isArray(frozen.steps) && frozen.steps.length) ? frozen.steps : stepsOverride ? JSON.parse(JSON.stringify(stepsOverride)) : suiteFrozenSteps(snapshot);

        // ② 本次执行的编号：恢复时只补冻结清单中未完成的；步骤顺序始终按该类目配置顺序。
        const wanted = resume
            ? (frozen.keys || SUITE_STEP_KEYS).filter(k => !(frozen.done && frozen.done[k]))
            : (Array.isArray(keys) && keys.length ? keys.map(k => String(k).trim()) : SUITE_STEP_KEYS.slice());
        if (wanted.some(k => !SUITE_STEP_KEYS.includes(k)) || new Set(wanted).size !== wanted.length) {
            showToast('❌ 输出编号配置无效'); return null;
        }
        const ordered = steps.filter(s => SUITE_STEP_KEYS.includes(String(s.key)));
        const selected = ordered.filter(s => wanted.includes(String(s.key)));
        if (selected.length !== wanted.length) {
            const missing = wanted.filter(k => !selected.some(s => String(s.key) === k));
            throw new Error(`${missing.join('/')}：缺少步骤配置`);
        }
        if (!selected.length) {
            await clearSuiteFive(fileKey, rowNum);
            suiteSetProgress({ jobId: frozen.jobId, fileKey, rowNum, phase: 'completed', done: SUITE_FIVE_TOTAL, total: SUITE_FIVE_TOTAL });
            await syncSuiteBadge(fileKey, rowNum);
            updateSuiteStatus('✅ 五张成品已齐全，无需重新执行');
            return null;
        }
        const sourceOf = Object.fromEntries(selected.map(s => [String(s.key), suiteSourceOf(s)]));

        // ③ 提示词只对 AI 生成步骤渲染；product 步骤不读提示词，也不触发任何生图。
        const prompts = {};
        for (const step of selected) {
            if (sourceOf[step.key] !== 'generated') continue;
            const rendered = suiteRenderPrompt(step, snapshot);
            if (rendered.missing.length) throw new Error(`${step.key} ${step.name}：未解析变量 ${rendered.missing.join(' ')}`);
            const text = SuiteQuickFive.normalizePrompt(rendered.text);
            if (!text) throw new Error(`${step.key} ${step.name}：提示词为空`);
            prompts[step.key] = text;
        }

        // ④ 五步后处理预检：脚本有内容、字段映射有效、资源已选择（不消耗额度）。
        const ppConfig = await SuitePostprocess.checkInputs(steps, selected.map(s => String(s.key)), snapshot);
        if (!ppConfig.ok) throw new Error('后处理配置校验未通过：' + ppConfig.problems.join('；'));

        // ⑤ 输出能力先检查，避免生图后才发现无法保存。
        const outputStatus = await suiteSend('suiteOutputStatus', {}, 10000);
        if (!outputStatus.ok) throw new Error('套图输出检查失败：' + (outputStatus.error || '扩展没有响应') + '；尚未发送生成请求');
        if (!outputStatus.configured) throw new Error('请在扩展中选择产品套图目录并保存（只需一次）；尚未发送生成请求');
        if (outputStatus.permission !== 'granted' && !outputStatus.canFallback) {
            throw new Error(`产品套图目录权限为 ${outputStatus.permission} 且无法降级到下载通道：请重新授权；尚未发送生成请求`);
        }
        const outputFallback = outputStatus.permission !== 'granted';

        // ⑥ 产品主图：新任务读当前产品；恢复任务必须用冻结的那一份，不能取当前界面产品替换。
        let mainDataUrl, mainBlob, mainProbe;
        if (frozen) {
            mainDataUrl = frozen.main.dataUrl;
            mainBlob = await suiteBlobFromDataUrl(mainDataUrl);
            mainProbe = frozen.main;
        } else {
            const resolved = await resolveSuiteAssets(product);
            if (!resolved.assets.main) throw new Error('产品主图不可用：' + (resolved.problems[0] || '没有可用主图'));
            const mainAsset = (await prepareSuiteAssets({ main: resolved.assets.main }))[0];
            mainDataUrl = mainAsset.url;
            mainBlob = await suiteBlobFromDataUrl(mainDataUrl);
            mainProbe = await probeSuiteImage('主图', mainDataUrl);
            if (!mainProbe.ok) throw new Error('产品主图不可用：' + (mainProbe.error || '无法解码'));
        }

        // ⑦ 冻结：任务启动时的 Excel 身份、行、类目、主图、步骤配置与资源绑定。
        const jobId = frozen ? frozen.jobId : ('suite5_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8));
        const five = frozen || {
            jobId, fileKey, rowNum, productId: product.id, category: snapshot.category(),
            excelRowSpec: spec, steps: ordered, keys: wanted,
            main: { dataUrl: mainDataUrl, bytes: mainProbe.bytes || mainBlob.size, width: mainProbe.width, height: mainProbe.height, hash: await suiteContentHash(mainBlob) },
            generated: {}, done: {}, errors: []
        };
        if (!five.keys || !five.keys.length) five.keys = wanted;
        try { await persistSuiteFive(five); }
        catch (e) { throw new Error('任务冻结数据保存失败，未发送任何生成请求：' + e.message); }

        // 进度口径：整套按 5 张最终成品统计（跨任务补齐也计入）；指定重生成按本次要跑的步骤数，
        // 否则只跑 1 步也显示成 5 张进度（用户反馈"指定重生成变成整套套图"）。
        const total = targeted ? Math.max(1, selected.length) : SUITE_FIVE_TOTAL;
        let targetedDone = 0;
        const indexRecs = await SuiteCore.ResultStore().list(fileKey, rowNum).catch(() => []);
        const doneSet = new Set(restart ? [] : (indexRecs || []).map(r => String(r.key)));
        // 指定重生成从 0 开始数本次的步骤；整套才按历史成品算（否则 done 会取到 5，出现「5/1」）
        let doneCount = targeted ? 0 : SUITE_STEP_KEYS.filter(k => doneSet.has(k)).length;
        suiteSetProgress({ jobId, fileKey, rowNum, phase: 'preparing', done: doneCount, total });

        const ctxPost = {
            excelRow: window.ExcelRow.build(five.excelRowSpec),
            getHandle: async (decl) => {
                for (const id of ['assets', 'scripts']) {
                    const h = await loadSuiteDirHandle(id);
                    if (!h) continue;
                    if (decl.type === 'folder') return h;
                    if (decl.name) { try { return await h.getFileHandle(decl.name); } catch (_) {} }
                }
                return null;
            },
            transform: SuiteImageTransform.apply,
            createSurface: SuiteImageSdk.createSurface,
            draw: SuiteImageSdk.draw
        };

        // 一键整套：所有需要AI的步骤合并成一次请求。指定重生成保持逐步请求。
        if (!targeted && five.keys.length === SUITE_STEP_KEYS.length) {
            const aiSteps=selected.filter(s=>sourceOf[s.key]==='generated'&&!five.generated?.[s.key]?.dataUrl);
            if(aiSteps.length){
                const targetKeys=aiSteps.map(s=>String(s.key));
                suiteSetProgress({jobId,fileKey,rowNum,phase:'generating',done:doneCount,total});
                // 断点续跑：旧的合并任务若已结束（generated/失败/中断）或已不存在，就不能再等它，必须重新发起；
                // 只有仍在执行中的旧任务才复用，避免空等到 waitSuiteAcquired 的 100 秒超时。
                if(five.groupTaskId){
                    const prior=await suiteSend('suiteGetTask',{taskId:five.groupTaskId,summary:true});
                    // 探测失败（扩展超时/重载）不能等同于“任务已结束”，否则会重复发起同一批生图；保守按存活处理
                    const alive = (prior&&prior.ok)
                        ? !!(prior.task&&!['completed','failed','interrupted','generated'].includes(prior.task.stage))
                        : true;
                    if(!alive){five.groupTaskId=null;five.groupKeys=null;}
                }
                if(!five.groupTaskId){
                    const prompt='根据以下提示词生成 '+aiSteps.length+' 张图片，每个编号对应一张，严格按顺序输出，不要拼图，不要在图片上写编号。\n\n'+aiSteps.map((s,i)=>(i+1)+'、步骤 '+s.key+' '+s.name+'\n'+prompts[s.key]).join('\n\n')+'\n\n请直接生成对应的图片。';
                    const created=await suiteSend('suiteCreate',{task:{fileKey,rowNum,productId:five.productId,mode:'batch-gen',expectCount:aiSteps.length,targetKeys,prompt,assets:[{color:'main',filename:`row${rowNum}_main.png`,url:mainDataUrl,fileKey,row:rowNum}],configSnapshot:{model:aiSteps[0].model||'5.0',ratio:aiSteps[0].ratio||'1:1'}}});
                    if(!created.ok||!created.task)throw Error(created.error||'整套生成任务创建失败');
                    five.groupTaskId=created.task.taskId;five.groupKeys=targetKeys;await persistSuiteFive(five);
                    suiteTaskIdentities.set(five.groupTaskId,{fileKey,rowNum});
                    const run=await suiteSend('suiteRun',{taskId:five.groupTaskId},600000);if(!run.ok)throw Error(run.error||'整套生成请求失败');
                }
                const task=await waitSuiteAcquired(five.groupTaskId);
                const recognizedKeys=five.groupKeys||targetKeys;
                const recognized=await SuiteCore.recognize(task.images||[],recognizedKeys.map(key=>({key})),{expectCount:recognizedKeys.length});
                if(!recognized.ok)throw Error('整套生成结果识别失败：'+recognized.error);
                for(const result of recognized.results){const blob=await suiteBlobFromDataUrl(result.url);if(!blob.size)throw Error(result.key+'生成结果为空');five.generated[result.key]={dataUrl:result.url,bytes:blob.size,taskId:five.groupTaskId};}
                await persistSuiteFive(five);
                const closed=await suiteSend('suiteProgress',{report:{taskId:five.groupTaskId,final:true,finalStage:'generated',diag:['整套AI原图已缓存，等待分别后处理保存']}});
                if(!closed.ok)throw Error(closed.error||'生成任务状态保存失败');
            }
        }
        // 按配置顺序分别后处理和保存；一键整套复用上方合并请求的结果。
        for (let i = 0; i < selected.length; i++) {
            const step = selected[i];
            const key = String(step.key);
            if (five.done && five.done[key]) { continue; }
            const source = sourceOf[key];
            let inputBlob;
            if (source === 'generated') {
                suiteSetProgress({ jobId, fileKey, rowNum, phase: 'generating', done: doneCount, currentKey: key, total });
                if (btn) btn.textContent = `⏳ 生成中 ${key} ${step.name}（${doneCount}/${total}）`;
                updateSuiteStatus(`⏳ 套图 ${doneCount}/${total}｜${key} ${step.name}：生成中`);
                let gen = five.generated && five.generated[key];
                if (!gen || !gen.dataUrl) {
                    // 生成步骤只在这里创建一次豆包请求；111/444 永远不会走到这个分支。
                    gen = await suiteGenerateOneStep({ step, prompt: prompts[key], mainDataUrl, fileKey, rowNum, product: frozen ? { id: five.productId, row: rowNum } : product });
                    five.generated[key] = { dataUrl: gen.dataUrl, bytes: gen.bytes, width: gen.width, height: gen.height, taskId: gen.taskId };
                    await persistSuiteFive(five);
                    // 生成子任务到此结束：这是独立的终态 generated，只表示「原图已获取并缓存」，
                    // 不代表成品已后处理/已保存（成品语义仍是 saved/completed）；下一生成步骤因此可继续。
                    try {
                        await suiteSend('suiteProgress', { report: {
                            taskId: gen.taskId, final: true, finalStage: 'generated',
                            results: [{ key, acquired: true, saved: false, cached: true, bytes: gen.bytes }],
                            diag: [`${key} 原图已缓存进作业冻结记录（未后处理、未保存成品）`]
                        } });
                    } catch (_) {}
                } else {
                    updateSuiteStatus(`⏳ 套图 ${doneCount}/${total}｜${key} ${step.name}：复用已生成结果（不重新消耗生图额度）`);
                }
                inputBlob = await suiteBlobFromDataUrl(gen.dataUrl);
            } else {
                // 直接使用产品主图：111、444 各自从冻结的原始主图开始，互不作为输入。
                suiteSetProgress({ jobId, fileKey, rowNum, phase: 'processing', done: doneCount, currentKey: key, total });
                if (btn) btn.textContent = `⏳ 后处理 ${key} ${step.name}（${doneCount}/${total}）`;
                updateSuiteStatus(`⏳ 套图 ${doneCount}/${total}｜${key} ${step.name}：直接使用产品主图，后处理中`);
                inputBlob = mainBlob;
            }

            suiteSetProgress({ jobId, fileKey, rowNum, phase: 'processing', done: doneCount, currentKey: key, total });
            if (btn) btn.textContent = `⏳ 后处理 ${key} ${step.name}（${doneCount}/${total}）`;
            const post = await SuitePostprocess.runStep(step, key, inputBlob, ctxPost);
            if (!post.ok) throw new Error(`${key} ${step.name}：后处理失败 ${post.error || ''}`);

            suiteSetProgress({ jobId, fileKey, rowNum, phase: 'saving', done: doneCount, currentKey: key, total });
            if (btn) btn.textContent = `⏳ 保存 ${key} ${step.name}（${doneCount}/${total}）`;
            const saved = await suiteSaveOne({ key, blob: post.output, fileKey, rowNum, jobId });
            five.done[key] = { filename: saved.filename, bytes: saved.bytes, width: saved.width, height: saved.height, mode: saved.mode, applied: post.applied || 'none' };
            doneSet.add(key);
            doneCount = targeted ? (++targetedDone) : SUITE_STEP_KEYS.filter(k => doneSet.has(k)).length;
            suiteSetProgress({ jobId, fileKey, rowNum, phase: doneCount >= total ? 'completed' : 'generating', done: doneCount, currentKey: key, total });
            await persistSuiteFive(five);
            updateSuiteStatus(`${targeted ? '✅ 指定重生成' : '✅ 套图'} ${doneCount}/${total}｜${key} ${step.name} 已保存：${saved.filename}`);
        }

        // ⑧ 完成：清冻结、同步角标（同一 fileKey+rowNum 的 111/222/333/444/666 全部存在成品才显示「套图」）
        await clearSuiteFive(fileKey, rowNum);
        suitePendingNumbering = null;
        const savedWhere = outputFallback ? `下载/${outputStatus.name}/（下载记录校验）` : `产品套图目录 ${outputStatus.name}（磁盘回读校验）`;
        const finalRecs = await SuiteCore.ResultStore().list(fileKey, rowNum).catch(() => []);
        const haveKeys = new Set((finalRecs || []).map(r => String(r.key)));
        const missingKeys = SUITE_STEP_KEYS.filter(k => !haveKeys.has(k));
        // 指定重生成只跑部分步骤，缺的另外几张不是本次目标，不能报"缺 111/222…"。
        if (missingKeys.length && !targeted) {
            suiteSetProgress({ jobId, fileKey, rowNum, phase: 'completed', done: SUITE_STEP_KEYS.filter(k => haveKeys.has(k)).length, total: SUITE_FIVE_TOTAL });
            await syncSuiteBadge(fileKey, rowNum);
            updateSuiteStatus(`⚠️ 本任务已保存 ${SUITE_FIVE_TOTAL - missingKeys.length}/${SUITE_FIVE_TOTAL} 张；缺 ${missingKeys.join('/')}，暂不显示「套图」角标`);
        } else {
            suiteSetProgress({ jobId, fileKey, rowNum, phase: 'completed', done: targeted ? total : SUITE_FIVE_TOTAL, total: targeted ? total : SUITE_FIVE_TOTAL });
            await syncSuiteBadge(fileKey, rowNum);
            if (targeted) {
                const names = selected.map(s => `${s.key} ${s.name}`).join('、');
                updateSuiteStatus(`✅ 指定重生成完成：${names}｜${savedWhere}`);
                showToast(`✅ 指定重生成完成（${selected.length} 张：${names}）`);
            } else {
                updateSuiteStatus(`✅ 套图完成：111/222/333/444/666 五张成品已保存并校验｜${savedWhere}`);
                showToast('✅ 套图完成（五张成品已保存）');
            }
        }
        if (currentProduct && currentProduct.row === rowNum && currentFileKey() === fileKey) await renderSuiteImages(currentProduct);
        return null;
    } catch (e) {
        // 保留错误信息；用户点击“继续”会从本产品整套重新生成。
        // error 文案同时写入自动状态：套图队列靠它识别「豆包额度已用完」并整批暂停（runSuiteFiveJob 会吞异常）。
        const state = readSuiteAutoState();
        const errText = String((e && e.message) || e || '');
        if (state && state.jobId) saveSuiteAutoState({ ...state, phase: 'error', paused: true, error: errText });
        updateSuiteStatus(`❌ ${errText}`);
        showToast(`❌ ${errText}`);
        return null;
    } finally {
        suiteStatusOwner = null;
        suiteTaskRunning = false;
        hideSuiteAreaIfEmpty();
        renderSuiteAutoControls();
        if (btn) { btn.disabled = false; btn.textContent = '🖼️ 一键生成套图'; }
    }
}

// 编号候选展示：让用户核对/调整五编号对应关系（不重新生图）
function renderSuitePendingNumbering() {
    const grid = document.getElementById('suiteImagesGrid');
    const area = document.getElementById('suiteImagesArea');
    if (!grid || !area || !suitePendingNumbering) return;
    area.style.display = 'block';
    const { candidates } = suitePendingNumbering;
    const opts = candidates.map((c, i) => `<option value="${i}">候选 ${i + 1}</option>`).join('');
    grid.innerHTML = candidates.map((c, i) => `
        <div class="color-img-item">
            <img src="${c.url || ''}" style="cursor:zoom-in;" onclick="openImageModal(this.src)">
            <span class="color-name">${c.key} · 候选 ${i + 1}（未确认）</span>
        </div>`).join('') + `
        <div style="grid-column:1/-1;display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:12px;">
            ${candidates.map(c => `<label style="font-size:11px;color:rgba(255,255,255,0.6);display:flex;gap:4px;align-items:center;">${c.key}
                <select id="suiteMap_${c.key}" style="font-size:11px;background:rgba(0,0,0,0.3);color:#fff;border:1px solid rgba(255,255,255,0.2);border-radius:6px;">${opts}</select></label>`).join('')}
        </div>
        <div style="grid-column:1/-1;display:flex;gap:8px;justify-content:center;margin-top:8px;">
            <button class="batch-color-btn" style="padding:6px 16px;" onclick="confirmSuiteNumbering()">✅ 确认编号并继续（后处理→保存→完成）</button>
        </div>`;
    // 默认预选为当前候选顺序（用户可逐个改）
    candidates.forEach((c, i) => { const el = document.getElementById('suiteMap_' + c.key); if (el) el.value = String(i); });
}

// 确认编号 → 继续后处理/保存/索引（不重新发豆包请求）
async function confirmSuiteNumbering() {
    if (suiteTaskRunning) return;
    if (!suitePendingNumbering) { showToast('ℹ️ 没有待确认的编号'); return; }
    if (!currentProduct || currentProduct.row !== suitePendingNumbering.rowNum || currentFileKey() !== suitePendingNumbering.fileKey) { showToast('请切回该任务产品后确认'); return; }
    const { candidates, taskId, fileKey, rowNum, steps } = suitePendingNumbering;
    const assignment = {};
    for (const c of candidates) {
        const el = document.getElementById('suiteMap_' + c.key);
        assignment[c.key] = el ? Number(el.value) : c.index;
    }
    let assigned;
    try { assigned = SuiteCore.applyNumberingAssignment(candidates, assignment); }
    catch (e) { showToast('❌ 编号分配无效：' + e.message); return; }
    await finishSuiteTask({ taskId, fileKey, rowNum, steps, assigned });
}

// 任务数据冻结：任务开始后切换产品、重导 Excel、改面板步骤都不改变本任务的数据与步骤配置。
// 解析顺序（只有第一条会「现场派生」，其余都是复用已冻结的那一份）：
//   ① 内存里的冻结规格 → ② 已落盘的冻结记录（任务启动时保存的那一份）→ ③ 首次冻结：按当前 Excel 派生一次
// 若任务是从记录恢复的、却找不到冻结记录 → 明确报错并停止，绝不拿当前导入的 Excel 顶替。
async function freezeSuiteTaskData(pending, fileKey, rowNum, taskId) {
    if (pending && pending.excelRowSpec) {
        return { snapshot: window.ExcelRow.build(pending.excelRowSpec), spec: pending.excelRowSpec, steps: pending.steps || null };
    }
    const stored = await readSuiteFreeze(fileKey, rowNum, taskId || (pending && pending.taskId));
    if (stored) {
        if (pending) { pending.excelRowSpec = stored.excelRowSpec; pending.steps = pending.steps || stored.steps; }
        return { snapshot: window.ExcelRow.build(stored.excelRowSpec), spec: stored.excelRowSpec, steps: (pending && pending.steps) || stored.steps };
    }
    if (pending && pending.restored) {
        throw new Error(`无法恢复任务 ${pending.taskId || ''} 的冻结行数据与步骤配置（本地记录缺失或已损坏）；已停止执行，请重新生成该产品后再确认，不会用当前导入的 Excel 替代`);
    }
    if (String(fileKey || '') !== currentFileKey()) {
        throw new Error(`当前导入的 Excel 与任务不符（任务文件 ${fileKey || '未知'}），无法读取该任务的产品行数据；请切回任务对应的 Excel 后重试`);
    }
    const spec = excelRowSpec(rowNum);
    const snapshot = window.ExcelRow.build(spec);
    const steps = suiteFrozenSteps(snapshot);
    if (pending) { pending.excelRowSpec = spec; pending.steps = steps; }
    return { snapshot, spec, steps };
}

// 读回任务启动时冻结的那一份：按 fileKey+rowNum 定位，并用 taskId 排除「同一行但另一个任务」的复用
async function readSuiteFreeze(fileKey, rowNum, taskId) {
    let record = null;
    try { record = await SuiteCore.ResultStore('polo_suite_pending').get(fileKey, rowNum, 'rowfreeze'); }
    catch (e) { return null; }
    const meta = record && record.meta;
    if (!meta || !meta.excelRowSpec) return null;
    if (taskId && meta.taskId && meta.taskId !== taskId) return null;
    return meta;
}

// 首次冻结后必须在【执行后处理之前】把冻结数据与步骤配置可靠落盘；保存失败由调用方直接停止执行。
// 已冻结过的任务保持原数据不变（幂等，不覆盖），保证「恢复的任务用的一定是任务启动时那一份」。
// target 只需带 { fileKey, rowNum, taskId }（可以是待确认状态，也可以是任务身份）。
async function persistSuiteFreeze(target, frozen) {
    if (!target || !frozen || !frozen.spec) return;
    const { fileKey, rowNum, taskId } = target;
    const store = SuiteCore.ResultStore('polo_suite_pending');
    const existing = await store.get(fileKey, rowNum, 'rowfreeze');
    suiteStatusOwner = fileKey + '::' + rowNum;
    const meta = existing && existing.meta;
    if (meta && meta.excelRowSpec && (!meta.taskId || meta.taskId === taskId)) return;
    await store.put({
        fileKey, rowNum, key: 'rowfreeze', taskId,
        meta: { taskId, excelRowSpec: frozen.spec, steps: frozen.steps }
    });
}

async function finishSuiteTask({ taskId, fileKey, rowNum, steps, assigned }) {
    suiteStatusOwner = fileKey + '::' + rowNum;
    const product = { row: rowNum };
    const btn = document.getElementById('suiteGenBtn');
    suiteTaskRunning = true;
    if (btn) { btn.disabled = true; btn.textContent = '⏳ 处理中...'; }
    try {
        await assertSuiteTaskActive(taskId, fileKey, rowNum);
        const pending = suitePendingNumbering && suitePendingNumbering.taskId === taskId ? suitePendingNumbering : null;
        // 任务绑定的行数据与步骤：与提示词渲染同一份快照；冻结后不受切换产品 / 重导 Excel / 改面板影响。
        const frozen = await freezeSuiteTaskData(pending, fileKey, rowNum, taskId);
        const taskSteps = frozen.steps || steps;
        // 冻结数据与步骤配置必须在【执行后处理之前】可靠落盘：保存失败即停止执行，
        // 否则刷新后无从恢复，只能拿当前导入的 Excel 顶替（明确禁止）。
        try {
            await persistSuiteFreeze(pending || { fileKey, rowNum, taskId }, frozen);
            if (pending) await persistSuitePending(pending);
        } catch (e) {
            throw new Error(`任务冻结数据保存失败，已停止执行（不会用当前导入的 Excel 替代）：${e.message}`);
        }
        if(!suiteAutoCheckpoint(taskId,'processing',1))return null;
        // 执行前的后处理配置校验（统一预检）：在任何脚本运行前，逐条检查所有【已选定】步骤的后处理类型与脚本内容。
        // 报错必须同时给出【输出编号 + 步骤名 + 脚本名】，绝不静默跳过；不要求输出目录授权（否则会遮盖空脚本错误）。
        // 资源不在此处假通过：执行期按【任务冻结快照 + 真实授权句柄】验证。
        const keyList = assigned.map(a => a.key);
        const ppConfig = SuitePostprocess.checkConfig(taskSteps, keyList);
        if (!ppConfig.ok) {
            const detail = ppConfig.problems.join('；');
            updateSuiteStatus(`❌ 后处理配置校验未通过，未执行任何脚本：${detail}（原始图已保留，可「仅重试处理」）`);
            showToast(`❌ 后处理配置校验未通过：${ppConfig.problems[0] || ''}`);
            await suiteSend('suiteProgress', { report: { taskId: taskId, stage: 'acquired', diag: [`后处理配置校验未通过：${detail}`] } });
            return null;
        }
        // ⑦ 后处理（按【已确认】编号；未配置='none' 直接用原图）—— 必须在写盘前完成
        const ctxPost = {
            // 行数据只来自任务冻结快照，脚本按真实 Excel 列名读取（与提示词同一份数据）
            excelRow: frozen.snapshot,
            // 资源只用【真实授权句柄】：优先「后处理脚本目录」等已授权目录
            getHandle: async (decl) => {
                const ids = decl.type === 'folder' ? ['assets', 'scripts'] : ['assets', 'scripts'];
                for (const id of ids) {
                    const h = await loadSuiteDirHandle(id);
                    if (!h) continue;
                    if (decl.type === 'folder') return h;
                    if (decl.name) { try { return await h.getFileHandle(decl.name); } catch (_) {} }
                }
                return null;
            },
            transform: SuiteImageTransform.apply,
            // 图像能力：按输入图尺寸创建画布（原图已绘制）+ 共享绘制函数集（ctx.draw 单一真源）。
            // 脚本不自己创建 canvas、不自己导出图片，由中枢在脚本结束后导出。
            createSurface: SuiteImageSdk.createSurface,
            draw: SuiteImageSdk.draw
        };
        const signature = JSON.stringify(assigned.map(a => [a.key, a.index]));
        let post;
        if (pending && pending.processed && pending.processedAssignment === signature) {
            post = { ok: true, results: pending.processed };
        } else {
            const blobsByKey = {};
            for (const a of assigned) {
                const response = await fetch(a.url, { cache: 'no-store' });
                if (!response.ok) throw new Error('结果图片读取失败');
                blobsByKey[a.key] = await response.blob();
            }
            post = await SuitePostprocess.runAll(taskSteps, assigned.map(a => a.key), blobsByKey, ctxPost);
            if (post.ok && pending) {
                pending.processed = post.results;
                pending.processedAssignment = signature;
                await persistSuitePending(pending);
            }
        }
        if (!post.ok) {
            // 报错必须同时给出【输出编号 + 步骤显示名】，不能只给编号
            const failedLabel = post.failedKeys.map(k => {
                const hit = SUITE_OUTPUTS.find(o => o[0] === String(k));
                return hit ? `${k} ${hit[1]}` : String(k);
            }).join('/');
            updateSuiteStatus(`❌ 后处理失败：${failedLabel} — ${post.results.filter(r => !r.ok).map(r => r.error).join('；')}（原始图已保留，可「仅重试处理」）`);
            showToast(`❌ 后处理失败：${failedLabel}`);
            await suiteSend('suiteProgress', { report: { taskId: taskId, stage: 'acquired', diag: [`后处理失败：${failedLabel}`] } });
            return null;
        }
        if(!suiteAutoCheckpoint(taskId,'saving',2))return null;
        const items = post.results.map(r => ({ key: r.key, blob: r.output }));

        // ⑧ 写盘 + 重新读取校验：输出目录句柄只存在于扩展源，页面无法直接持有；
        //    由扩展经受信任消息桥，用既有「🖼️ 产品套图目录」句柄完成「写入 → 回读校验」，再返回结果。
        //    文件名仍按 fileKey+行号+任务号 生成（既有防跨文件/跨产品覆盖约束不变），不新增任何路径配置。
        const writeFiles = [];
        for (const it of items) {
            writeFiles.push({
                key: it.key,
                filename: String(it.key) + '.png',
                dataUrl: await suiteBlobToDataUrl(it.blob)
            });
        }
        await assertSuiteTaskActive(taskId, fileKey, rowNum);
        // 落盘子目录与颜色图同构：Polo发品_颜色图/<文件名>/rowN/，与 suiteSaveOne 一致，不再平铺根层。
        const saveSubdir = (loadedFileName ? loadedFileName + '/' : '') + 'row' + rowNum;
        const savedResp = await suiteSend('suiteWriteOutput', { subdir: saveSubdir, files: writeFiles }, 60000);
        const saved = savedResp && Array.isArray(savedResp.results)
            ? { ok: !!savedResp.ok, results: savedResp.results, savedCount: savedResp.savedCount || 0, failedKeys: savedResp.failedKeys || [] }
            : null;
        // 如实标注落盘通道与校验级别：downloads = 下载通道（按下载记录校验），不等于磁盘回读解码。
        if (saved && savedResp.mode === 'downloads') {
            updateSuiteStatus(`ℹ️ 产品套图目录未授权，已改走下载通道落盘到「下载/${savedResp.dirName || ''}/」，按下载记录校验（非磁盘回读解码）`);
        }
        if (!saved) {
            const reason = (savedResp && savedResp.error) || '扩展未响应';
            updateSuiteStatus(`❌ 套图输出目录不可用，未写入任何文件：${reason}（已获取并处理完成的 ${items.length} 张结果已保留）`);
            showToast(`❌ 输出目录不可用：${reason}`);
            await suiteSend('suiteProgress', { report: { taskId: taskId, stage: 'acquired', diag: ['写盘前：' + reason] } });
            return null;
        }
        if (!saved.ok) {
            updateSuiteStatus(`⚠️ 生成成功、保存失败：已保存 ${saved.savedCount}/5，失败编号 ${saved.failedKeys.join('/')}（结果已保留，可「仅重试保存」）`);
            showToast(`⚠️ 保存失败 ${saved.failedKeys.join('/')}，结果已保留`);
            const retryGrid = document.getElementById('suiteImagesGrid');
            if (retryGrid) retryGrid.innerHTML += '<button class="batch-color-btn" onclick="confirmSuiteNumbering()">仅重试保存（不重新生图或后处理）</button>';
            await suiteSend('suiteProgress', { report: { taskId: taskId, stage: 'acquired', results: saved.results, diag: [`写盘失败：${saved.failedKeys.join('/')}`] } });
            return null;
        }

        // ⑨ 先写索引，成功后才 saved → completed（避免"显示完成但索引写入失败"）
        const store = SuiteCore.ResultStore();
        try {
            const indexRecords = [];
            for (const it of items) {
                await assertSuiteTaskActive(taskId, fileKey, rowNum);
                const rec2 = saved.results.find(x => x.key === it.key);
                indexRecords.push({
                    fileKey, rowNum: product.row, key: it.key, taskId: taskId, blob: it.blob,
                    meta: { filename: rec2 && rec2.filename, bytes: rec2 && rec2.bytes, width: rec2 && rec2.width, height: rec2 && rec2.height, verified: true, contentHash: await suiteContentHash(it.blob), postprocess: (post.results.find(p => p.key === it.key) || {}).applied || 'none' }
                });
            }
            await store.putMany(indexRecords);
        } catch (e) {
            updateSuiteStatus(`⚠️ 文件已保存但索引写入失败：${e.message}（文件在磁盘上可用；请刷新后重试恢复）`);
            showToast('⚠️ 索引写入失败，未标记完成');
            await suiteSend('suiteProgress', { report: { taskId: taskId, stage: 'saved', results: saved.results, diag: ['索引写入失败：' + e.message] } });
            return null;
        }
        await suiteProgressChecked({ taskId, fileKey, rowNum, stage: 'saved', results: saved.results });
        await suiteProgressChecked({ taskId, fileKey, rowNum, final: true, finalStage: 'completed', results: saved.results });
        await SuiteCore.ResultStore('polo_suite_pending').remove(fileKey, rowNum, 'pending');
        // 任务已完成 → 冻结记录一并清理，避免同一行后续任务误复用上一任务的冻结数据
        await SuiteCore.ResultStore('polo_suite_pending').remove(fileKey, rowNum, 'rowfreeze');
        suitePendingNumbering = null;
        const auto=readSuiteAutoState();if(auto?.taskId===taskId)saveSuiteAutoState({...auto,paused:false,phase:'completed',done:3});

        const savedWhere = savedResp.mode === 'downloads'
            ? `落盘位置：下载/${savedResp.dirName || ''}/（下载记录校验）`
            : `落盘位置：产品套图目录 ${savedResp.dirName || ''}（磁盘回读校验）`;
        updateSuiteStatus(`✅ 套图完成：${items.length} 张已后处理、保存、校验并写入索引（任务 ${taskId}）｜${savedWhere}`);
        showToast(`✅ 套图完成（${items.length} 张已保存并校验）`);
        addSuiteGeneratedBadge(rowNum);
        if (currentProduct && currentProduct.row === rowNum && currentFileKey() === fileKey) await renderSuiteImages(currentProduct);
        return null;
    } catch (e) {
        updateSuiteStatus(`❌ ${e.message}`);
        showToast(`❌ ${e.message}`);
        return null;
    } finally {
        const auto=readSuiteAutoState();
        if(auto&&auto.phase!=='completed')saveSuiteAutoState({...auto,paused:true});
        suiteStatusOwner = null;
        suiteTaskRunning = false;hideSuiteAreaIfEmpty();renderSuiteAutoControls();
        if (btn) { btn.disabled = false; btn.textContent = '🖼️ 一键生成套图'; }
    }
}

// 套图结果区：从 ResultStore 读取（fileKey+rowNum 绑定），重建有效预览
// - 不把临时 blob URL 当永久来源：每次渲染重新从已落盘记录生成
// - 释放上一轮 object URL，避免长期切换累积
// - 异步读取带身份检查，旧产品读完后不得覆盖当前产品
let suiteObjectUrls = [];
let suiteRenderSeq = 0;

function releaseSuiteObjectUrls() {
    for (const u of suiteObjectUrls) { try { URL.revokeObjectURL(u); } catch (_) {} }
    suiteObjectUrls = [];
}

// ============ 成品图压缩（1MB 以内 JPG，直接覆盖） ============
const SUITE_COMPRESS_TARGET = 1024 * 1024;
function suiteCompressNames(row) {
    return ['111', '222', '333', '444', '666', 'row' + row + '_white', 'row' + row + '_black', 'row' + row + '_gray', 'row' + row + '_navy'];
}
async function suiteCompressBlob(blob, target) {
    const bmp = await createImageBitmap(blob);
    const canvas = document.createElement('canvas');
    try {
        let scale = 1;
        for (let round = 0; round < 8; round++) {
            canvas.width = Math.max(64, Math.round(bmp.width * scale));
            canvas.height = Math.max(64, Math.round(bmp.height * scale));
            const g = canvas.getContext('2d');
            g.fillStyle = '#ffffff'; g.fillRect(0, 0, canvas.width, canvas.height);
            g.drawImage(bmp, 0, 0, canvas.width, canvas.height);
            // 5 档：先 0.88（多数图一档就够），不够再降。原来 8 档每档都要整图重编码，慢一倍。
            for (const q of [0.88, 0.8, 0.72, 0.62, 0.55]) {
                const out = await new Promise(r => canvas.toBlob(r, 'image/jpeg', q));
                if (out && out.size <= target) return out;
            }
            scale *= 0.85;
        }
        return null;
    } finally { bmp.close(); canvas.width = canvas.height = 0; }
}
// 清除指定行的"已保存"记录：草稿空了/缺项时用，清完后重跑这些行不会被"已保存过"跳过
async function clearSavedRowsPrompt() {
    const input = prompt('要清除「已保存」标记的行号（空格或逗号分隔）：\n例如 62 71 74 78');
    if (!input) return;
    const rows = input.trim();
    if (!rows) return;
    const resp = await new Promise(resolve => {
        chrome.runtime.sendMessage(EXTENSION_ID, { action: 'clearPublishSavedRows', rows, fileKey: currentFileKey() }, resolve);
    });
    if (!resp || !resp.ok) return showToast('❌ ' + ((resp && resp.error) || '清除失败'));
    const list = (resp.removed || []).join(', ');
    showToast(list ? `✅ 已清除 ${resp.removed.length} 行：${list}` : '⚠️ 这些行本来就没有保存记录');
    try { refreshPublishState(); } catch (_) {}
}

async function compressSuiteImages() {
    if (typeof PageDirectories === 'undefined' || !PageDirectories.handles || !PageDirectories.handles.colorImgDir) return showToast('请先在「路径配置」选择产品图片目录');
    if (!loadedFileName) return showToast('请先导入 Excel');
    if (!products.length) return showToast('没有产品');
    if (typeof ensurePsDirPermission === 'function') {
        const perm = await ensurePsDirPermission();
        if (perm && perm.ok === false) return showToast('产品图片目录未授权，无法压缩：' + (perm.reason || '请先在路径配置确认'));
    }
    if (!confirm('将把「' + loadedFileName + '」下全部已生成图片压到 1MB 以内，直接覆盖原图（PNG 会改存为同名 JPG 并删除旧 PNG）。确定继续？')) return;
    if (suiteTaskRunning || (typeof suiteBatchRunning !== 'undefined' && suiteBatchRunning)) return showToast('请先暂停正在运行的套图任务，再压缩图片');
    const btn = document.getElementById('suiteCompressBtn');
    const oldLabel = btn ? btn.textContent : '';
    if (btn) { btn.disabled = true; btn.textContent = '🗜️ 压缩中…'; }
    const fileFolder = loadedFileName;
    let done = 0, skipped = 0, savedBytes = 0; const failed = [];
    // 统一进度条接管：压缩期间显示 已处理/总数，可停止
    window.UnifiedTaskStarted?.();
    window.SuiteCompressState = { running: true, done: 0, total: products.length * 9, current: '', cancel: false };
    try {
        for (const p of products) {
            if (window.SuiteCompressState && window.SuiteCompressState.cancel) break;
            const row = p.row;
            const names = suiteCompressNames(row);
            let hits = [];
            try {
                const got = await PageDirectories.dispatch({ action: 'pageReadSuite', fileFolder, rowNum: row, keys: names });
                hits = (got && got.files) || [];
            } catch (e) {
                failed.push('行' + row + ' 读取失败：' + (e && e.message));
                if (/授权/.test(String(e && e.message))) break;
                continue;
            }
            // 同一行的图并发处理：原来串行，每张要走 读→解码→编码→写→删 五步，行数一多就明显慢。
            // 实测（本机 3MB 图）：写一张 183ms，并发 6 时摊到 54ms；并发上限取 6，6 张解码约 70MB 内存，安全。
            const hitsToRun = hits.filter(Boolean);
            let abortRow = false;
            await (async () => {
                let cursor = 0;
                const workers = Array.from({ length: Math.min(6, hitsToRun.length) }, async () => {
                    while (!abortRow && !(window.SuiteCompressState && window.SuiteCompressState.cancel) && cursor < hitsToRun.length) {
                        const hit = hitsToRun[cursor++];
                        if (!hit.dataUrl) { window.SuiteCompressState.done++; continue; }
                        const name = String(hit.key);
                        window.SuiteCompressState.current = '行' + row + ' · ' + name;
                        const baseName = (hit.filename || '').toLowerCase();
                        // 已经是 jpg 且不超过 1MB 才跳过；PNG/WEBP 一律转（哪怕它本来就不大）
                        if (/[.]jpg$/.test(baseName) && hit.bytes <= SUITE_COMPRESS_TARGET) { skipped++; window.SuiteCompressState.done++; continue; }
                        try {
                            const blob = await (await fetch(hit.dataUrl)).blob();
                            const out = await suiteCompressBlob(blob, SUITE_COMPRESS_TARGET);
                            if (!out) { failed.push(hit.filename + '（压不到 1MB）'); window.SuiteCompressState.done++; continue; }
                            const dataUrl = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = () => rej(fr.error); fr.readAsDataURL(out); });
                            await PageDirectories.dispatch({ action: 'pageWriteImage', fileFolder, rowNum: row, filename: name + '.jpg', dataUrl });
                            // 只删这张图原本的扩展名：以前无条件删 png/jpeg/webp 三个，等于每张多两次空往返
                            const srcExt = (baseName.match(/[.](png|jpeg|webp|jpg)$/) || [])[1];
                            if (srcExt && srcExt !== 'jpg') {
                                await PageDirectories.dispatch({ action: 'pageDeleteFile', fileFolder, rowNum: row, filename: name + '.' + srcExt }).catch(() => {});
                            }
                            savedBytes += Math.max(0, hit.bytes - out.size);
                            done++;
                            window.SuiteCompressState.done++;
                        } catch (e) {
                            failed.push(hit.filename + '：' + (e && e.message));
                            window.SuiteCompressState.done++;
                            if (/授权|权限/.test(String(e && e.message))) abortRow = true;
                        }
                    }
                });
                await Promise.all(workers);
            })();
            if (abortRow) break;
            updateSuiteStatus('🗜️ 压缩中：已完成 ' + done + ' 张（当前行 ' + row + '）');
        }
    } finally {
        if (btn) { btn.disabled = false; btn.textContent = oldLabel || '🗜️ 压缩图片'; }
        if (window.SuiteCompressState) { window.SuiteCompressState.running = false; window.SuiteCompressState.cancel = false; }
    }
    const mb = (savedBytes / 1048576).toFixed(1);
    try { if (typeof renderSuiteImages === 'function' && currentProduct) await renderSuiteImages(currentProduct); } catch (_) {}
    updateSuiteStatus('🗜️ 压缩完成：' + done + ' 张压到 1MB 内，' + skipped + ' 张跳过' + (failed.length ? '，' + failed.length + ' 张失败（详见控制台）' : '') + '，共省 ' + mb + 'MB');
    showToast('✅ 压缩完成：' + done + ' 张，省 ' + mb + 'MB');
    if (failed.length) console.warn('[压缩] 失败明细', failed);
}

async function renderSuiteImages(product) {
    const area = document.getElementById('suiteImagesArea');
    const grid = document.getElementById('suiteImagesGrid');
    if (!area || !grid) return;
    renderSuiteAutoControls();
    const row = product ? product.row
        : (currentProduct ? currentProduct.row : null);
    if (row === null || row === undefined) { area.style.display = 'none'; return; }
    area.style.display = 'block';

    const seq = ++suiteRenderSeq;
    const fileKey = currentFileKey();
    const stale = () => seq !== suiteRenderSeq || fileKey !== currentFileKey() || !currentProduct || currentProduct.row !== row;

    const resp = await suiteSend('suiteListTasks', { fileKey, rowNum: row });
    if (stale()) return;                                   // 期间已切产品/重渲染 → 丢弃
    const tasks = (resp && resp.ok && resp.tasks) ? resp.tasks : [];
    let t = tasks[0];
    if(t?.stage==='acquired'&&!t.images){const full=await suiteSend('suiteGetTask',{taskId:t.taskId});t=full.task;if(stale())return;}

    let recs = [];
    try {
        const store = SuiteCore.ResultStore();
        recs = await store.list(fileKey, row);
    } catch (e) { recs = []; }
    if (stale()) return;

    const pendingRecord = await SuiteCore.ResultStore('polo_suite_pending').get(fileKey, row, 'pending');
    if (stale()) return;
    if (pendingRecord && pendingRecord.meta && pendingRecord.meta.pending) {
        releaseSuiteObjectUrls();
        suitePendingNumbering = pendingRecord.meta.pending;
        // 恢复的任务一律用「任务启动时冻结的那一份」行数据与步骤配置；
        // 记录缺失时只标记 restored，由确认阶段明确报错，绝不用当前导入的 Excel 顶替。
        suitePendingNumbering.restored = true;
        if (!suitePendingNumbering.excelRowSpec) {
            const freeze = await readSuiteFreeze(fileKey, row, suitePendingNumbering.taskId);
            if (stale()) return;
            if (freeze) {
                suitePendingNumbering.excelRowSpec = freeze.excelRowSpec;
                suitePendingNumbering.steps = suitePendingNumbering.steps || freeze.steps;
            }
        }
        suitePendingNumbering.candidates = suitePendingNumbering.candidates.map(c => { const url = URL.createObjectURL(c.blob); suiteObjectUrls.push(url); return Object.assign({}, c, { url }); });
        if(suitePendingNumbering.automatic){renderSuiteAutoControls();if(!suiteTaskRunning)await resumeSuiteAuto();}
        else renderSuitePendingNumbering();
        return;
    }
    const auto=readSuiteAutoState();
    if(auto&&auto.taskId===t?.taskId&&auto.fileKey===fileKey&&auto.rowNum===row&&auto.phase!=='completed'){
        renderSuiteAutoControls();if(!auto.paused&&!suiteTaskRunning)await resumeSuiteAuto();return;
    }
    // 图片已获取但识别/待确认写入中断时，从原任务和冻结记录恢复，绝不重新生成。
    if (t && t.stage === 'acquired' && t.images && t.images.length) {
        const freeze = await readSuiteFreeze(fileKey,row,t.taskId);
        if (stale()) return;
        if (freeze) {
            const recognized=await SuiteCore.recognize(t.images,(t.targetKeys||[]).map(key=>({key})),{expectCount:t.expectCount});
            if (recognized.ok) {
                suitePendingNumbering={taskId:t.taskId,fileKey,rowNum:row,steps:freeze.steps,excelRowSpec:freeze.excelRowSpec,restored:true,
                    candidates:recognized.results.map((r,index)=>({key:r.key,index,url:r.url,fingerprint:r.fingerprint||null,source:'appearance-order'}))};
                await persistSuitePending(suitePendingNumbering);
                if(stale())return;
                renderSuitePendingNumbering();
                updateSuiteStatus('✅ 已恢复已有生成结果，请确认编号后继续（不会重新生图）');
                return;
            }
        }
    }
    // 磁盘核验同样由扩展在自身源用既有输出目录句柄回读（句柄不可跨源），页面只负责展示结果。
    // 核验目标目录与写入同构：Polo发品_颜色图/<文件名>/rowN/（与颜色图同一子目录层级）。
    // savedAt 一并下发：下载通道核验时用它排除「早于本次保存」的旧下载记录（旧记录不能证明文件还在磁盘上）。
    const verifySubdir = (loadedFileName ? loadedFileName + '/' : '') + 'row' + row;
    const verifyRecs = recs.map(r => ({ key: String(r.key), filename: (r.meta && r.meta.filename) || '', bytes: (r.meta && r.meta.bytes) || 0, contentHash: (r.meta && r.meta.contentHash) || '', savedAt: (r.meta && r.meta.savedAt) || r.savedAt || 0 }));
    const verifyResp = await suiteSend('suiteVerifyOutput', { subdir: verifySubdir, records: verifyRecs }, 30000);
    const health = verifyResp && Array.isArray(verifyResp.items)
        ? { items: verifyResp.items, unverified: verifyResp.unverified || [] }
        : { items: recs.map(r => ({ key: String(r.key), status: 'no-permission', detail: (verifyResp && verifyResp.error) || '输出目录不可用，无法核验（不等于文件缺失）' })), unverified: recs.map(r => String(r.key)) };
    if (stale()) return;
    releaseSuiteObjectUrls();
    const byKey = {};
    for (const r of recs) byKey[String(r.key)] = r;

    const keys = [...new Set([...SUITE_OUTPUTS.map(o => o[0]), ...recs.map(r => String(r.key))])];

    // 图片以磁盘为准：先按 <文件名>/rowN/<编号>.png 现读，读不到才回退旧缓存（兼容历史数据）。
    const diskMap = {};
    let diskError = '';
    try {
        if (typeof PageDirectories !== 'undefined' && PageDirectories.handles && PageDirectories.handles.colorImgDir) {
            if (PageDirectories.ready && typeof PageDirectories.ready.then === 'function') await PageDirectories.ready.catch(() => {});
            const got = await PageDirectories.dispatch({ action: 'pageReadSuite', fileFolder: loadedFileName || '', rowNum: row, keys: SUITE_OUTPUTS.map(o => o[0]) });
            for (const f of (got && got.files) || []) if (f && f.dataUrl) diskMap[f.key] = f.dataUrl;
        } else {
            diskError = '未配置产品图片目录';
        }
    } catch (e) {
        // 以前这里静默吞错，于是"磁盘读不到"会悄悄退回缓存图，看着像没问题。
        // 用户明确要求：套图只认磁盘。读不到就把原因说出来。
        diskError = String((e && e.message) || e);
    }
    if (stale()) return;
    const diskCount = Object.keys(diskMap).length;

    if (!t && recs.length === 0 && diskCount === 0) {
        // 任务、记录、磁盘三处都没有 → 整个套图区隐藏（和颜色图区一致：没有就不占位置）
        area.style.display = 'none';
        return;
    }


    // 一张图都没有（且任务不在进行中）→ 整区隐藏，不留空编号占位
    const TERM_EARLY = (typeof SuiteTaskStore !== 'undefined' && Array.isArray(SuiteTaskStore.TERMINAL))
        ? SuiteTaskStore.TERMINAL : ['completed', 'failed', 'interrupted', 'generated'];
    const hasAnyImage = Object.keys(diskMap).length > 0;
    if (!hasAnyImage && (!t || TERM_EARLY.includes(t.stage))) {
        area.style.display = 'none';
        const stHide = document.getElementById('suiteStatusText');
        if (stHide) stHide.textContent = '';
        return;
    }

    const cells = keys.map(key => {
        const r = byKey[key];
        let url = diskMap[key] || '';
        let fromDisk = !!diskMap[key];
        // 不再回退到 IndexedDB 缓存：只显示磁盘文件。读不到就留空编号（下面提示原因）。
        const check = health.items.find(h => h.key === key);
        // 缓存图不得冒充磁盘：磁盘核验明确缺失/损坏时，不显示缓存；磁盘读到的则不受影响。
        const diskBad = check && ['missing', 'corrupt', 'replaced', 'error'].includes(check.status);
        if (url && !fromDisk && diskBad) url = '';
        // 读不到就把编号留在原位（不再整块消失）
        const img = url ? `<img src="${url}" alt="${escapeHtml(key)} 套图" style="cursor:zoom-in;" onclick="openImageModal(this.src)">` : '';
        return `<div class="color-img-item${url ? '' : ' missing'}">${img}<span class="color-name">${key}</span></div>`;
    });
    grid.innerHTML = cells.join('');

    // 没有任何可显示的图，且任务已终态（失败/中断/完成/已生成）→ 整区隐藏，和颜色图一样不占位置
    const TERM = (typeof SuiteTaskStore !== 'undefined' && Array.isArray(SuiteTaskStore.TERMINAL))
        ? SuiteTaskStore.TERMINAL : ['completed', 'failed', 'interrupted', 'generated'];
    if (cells.length === 0 && (!t || TERM.includes(t.stage))) {
        area.style.display = 'none';
        const st0 = document.getElementById('suiteStatusText');
        if (st0) st0.textContent = '';
        return;
    }

    const st = document.getElementById('suiteStatusText');
    // 状态数字 = 磁盘上实际读到的张数（图以磁盘为准）
    const okCount = Object.keys(diskMap).length;
    // 只给人看人话：不显示 generated/failed 这类内部阶段名；完整阶段与错误打到控制台日志。
    const STAGE_CN = { preparing: '准备中', generating: '生成中', processing: '后处理中', saving: '保存中', acquired: '已取回', generated: '', completed: '', failed: '未完成', interrupted: '已中断' };
    const stageCn = (t && STAGE_CN[t.stage] !== undefined) ? STAGE_CN[t.stage] : '';
    const errCn = t && t.error ? String(t.error).replace(/^(执行阶段|后处理|保存)[:：]\s*/, '') : '';
    if (t && (t.stage || t.error)) console.warn(`[套图] row${row} stage=${t.stage || '-'} 磁盘=${okCount}/${SUITE_OUTPUTS.length}${t.error ? ' 错误=' + t.error : ''}`);
    if (st) {
        const parts = [stageCn, errCn, `磁盘已有 ${okCount}/${SUITE_OUTPUTS.length}`].filter(Boolean);
        if (diskError) parts.push('⚠️ 磁盘读取失败：' + diskError);
        st.textContent = parts.join(' · ');
        st.style.color = diskError ? '#ff7a45' : '';
    }
    // 「恢复已有结果」按钮已按用户要求移除：结果缺失时直接重新生成即可
}

async function recoverSuiteExistingResults(taskId,recoveryUrl) {
    if(suiteTaskRunning)return;
    const fileKey=currentFileKey(),rowNum=currentProduct?.row;
    try {
        const frozen=await readSuiteFreeze(fileKey,rowNum,taskId);
        if(!frozen)throw new Error('缺少原任务冻结数据，不能用当前表格替代');
        suiteTaskRunning=true;suiteStatusOwner = fileKey + '::' + rowNum;updateSuiteStatus('正在读取原豆包对话中的已有结果，不会重新生图…');
        const restored=await suiteSend('suiteRecoverResults',{taskId,fileKey,rowNum,recoveryUrl},60000);
        if(!restored.ok)throw new Error(restored.error||'恢复失败');
        await renderSuiteImages(currentProduct);
    } catch(e){updateSuiteStatus('❌ '+e.message);}finally{suiteStatusOwner=null;suiteTaskRunning=false;hideSuiteAreaIfEmpty();}
}

// 真实目录授权：只存路径字符串不算获得读写能力，必须持有并复查 FileSystemDirectoryHandle

const SUITE_DIR_DB = 'polo_suite_dir_handles';

function openSuiteDirDB() {
    return new Promise((resolve, reject) => {
        const req = indexedDB.open(SUITE_DIR_DB, 1);
        req.onupgradeneeded = () => { req.result.createObjectStore('handles'); };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
    });
}


async function loadSuiteDirHandle(dirId) {
    try {
        const db = await openSuiteDirDB();
        return await new Promise((resolve, reject) => {
            const tx = db.transaction('handles', 'readonly');
            const r = tx.objectStore('handles').get(dirId);
            r.onsuccess = () => resolve(r.result || null);
            r.onerror = () => reject(r.error);
        });
    } catch (_) { return null; }
}


function escapeHtml(s) {
    return String(s === undefined || s === null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function buildFilteredHighlightsText() {
    if (!currentProduct) return '';
    const highlights = parseHighlights(currentProduct.highlights || '');
    return highlights.filter((h, i) => !isSkipped(currentProduct.row, i, 'highlight')).map(h => {
        let line = `${h.num || ''}. ${h.label_en ? h.label_en + ': ' : ''}${h.desc_en}`;
        if (h.label_cn || h.desc_cn) {
            line += ` [${h.label_cn}]：${h.desc_cn}`;
        }
        return line;
    }).join('\n');
}

function getFilteredHighlightDescs() {
    if (!currentProduct) return [];
    const highlights = parseHighlights(currentProduct.highlights || '');
    return highlights
        .filter((h, i) => !isSkipped(currentProduct.row, i, 'highlight'))
        .map(h => (h.desc_en || '').trim())
        .filter(Boolean);
}

function buildFilteredFaqText() {
    if (!currentProduct) return '';
    const faqs = parseFaqs(currentProduct.faq || '');
    return faqs.filter((f, i) => !isSkipped(currentProduct.row, i, 'faq')).map(f => {
        let result = `Q: ${f.q_en} A: ${f.a_en}`;
        if (f.q_cn) result += ` 问：${f.q_cn}`;
        if (f.a_cn) result += ` 答：${f.a_cn}`;
        return result;
    }).join('\n');
}

function getFilteredProduct() {
    if (!currentProduct) return null;
    const filtered = { ...currentProduct };
    filtered.highlights = buildFilteredHighlightsText();
    filtered.faq = buildFilteredFaqText();
    filtered._highlightDescs = getFilteredHighlightDescs();
    return filtered;
}

const COLOR_PROMPT = '原图原样，只改衣服颜色，背景版型纹理光影不变，高清服装实拍 四张图片，一张白色，一张黑色，一张灰色，一张深藏青色 ，图片比例1：1，锐化不要太严重';
const COLOR_NAMES = ['white', 'black', 'gray', 'navy'];
// 单款等图超时：从派发回执起算（含切模式/上传/发送开销），实际留给生成约 90 秒
const BATCH_COLOR_COMPLETE_TIMEOUT = 100 * 1000;

let batchColorState = null;

const batchColorProgressEl = () => document.getElementById('batchColorProgress');
const batchColorStatusEl = () => document.getElementById('batchColorStatus');
const batchColorFillEl = () => document.getElementById('batchColorFill');
const batchColorCounterEl = () => document.getElementById('batchColorCounter');
const batchColorCurrentEl = () => document.getElementById('batchColorCurrent');

function startBatchColorChange() {
    if (!products || products.length === 0) {
        showToast('⚠️ 请先上传 Excel');
        return;
    }
    if (batchColorState && batchColorState.running) {
        showToast('⚠️ 批量换色正在进行中');
        return;
    }
    if (!extensionInstalled) {
        showToast('⚠️ 请确认扩展已安装');

// 批量换色统一启动入口：一键换色与「指定重生成」共用
function beginColorBatch(queueList, label, targeted=false, directoryReady=false) {
    if(typeof PageDirectories!=='undefined'&&!directoryReady){
        if(!PageDirectories.handles.colorImgDir)return showToast('请先在页面路径配置选择产品套图目录');
        PageDirectories.permissions().then(p=>{
            if(p.some(x=>x!=='granted'))return showToast('请在页面路径配置确认目录授权');
            beginColorBatch(queueList,label,targeted,true);
        }).catch(e=>showToast(e.message));return;
    }
    window.UnifiedTaskStarted?.();
    if(typeof targetedRegenerationRunning!=='undefined'&&targetedRegenerationRunning&&!targeted)return showToast("指定重生成正在执行");
    if (batchColorState && (batchColorState.inFlightRow || batchColorState.pendingAckRow)) {
        showToast('当前款尚未结束，未覆盖原换色任务'); return;
    }
    // 新批次（一键换色 / 指定重生成）：额度换号的已试账号与次数从零开始
    colorQuotaTriedAccounts = [];
    colorQuotaAttempts = 0;
    batchColorState = {
        running: true,
        stopRequested: false,
        queue: queueList.map((p, i) => ({ ...p, _idx: i })),
        currentIndex: 0,
        successCount: 0,
        failCount: 0,
        startTime: Date.now(),
        startRow: queueList[0].row,
        lastAdvancedRow: null,
        lastProcessedTimestamp: 0,
        pollTimer: null,
        label: label || '批量换色',
        failedRows: [],
        skippedRows: [],
        lastMemMB: 0,
        // 任务标识：完成消息据此拒绝旧任务/重复消息
        batchId: 'cb_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8),
        // 当前执行行；暂停清除执行等待并保留该行，继续时重新执行。
        // 暂停保留当前行，继续时生成新的执行身份并重做当前行。
        inFlightRow: null,
        inFlightSince: 0,
        pendingAckRow: null,    // 已委派但未确认接收的行（阻挡后续派发）
        fileKey: currentFileKey(),   // 任务创建时绑定文件：切文件后不被接管
        fileFolder: loadedFileName || '默认',
        timedOutRows: [],       // 已判超时、等待人工确认的行（迟到完成只提示，不重复入账）
        retryOf: null,          // 已重试过的行：再次超时即记失败跳过，不再无限重试
        freshChatNext: false,   // 下一款派发前先在豆包开新对话（防迟到图串款）
        supplementDone: false,  // 失败款补跑只做一轮
        pausedReason: ''
    };
    saveColorBatchState();

    // 新任务启动即清空「继续」待办（旧待办已被本次任务取代）
    setColorResumeRows([]);

    showBatchColorProgress();
    startBatchColorPolling();
    processNextBatchColor();
}

// 生成「行N · 序号X · 标题」预览行（确认框用）
function buildRowPreviewLines(queue, max = 15) {
    const lines = queue.slice(0, max).map(p => {
        const title = String(p.title_cn || p.title_en || '未命名').slice(0, 16);
        const idxText = (p.index === '' || p.index === null || p.index === undefined) ? '-' : p.index;
        return `  行${p.row} · 序号${idxText} · ${title}`;
    });
    if (queue.length > max) lines.push(`  … 等共 ${queue.length} 款`);
    return lines;
}

// ===== 「继续」：记住被停止 / 失败打断的剩余行，供续跑 =====
const COLOR_RESUME_KEY = 'polo_color_resume_rows';

function getColorResumeRows() {
    const raw = localStorage.getItem(COLOR_RESUME_KEY + '::' + colorBatchFileKey()) || '';
    return raw.split(/\s+/).filter(Boolean).map(Number).filter(n => Number.isInteger(n) && n > 0);
}

function setColorResumeRows(rows) {
    const list = Array.isArray(rows) ? rows.filter(r => Number.isInteger(r) && r > 0) : [];
    const uniq = [...new Set(list)]; // 按传入顺序去重
    const key = COLOR_RESUME_KEY + '::' + colorBatchFileKey();
    if (uniq.length === 0) {
        localStorage.removeItem(key);
    } else {
        localStorage.setItem(key, uniq.join(' '));
    }
    syncColorResumeButton();
}

// 兼容旧版本超时缓存；继续时清除，不作为操作门槛。
const COLOR_TIMEOUT_KEY = 'polo_color_timeout_rows';

function getColorTimeoutRows() {
    const raw = localStorage.getItem(COLOR_TIMEOUT_KEY + '::' + colorBatchFileKey()) || '';

}

function setColorTimeoutRows(rows) {

function syncBatchColorTimeoutActions() {

// 「停止 / 继续」一体按钮：运行中显示"停止"，暂停且有剩余时显示"继续"

// 重绘后从实际任务恢复文案、按钮和异常处理入口，不沿用模板默认状态。

// 从上次停止 / 失败处继续
function resumeColorBatch(directoryReady=false) {
    if(typeof PageDirectories!=='undefined'&&!directoryReady){
        PageDirectories.permissions().then(p=>{
            if(p.some(x=>x!=='granted'))return showToast('请在页面路径配置确认目录授权');
            resumeColorBatch(true);
        }).catch(e=>showToast(e.message));return;
    }
    if (batchColorState && colorBatchFileKey() !== currentFileKey()) {
        showToast('请先切回任务所属 Excel，再继续换色'); return;
    }
    if (batchColorState && batchColorState.running) {
        showToast('⚠️ 换色任务正在进行中');
        return;
    }
    if (!extensionInstalled) {
        showToast('⚠️ 请确认扩展已安装');
        return;
    }
    if (!products || products.length === 0) {
        showToast('⚠️ 请先上传 Excel');
        return;
    }

    if (batchColorState) {
        const state = batchColorState;
        // 兼容旧缓存中的在途/超时记录：当前款重新执行，不等待旧引擎。
        // 额度暂停 / 「不支持生图」暂停都不是本款故障：继续时先重跑当前款（失败款另有整批末尾补跑）。
        const quotaPaused = /额度|不支持生图/.test(state.pausedReason || '');
        const pausedRow = state.inFlightRow || state.pendingAckRow || getColorTimeoutRows()[0]
            || (quotaPaused && state.queue[state.currentIndex] ? state.queue[state.currentIndex].row : 0)
            || (state.failedRows || [])[0];
        const idx = state.queue.findIndex(p => p.row === pausedRow);
        if (idx >= 0) state.currentIndex = idx;
        state.inFlightRow = null; state.pendingAckRow = null; state.inFlightSince = 0;
        state.executionId = null;
        if (state.currentTimeoutId) clearTimeout(state.currentTimeoutId);
        stopBatchColorPolling();
        setColorTimeoutRows([]);
        state.timedOutRows = [];
        state.batchId = 'bc_' + Date.now() + '_' + Math.random().toString(36).slice(2);
        state.pausedReason = '';
        // 额度恢复后必须换新对话（复用 freshChatNext，由 sendNextBatchColor 一次性消费）。
        // 否则上一轮的额度气泡残留在旧对话里，内容脚本「最后一条气泡文本变化即算本轮新增」
        // 会把它当成本轮证据 → 点继续几秒内又弹「额度已用完」，反复继续都推不动。
        if (quotaPaused) state.freshChatNext = true;
        state.stopRequested = false;
        state.running = true;
        // 先让旧执行失效，再重新派发；不弹额外确认框。
        chrome.runtime.sendMessage(EXTENSION_ID, { action: 'pauseColorDispatch' }, response => {
            if (batchColorState !== state || state.stopRequested) return;
            if (chrome.runtime.lastError || !response || !response.ok) { state.running = false; restoreBatchColorUI(); showToast('无法连接扩展，请重新加载扩展'); return; }
            state.running = true;
            saveColorBatchState(); showBatchColorProgress();
            startBatchColorPolling(); sendNextBatchColor();
        });
        return;
    }
    const rows = getColorResumeRows();
    if (rows.length === 0) {
        showToast('ℹ️ 没有可继续的任务');
        return;
    }

    const byRow = new Map(products.map(p => [p.row, p]));
    const queue = [];
    const missing = [];
    for (const r of rows) {
        const p = byRow.get(r);
        if (p) queue.push(p); else missing.push(r);
    }
    if (queue.length === 0) {
        showToast(`⚠️ 剩余行号都不在当前 Excel：${missing.slice(0, 8).join(' ')}`);
        return;
    }

    beginColorBatch(queue, '继续');
}

// 解析行号输入：空格 / 英文逗号 / 中文逗号 / 分号 / 顿号 / 换行分隔，支持 a-b 区间
function parseRowNumbers(text) {
    const seen = new Set();
    const out = [];
    const push = (n) => {
        if (Number.isInteger(n) && n > 0 && !seen.has(n)) { seen.add(n); out.push(n); }
    };
    const norm = String(text || '').replace(/\s*[-~—]\s*/g, '-');
    for (const t of norm.split(/[\s,，;；、]+/).filter(Boolean)) {
        const m = t.match(/^(\d+)-(\d+)$/);
        if (m) {
            let a = parseInt(m[1], 10);
            let b = parseInt(m[2], 10);
            if (a > b) { const tmp = a; a = b; b = tmp; }
            if (b - a > 2000) continue; // 防误输入把区间撑爆
            for (let i = a; i <= b; i++) push(i);
        } else if (/^\d+$/.test(t)) {
            push(parseInt(t, 10));
        }
    }
    return out;
}

// 指定重生成与既有换色/套图管线串行协作；失败不自动重发。
function openTargetedRegenerationPanel() {
    const existing=document.getElementById('targetedRegenerationPanel');
    if(existing){existing.querySelector('input').focus();return Promise.resolve(null);}
    return new Promise(resolve=>{
        const priorFocus=document.activeElement;

        panel.innerHTML=`<form class="targeted-panel" role="dialog" aria-modal="true" aria-labelledby="targetedPanelTitle">
          <header><h3 id="targetedPanelTitle">指定重生成</h3><button type="button" data-close aria-label="关闭">×</button></header>
          <label for="targetedRowsInput">行号与步骤</label>
          <p id="targetedRowsHelp">0 = 颜色图；1、2、3… = 当前类目配置中的步骤顺序。只填行号则全部重新生成。</p>
          <input id="targetedRowsInput" autocomplete="off" placeholder="例如：4(0,3) 7(2) 9" aria-describedby="targetedRowsHelp" />
          <p class="targeted-example">支持多行和范围，例如 4-6(0,3)</p>

        field.value=localStorage.getItem('polo_color_rows_last')||'';
        let jobs=null;
        const refresh=()=>{
            jobs=null;submit.disabled=true;plan.replaceChildren();
            if(!field.value.trim())return;
            try{
                jobs=TargetedRegeneration.plan(TargetedRegeneration.parse(field.value),products,p=>suiteFrozenSteps(ExcelRow.build(excelRowSpec(p.row))));
                for(const job of jobs.slice(0,20)){
                    const line=document.createElement('div');
                    // 预览按实际派发批次写清楚：生成类合并成一条、原图后处理单独一条
                    const groups=[];
                    if(job.generatedKeys&&job.generatedKeys.length)groups.push('生成 '+job.generatedKeys.join('/')+'（1 条，等 '+job.generatedKeys.length+' 张）');
                    if(job.productKeys&&job.productKeys.length)groups.push('原图后处理 '+job.productKeys.join('/'));
                    line.textContent=buildRowPreviewLines([job.product])[0]+'：'+[job.color?'颜色图':'',...(groups.length?groups:job.labels)].filter(Boolean).join('、');
                    plan.append(line);
                }
                const note=document.createElement('p');note.textContent='共 '+jobs.length+' 行，按顺序执行；失败或暂停后停止后续任务。';plan.append(note);
                submit.disabled=false;
            }catch(e){plan.textContent=e.message;}
        };
        const close=value=>{panel.remove();priorFocus?.focus();resolve(value);};
        panel.querySelectorAll('[data-close]').forEach(button=>button.onclick=()=>close(null));
        field.oninput=refresh;
        panel.querySelector('form').onsubmit=e=>{e.preventDefault();refresh();if(jobs)close({input:field.value,jobs});};
        panel.onkeydown=e=>{
            if(e.key==='Escape'){e.preventDefault();close(null);}
            if(e.key==='Tab'){
                const controls=[...panel.querySelectorAll('button:not(:disabled),input')];
                if(e.shiftKey&&document.activeElement===controls[0]){e.preventDefault();controls.at(-1).focus();}
                else if(!e.shiftKey&&document.activeElement===controls.at(-1)){e.preventDefault();controls[0].focus();}
            }
        };
        refresh();field.focus();
    });
}

// 轮询兜底：网页通过消息查询扩展存储；不依赖网页中不存在的 chrome.storage API
function startBatchColorPolling() {
    if (!batchColorState || batchColorState.pollTimer) return;
    // 有在途行时即使已暂停也继续轮询：直接通知可能因断连丢失，需靠持久化完成事件补收
    const pollActive = () => !!batchColorState && (batchColorState.running || !!batchColorState.inFlightRow);
    batchColorState.pollTimer = setInterval(() => {
        if (!pollActive()) return;
        try {
            chrome.runtime.sendMessage(EXTENSION_ID, { action: 'getColorTaskEvents' }, (response) => {
                if (chrome.runtime.lastError || !response || !response.ok || !pollActive()) return;
                const result = response.events || {};
                if (result.color_task_stopped_event) handleColorTaskStopped(result.color_task_stopped_event);
                if (!pollActive()) return;
                if (result.color_task_accepted_event) handleColorTaskAccepted(result.color_task_accepted_event);
                const evt = result['color_task_complete_event'];
                if (!evt || !evt.rowNum || !evt.timestamp) return;
                if (batchColorState.executionId && evt.executionId !== batchColorState.executionId) return;
                // 只处理比上次处理过的新事件
                if (evt.timestamp <= batchColorState.lastProcessedTimestamp) return;
                // 只认当前在途行（暂停中同样成立）
                if (batchColorState.inFlightRow === evt.rowNum) {
                    console.log(`🎨 轮询兜底捕获完成事件: row${evt.rowNum}`);
                    batchColorState.lastProcessedTimestamp = evt.timestamp;
                    advanceBatchColorForRow(evt.rowNum, 'poll', evt.batchId, evt.results, evt.quota);
                }
            });
        } catch (e) {
            console.warn('批量换色轮询异常:', e);
        }
    }, 3000);
}

function stopBatchColorPolling() {
    if (batchColorState && batchColorState.pollTimer) {
        clearInterval(batchColorState.pollTimer);
        batchColorState.pollTimer = null;
    }
}

function processNextBatchColor() {
    if (!batchColorState || !batchColorState.running) return;
    if (batchColorState.stopRequested) {
        finishBatchColor(false);
        return;
    }
    if (batchColorState.currentIndex >= batchColorState.queue.length) {
        finishBatchColor(true);
        return;
    }
    sendNextBatchColor();
}

function sendNextBatchColor() {
    if (!batchColorState || !batchColorState.running) return;
    if (batchColorState.inFlightRow) return;
    // 上一款委派未确认接收：不推进、不当作已派发，等确认或用户明确处理
    if (batchColorState.pendingAckRow) {
        showToast(`⚠️ row${batchColorState.pendingAckRow} 委派未确认接收，已暂停派发下一款`);
        return;
    }
    if (batchColorState.currentIndex >= batchColorState.queue.length) {
        finishBatchColor(true);
        return;
    }

    const product = batchColorState.queue[batchColorState.currentIndex];
    // 重置去重标记，允许新行被推进
    batchColorState.lastAdvancedRow = null;
    // 记录在途行：暂停后它仍会在豆包继续生成，其完成消息必须能落地
    batchColorState.inFlightRow = product.row;
    batchColorState.inFlightSince = Date.now();
    updateBatchColorProgress();

    if (colorBatchFileKey() !== currentFileKey()) { finishBatchColor(false, '请切回任务所属 Excel 后继续'); return; }
    const imagePath = getMainImagePath(product.row);
    batchColorState.executionId = 'ce_' + Date.now() + '_' + Math.random().toString(36).slice(2);
    // 本次派发是否要求豆包先开新对话（上一款超时/失败后置位），置位只消费一次
    const freshChat = batchColorState.freshChatNext === true;
    batchColorState.freshChatNext = false;
    const dispatchState = batchColorState, dispatchId = batchColorState.executionId;
    saveColorBatchState();
    chrome.runtime.sendMessage(EXTENSION_ID, {
        action: 'startColorChange',
        task: {
            imagePath, prompt: COLOR_PROMPT, rowNum: product.row,
            batchId: batchColorState.batchId,
            executionId: dispatchId,
            fileKey: colorBatchFileKey(),
            fileFolder: batchColorState.fileFolder || loadedFileName || '默认',   // 执行期内绑定，异步回调不再读当前文件
            freshChat   // 豆包侧据此先开新对话，防上一款的迟到图被当成这一款
        }
    }, (response) => {
        if (batchColorState !== dispatchState || batchColorState.executionId !== dispatchId) return;
        if (chrome.runtime.lastError || !response || !response.ok) {
            if (response && response.pending) {
                batchColorState.pendingAckRow = product.row;
                saveColorBatchState(); startBatchColorPolling(); setupBatchColorTimeout(product); return;
            }
            finishBatchColor(false);
            showToast('换色启动失败，已暂停，点击继续重试');
            return;
        }
        // 待接收仍是当前在途行：接收事件与完成事件都能落地，超时有明确恢复路径。
        if (response.pending || response.unconfirmed) {
            batchColorState.pendingAckRow = product.row;
            saveColorBatchState();
            startBatchColorPolling();
            setupBatchColorTimeout(product);
            updateBatchColorStatus(`等待 row${product.row} 被豆包接收`);
            return;
        }
        batchColorState.pendingAckRow = null;
        saveColorBatchState();
        showToast(`🚀 已发送 row${product.row} 到豆包生成颜色图...`);
        setupBatchColorTimeout(product);
    });
}

// 单款超时：不暂停整批。第一次超时取消在途后同款重发，第二次超时记失败并跳过。
function setupBatchColorTimeout(product) {
    if (!batchColorState) return;
    if (batchColorState.currentTimeoutId) clearTimeout(batchColorState.currentTimeoutId);
    const state = batchColorState, executionId = state.executionId;
    state.currentTimeoutId = setTimeout(() => {
        if (batchColorState !== state || state.executionId !== executionId || state.inFlightRow !== product.row) return;
        const isRetry = state.retryOf === product.row;
        // 先取消在途执行（暂停派发通道，但不暂停批次）：否则豆包页仍在生成，重发会被判忙
        const onCanceled = () => {
            // 二次校验：期间这一款可能已正常完成并被推进，此时什么都不做
            if (batchColorState !== state || state.inFlightRow !== product.row) return;
            state.inFlightRow = null;
            state.pendingAckRow = null;
            state.inFlightSince = 0;
            state.executionId = null;
            state.currentTimeoutId = null;
            if (isRetry) {
                // 第二次超时：记失败、跳过、继续下一款，整批结束后统一补跑
                const skipRow = () => {
                    if (!Array.isArray(state.failedRows)) state.failedRows = [];
                    if (state.failedRows.indexOf(product.row) < 0) {
                        state.failedRows.push(product.row);
                        state.failCount++;
                    }
                    state.retryOf = null;
                    state.currentIndex++;
                    state.freshChatNext = true;   // 下一款先开新对话，防上一款的迟到图串款
                    saveColorBatchState();
                    showToast(`❌ row${product.row} 重试后仍未出图，已跳过（整批结束后补跑）`);
                    console.log(`🎨 二次超时跳过: row${product.row}`);
                    processNextBatchColor();
                };
                // 二次超时 = 同款重发后仍无新图，算一次「生成失败」（口径：连续 3 次失败就换号，不细究是哪个原因）。
                // 单次超时只重试不记：第一次可能是慢，重发后还是没有才值得记账。后台按「账号+行」去重，同一行最多记一次。
                if (typeof colorGenFailReport === 'function'
                    && colorGenFailReport(product.row, '超时未出图（重试 1 次后仍无图）', 'timeout', skipRow)) return;
                skipRow();
                return;
            }
            // 第一次超时：同款重发一次，不前进
            state.retryOf = product.row;
            // 重试同款也要先开新对话：上一轮被取消的执行可能仍在出图，
            // 迟到图会落在本轮增量基线之后 → 颜色错位；由 sendNextBatchColor 一次性消费并清位。
            state.freshChatNext = true;
            saveColorBatchState();
            showToast(`⏱ row${product.row} 超过 ${Math.round(BATCH_COLOR_COMPLETE_TIMEOUT / 1000)} 秒未出图，重试 1 次`);
            sendNextBatchColor();
        };
        // 发消息前先同步校验一次：完成消息可能与超时同时到达，
        // 若这一款已被推进/已被新一款接管，则连 pauseColorDispatch 都不发，避免取消掉新执行。
        if (batchColorState !== state || state.executionId !== executionId || state.inFlightRow !== product.row) return;
        try {
            chrome.runtime.sendMessage(EXTENSION_ID, { action: 'pauseColorDispatch' }, () => {
                void chrome.runtime.lastError;
                onCanceled();
            });
        } catch (_) {
            onCanceled();
        }
    }, BATCH_COLOR_COMPLETE_TIMEOUT);
}
