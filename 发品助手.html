const COLOR_BATCH_STATE_KEY = 'polo_color_batch_state';

function saveColorBatchState() {
    if (!batchColorState) { localStorage.removeItem(COLOR_BATCH_STATE_KEY); return; }
    const snap = {
        // 绑定任务创建时的文件：切文件后原任务仍归原文件，不被新文件接管
        fileKey: (typeof batchColorState.fileKey === 'string') ? batchColorState.fileKey : currentFileKey(),
        batchId: batchColorState.batchId || null,
        executionId: batchColorState.executionId || null,
        fileFolder: batchColorState.fileFolder || loadedFileName || '默认',
        label: batchColorState.label || '批量换色',
        rows: batchColorState.queue.map(p => p.row),
        currentIndex: batchColorState.currentIndex,
        successCount: batchColorState.successCount,
        failCount: batchColorState.failCount,
        failedRows: batchColorState.failedRows || [],
        skippedRows: batchColorState.skippedRows || [],
        inFlightRow: batchColorState.inFlightRow,
        inFlightSince: batchColorState.inFlightSince || 0,
        pendingAckRow: batchColorState.pendingAckRow || null,   // 未确认接收的阻挡事实必须持久化
        pausedReason: batchColorState.pausedReason || '',
        running: batchColorState.running,
        startTime: batchColorState.startTime
    };
    // 单一全局快照会互相覆盖：按文件分槽保存，保留每个文件自己的未完成任务
    localStorage.setItem(COLOR_BATCH_STATE_KEY + '::' + snap.fileKey, JSON.stringify(snap));
    localStorage.setItem(COLOR_BATCH_STATE_KEY, JSON.stringify(snap));   // 兼容读取
    return snap;
}

function loadColorBatchState() {
    try {
        // 优先读当前文件的专属槽位，再回退兼容槽位
        const cur = currentFileKey();
        const raw = localStorage.getItem(COLOR_BATCH_STATE_KEY + '::' + cur)
            || localStorage.getItem(COLOR_BATCH_STATE_KEY);
        return raw ? JSON.parse(raw) : null;
    } catch (_) { return null; }
}

// 刷新后恢复：只恢复状态与在途身份，绝不自动派发
function restoreColorBatchState() {
    if (batchColorState) return false;
    const snap = loadColorBatchState();
    if (!snap || !Array.isArray(snap.rows) || snap.rows.length === 0) return false;
    // 不同文件的待办不得互相接管
    if (snap.fileKey !== currentFileKey()) {
        console.warn(`⚠️ 持久化换色任务属于其它文件（${snap.fileKey || '(无文件名)'}），当前为 ${currentFileKey() || '(无文件名)'}，保留但不恢复`);
        return false;
    }
    const byRow = new Map((products || []).map(p => [p.row, p]));
    const queue = snap.rows.map(r => byRow.get(r)).filter(Boolean);
    // 产品缺失时不能 filter 后沿用旧 currentIndex：停下说明身份缺失，交用户处理
    if (queue.length !== snap.rows.length) {
        const missing = snap.rows.filter(r => !byRow.get(r));
        updateBatchColorStatus(`⚠️ 上次换色任务有 ${missing.length} 款不在当前 Excel（${missing.slice(0, 20).join(' ')}），未自动恢复。请确认文件是否一致`);
        showToast(`⚠️ 上次换色任务缺 ${missing.length} 款，未自动恢复：请确认 Excel 文件`);
        return false;
    }
    if (queue.length === 0) return false;
    batchColorState = {
        running: false,               // 恢复后保持暂停；需用户明确继续
        stopRequested: false,
        queue: queue.map((p, i) => ({ ...p, _idx: i })),
        currentIndex: Math.min(snap.currentIndex || 0, queue.length),
        successCount: snap.successCount || 0,
        failCount: snap.failCount || 0,
        startTime: snap.startTime || Date.now(),
        startRow: queue[0].row,
        lastAdvancedRow: null,
        lastProcessedTimestamp: 0,
        pollTimer: null,
        label: snap.label || '批量换色',
        failedRows: snap.failedRows || [],
        skippedRows: snap.skippedRows || [],
        lastMemMB: 0,
        batchId: snap.batchId || null,
        executionId: snap.executionId || null,
        fileFolder: snap.fileFolder || loadedFileName || '默认',
        fileKey: typeof snap.fileKey === 'string' ? snap.fileKey : currentFileKey(),
        inFlightRow: null,
        inFlightSince: 0,
        pendingAckRow: null,
        timedOutRows: [],
        pausedReason: /内存|提交额度|监测不可用|Failed to fetch/i.test(snap.pausedReason || '')
            ? '上次任务已暂停，等待你继续'
            : (snap.pausedReason || (snap.inFlightRow ? '刷新后恢复：等待在途款结束' : '刷新后恢复'))
    };
    if (snap.inFlightRow || snap.pendingAckRow) {
        const idx = queue.findIndex(p => p.row === (snap.inFlightRow || snap.pendingAckRow));
        if (idx >= 0) batchColorState.currentIndex = idx;
    }
    batchColorState.executionId = null;
    batchColorState.pausedReason = '';
    setColorTimeoutRows([]);
    refreshColorResumeRowsFromState();
    saveColorBatchState();
    showBatchColorProgress();
    updateBatchColorProgress();
    restoreBatchColorUI();
    updateBatchColorStatus('换色已暂停');
    return true;
}


function refreshColorResumeRowsFromState() {
    setColorResumeRows(computeColorResumeRows());
}

function advanceBatchColorForRow(rowNum, source, msgBatchId, results) {
    if (!batchColorState) return;
    // ① 任务标识校验：批量任务必须有标识，且必须匹配。
    //    缺标识的消息一律拒绝（旧任务同行的迟到消息不得冒充新任务完成）；
    //    单款任务不经过本函数（batchColorState 为空时已在上面返回），语义天然分开。
    if (!batchColorState.batchId) {
        console.warn(`🎨 当前没有批量任务标识，忽略 row${rowNum} 的完成消息 (${source})`);
        return;
    }
    if (!msgBatchId || msgBatchId !== batchColorState.batchId) {
        console.warn(`🎨 row${rowNum} 完成消息标识不匹配（收到 ${msgBatchId || '(缺失)'} / 当前 ${batchColorState.batchId}），已忽略 (${source})`);
        return;
    }
    // ①b 迟到完成：该行此前已判超时（待确认）→ 只提示，不重复入账
    if (getColorTimeoutRows().indexOf(rowNum) >= 0) {
        console.warn(`🎨 row${rowNum} 迟到完成（此前已判超时），仅提示不重复入账 (${source})`);
        showToast(`ℹ️ row${rowNum} 迟到完成（此前已判超时），请确认该款是否已生成`);
        return;
    }
    // ② 只接受当前执行行的完成；暂停清除此标识，旧完成不能入账。
    if (batchColorState.inFlightRow !== rowNum) {
        console.warn(`🎨 row${rowNum} 不是当前在途行(在途=${batchColorState.inFlightRow})，已忽略 (${source})`);
        return;
    }
    // ③ 同一行只推进一次（重复完成消息）
    if (batchColorState.lastAdvancedRow === rowNum) {
        console.log(`🎨 row${rowNum} 已推进过，跳过 (${source})`);
        return;
    }
    batchColorState.lastAdvancedRow = rowNum;
    batchColorState.inFlightRow = null;
    batchColorState.pendingAckRow = null;
    batchColorState.inFlightSince = 0;

    // ④ 结果判定：执行结束 ≠ 成功。四色目标必须逐项确认，部分完成按失败处理并保留可处理行
    const REQUIRED_COLORS = ['white', 'black', 'gray', 'navy'];
    const verdict = judgeColorTaskResult(results, rowNum);
    if (!verdict.ok) {
        console.warn(`⚠️ row${rowNum} 换色未完整成功：${verdict.reason}`);
        if (batchColorState.currentTimeoutId) {
            clearTimeout(batchColorState.currentTimeoutId);
            batchColorState.currentTimeoutId = null;
        }
        if (!Array.isArray(batchColorState.failedRows)) batchColorState.failedRows = [];
        if (batchColorState.failedRows.indexOf(rowNum) < 0) {
            batchColorState.failedRows.push(rowNum);
            batchColorState.failCount++;
        }
        // 失败/部分完成是明确终态：暂停并保留可处理行（不做"运行中却不推进"的悬空状态）
        batchColorState.running = false;
        batchColorState.stopRequested = false;
        batchColorState.pausedReason = `row${rowNum} 换色失败（${verdict.reason}）`;
        saveColorBatchState();
        refreshColorResumeRowsFromState();
        updateBatchColorProgress();
        updateBatchColorStatus('换色已暂停');
        showToast(`❌ row${rowNum} 换色失败（${verdict.reason}），已暂停并放入「继续」列表`);
        console.log(`🎨 失败入账: row${rowNum} (${source})`);
        return;
    }

    if (batchColorState.currentTimeoutId) {
        clearTimeout(batchColorState.currentTimeoutId);
        batchColorState.currentTimeoutId = null;
    }
    if ((batchColorState.failedRows || []).includes(rowNum)) {
        batchColorState.failedRows = batchColorState.failedRows.filter(row => row !== rowNum);
        batchColorState.failCount = Math.max(0, batchColorState.failCount - 1);
    }
    batchColorState.successCount++;
    batchColorState.currentIndex++;
    saveColorBatchState();

    // ⑤ 暂停中：只记录真实完成、刷新剩余列表，**不自动派发下一款**
    if (!batchColorState.running || batchColorState.stopRequested) {
        refreshColorResumeRowsFromState();
        updateBatchColorProgress();
        restoreBatchColorUI();
        if (batchColorState.currentIndex >= batchColorState.queue.length && !(batchColorState.failedRows || []).length) {
            finishBatchColor(true);
            return;
        }
        showToast(`✅ row${rowNum} 换色完成（任务暂停中，未自动派发下一款）`);
        console.log(`🎨 暂停中记录完成: row${rowNum} (${source})`);
        return;
    }

    updateBatchColorProgress();
    showToast(`✅ row${rowNum} 换色完成`);
    console.log(`🎨 推进批量换色: row${rowNum} (${source})`);

    setTimeout(() => {
        processNextBatchColor();
    }, 500);
}

// 结果判定：只有四色全部下载成功才算成功；否则给出缺失/失败原因
function judgeColorTaskResult(results, rowNum) {
    const REQUIRED = ['white', 'black', 'gray', 'navy'];
    if (!results) return { ok: false, reason: '无执行结果（未收到结果字段）' };
    if (results.error) return { ok: false, reason: `执行报错：${results.error}` };
    const downloads = Array.isArray(results.downloads) ? results.downloads : null;
    if (!downloads) return { ok: false, reason: '缺少下载明细' };
    const got = {};
    for (const d of downloads) {
        const m = String(d && d.filename || '').match(/^row(\d+)_(white|black|gray|navy)\.(?:png|jpe?g)$/i);
        if (m && Number(m[1]) === Number(rowNum) && d.ok) got[m[2].toLowerCase()] = true;
    }
    const missing = REQUIRED.filter(c => !got[c]);
    if (missing.length > 0) {
        const okCount = REQUIRED.length - missing.length;
        return { ok: false, reason: `仅成功 ${okCount}/4 色，缺失：${missing.join('/')}` };
    }
    return { ok: true };
}

// 切换文件暂停原任务，保留当前款，避免新文件接管。
function handleColorFileSwitched(req) {
    const to = (req && req.to) || '';
    if (!batchColorState) return;
    const toKey = to ? String(to).replace(/[^a-zA-Z0-9\u4e00-\u9fff]/g, '_') + '__' : '';
    if (toKey === batchColorState.fileKey) return;
    if (!batchColorState.running && !batchColorState.inFlightRow) return;
    finishBatchColor(false);
}

// ===== 套图（快速五图）：移植参考扩展 pages/doubao/quick-five.js 的组装规则 =====
// 核心：把 5 个单图步骤合成【一次】请求（一次发送 → 一步生成 5 张），不逐张发送。
const SUITE_OUTPUTS = [['111', '卖点图'], ['222', '袖口图'], ['333', '面料图'], ['444', '白底图'], ['666', '领口图']];

// 防重复点击：同一时间只允许一个套图任务在预检/创建中
let suiteTaskRunning = false;

const SuiteQuickFive = (() => {
    function normalizePrompt(resolved) {
        return String(resolved || '')
            .replace(/\[(?:MODAL_INSTRUCTION|EXECUTE_ONLY)\]/g, '')
            .replace(/(?:只|仅)(?:能|允许)?生成[一1]张(?:纯)?(?:图片|图像|图)[。.!！]?/g, '本段只描述这一张图片。')
            .replace(/(?:只|仅)(?:能|允许)?输出[一1]张(?:图片|图像|图)[。.!！]?/g, '本段只描述这一张图片。')
            .replace(/\b(?:generate|output)\s+only\s+(?:one|1)\s+(?:image|picture)\b[.!]?/gi, 'This section describes one of the five images.')
            .replace(/生成一张纯图片[。.!！]?/g, '这张图片为纯图片。')
            .trim();
    }

    async function build(steps, resolvePrompt) {
        const prompts = [];
        const outputKeys = [];
        const filenames = new Set();
        let model = null, ratio = null;
        for (const [key, name] of SUITE_OUTPUTS) {
            const matches = (steps || []).filter(step => (step.outputKeys || []).some(o =>
                (typeof o === 'string' ? o : o.key).trim() === key));
            if (matches.length !== 1) throw new Error(`快速生成缺少或重复配置：${key} ${name}`);
            const step = matches[0];
            const output = step.outputKeys.find(o => (typeof o === 'string' ? o : o.key).trim() === key);
            outputKeys.push(typeof output === 'string' ? { key, postprocess: null } : { ...output, key });
            if (!step.prompt || !step.prompt.trim()) throw new Error(`${name}提示词为空`);
            const stepModel = step.model || '5.0';
            const stepRatio = step.ratio || '1:1';
            if (model && (model !== stepModel || ratio !== stepRatio)) {
                throw new Error('五张快速生成要求五个步骤的模型与比例一致');
            }
            model = stepModel; ratio = stepRatio;
            for (const upload of step.uploads || []) {
                if (upload.type === 'none') continue;
                if (upload.type !== 'current_file') throw new Error(`${name}包含外部或随机参考图，快速生成仅支持当前套装参考图`);
                for (const f of upload.filenames) filenames.add(String(f).trim());
            }
            const resolved = await resolvePrompt(step);
            prompts.push(`${prompts.length + 1}、步骤${prompts.length + 1}\n${normalizePrompt(resolved)}`);
        }
        if (!filenames.size) throw new Error('快速生成未配置当前套装参考图');
        return {
            name: '五张快速生成', expectCount: 5, model, ratio,
            uploads: [{ type: 'current_file', filenames: [...filenames] }],
            outputKeys, promptResolved: true, combinedFive: true,
            prompt: '五张图合并生成：\n请根据提示词来生成五张图片\n\n' + prompts.join('\n\n')
        };
    }

    function validateImages(images) {
        if (!Array.isArray(images) || images.length !== 5 || new Set(images).size !== 5
            || images.some(u => typeof u !== 'string' || !u.trim())) {
            throw new Error(`快速生成必须返回五张不同图片，实际 ${images ? images.length : 0} 张`);
        }
        return true;
    }

    return { build, validateImages, normalizePrompt };
})();

function getSuiteSteps() {
    try {
        const raw = localStorage.getItem('polo_suite_steps_v1');
        return raw ? JSON.parse(raw) : null;
    } catch (_) { return null; }
}

// 变量映射：把产品属性按步骤 mappings 渲染进提示词（支持 {{变量}} 占位）
function renderSuitePrompt(step, product) {
    let prompt = String(step.prompt || '');
    const map = Object.assign({ row: product.row }, product);
    for (const m of (step.mappings || [])) {
        const name = m && (m.variable || m.name);
        const field = m && (m.field || m.key);
        if (!name) continue;
        const value = field ? (map[field] === undefined || map[field] === null ? '' : String(map[field])) : '';
        prompt = prompt.split(new RegExp('\\{\\{\\s*' + name + '\\s*\\}\\}', 'g')).join(value);
    }
    return prompt;
}

function updateSuiteStatus(text) {
    const el = document.getElementById('suiteStatusText');
    if (el) el.textContent = text || '';
    const area = document.getElementById('suiteImagesArea');
    if (area) area.style.display = 'block';
}

// 点击「生成套图」：一次快速五图请求（不逐张发送）
// ===== 套图素材预检：发往豆包前必须全部通过（有路径 ≠ 有图片） =====
async function probeSuiteImage(label, url) {
    if (!url) return { ok: false, error: `${label}：没有可用的图片来源` };
    try {
        const resp = await fetch(url, { cache: 'no-store' });
        if (!resp.ok) return { ok: false, error: `${label}：读取失败 HTTP ${resp.status}` };
        const blob = await resp.blob();
        if (!blob || blob.size === 0) return { ok: false, error: `${label}：文件为空` };
        if (!/^image\/(png|jpeg|jpg|webp|bmp)$/i.test(blob.type || '')) {
            return { ok: false, error: `${label}：不是位图（${blob.type || '未知类型'}）` };
        }
        const bmp = await createImageBitmap(blob);
        const w = bmp.width, h = bmp.height;
        if (typeof bmp.close === 'function') bmp.close();
        if (!(w >= 64 && h >= 64)) return { ok: false, error: `${label}：尺寸无效 ${w}×${h}` };
        return { ok: true, bytes: blob.size, width: w, height: h, type: blob.type };
    } catch (e) {
        return { ok: false, error: `${label}：无法解码（${e && e.message}）` };
    }
}

// 按「源表文件标识 + 产品行号」取当前产品素材，不依赖全局最后一次生成
async function resolveSuiteAssets(product) {
    const fileKey = currentFileKey();
    const assets = {};
    const problems = [];
    let mainUrl = product.imagePath || ('extracted_images/row' + product.row + '_main.jpg');
    let probe = await probeSuiteImage('主图', mainUrl);
    if (!probe.ok && /_main\.jpg$/i.test(mainUrl)) {
        const pngUrl = mainUrl.replace(/_main\.jpg$/i, '_main.png');
        const p2 = await probeSuiteImage('主图', pngUrl);
        if (p2.ok) { probe = p2; mainUrl = pngUrl; }
    }
    if (probe.ok) assets.main = Object.assign({ color: 'main', url: mainUrl, fileKey, row: product.row }, probe);
    else problems.push(probe.error);

    for (const color of ['white', 'black', 'gray', 'navy']) {
        let url = (typeof getColorImagePath === 'function') ? getColorImagePath(product.row, color) : null;
        let p = await probeSuiteImage(color, url);
        if (!p.ok && extensionInstalled) {
            const dataUrl = await new Promise((res) => {
                try {
                    chrome.runtime.sendMessage(EXTENSION_ID, { action: 'getColorImage', rowNum: product.row, color, fileKey }, (r) => res(r && r.ok ? r.dataUrl : null));
                } catch (_) { res(null); }
            });
            if (dataUrl) { const p2 = await probeSuiteImage(color, dataUrl); if (p2.ok) { p = p2; url = dataUrl; } }
        }
        if (p.ok) assets[color] = Object.assign({ color, url, fileKey, row: product.row }, p);
        else problems.push(p.error);
    }
    return { assets, problems, fileKey };
}

// 变量解析校验：任何未解析的 {{变量}} 都要在发送前失败并指明步骤
function checkSuiteVariables(steps, product) {
    const problems = [];
    for (const [key, name] of SUITE_OUTPUTS) {
        const step = (steps || []).find(s => (s.outputKeys || []).some(o => (typeof o === 'string' ? o : o.key).trim() === key));
        if (!step) { problems.push(`${key} ${name}：缺少该编号的步骤配置`); continue; }
        const rendered = renderSuitePrompt(step, product);
        const left = rendered.match(/\{\{\s*([^}]+?)\s*\}\}/g);
        if (left && left.length) problems.push(`${name}：未解析变量 ${[...new Set(left)].join(' ')}`);
    }
    return problems;
}

// 统一消息封装：带超时与"扩展上下文失效"的真实提示，不无限重试
function suiteSend(action, payload, timeoutMs = 8000) {
    return new Promise((resolve) => {
        let done = false;
        const timer = setTimeout(() => { if (!done) { done = true; resolve({ ok: false, error: '扩展未响应（超时）' }); } }, timeoutMs);
        try {
            chrome.runtime.sendMessage(EXTENSION_ID, Object.assign({ action }, payload || {}), (resp) => {
                if (done) return;
                done = true; clearTimeout(timer);
                if (chrome.runtime.lastError) { resolve({ ok: false, error: chrome.runtime.lastError.message }); return; }
                resolve(resp || { ok: false, error: '空响应' });
            });
        } catch (e) {
            if (!done) { done = true; clearTimeout(timer); resolve({ ok: false, error: '扩展上下文失效，请刷新本页：' + (e && e.message) }); }
        }
    });
}

// 点击「生成套图」：一次快速五图请求（绝不拆成五次逐张）
async function startSuiteGeneration() {
    if (suiteTaskRunning) { showToast('⚠️ 已有套图任务进行中，请勿重复点击'); return null; }
    if (!products || products.length === 0) { showToast('⚠️ 请先上传 Excel'); return null; }
    const product = (typeof currentRowIndex === 'number' && products[currentRowIndex]) ? products[currentRowIndex] : products[0];
    if (!product) { showToast('⚠️ 请先选择产品'); return null; }
    const btn = document.getElementById('suiteGenBtn');
    suiteTaskRunning = true;
    if (btn) { btn.disabled = true; btn.textContent = '⏳ 预检中...'; }
    try {
        const steps = getSuiteSteps();
        if (!Array.isArray(steps) || steps.length === 0) throw new Error('未配置自定义步骤（请到「自定义步骤」页保存配置）');

        // ① 变量解析（未解析即失败并指明步骤）
        const varProblems = checkSuiteVariables(steps, product);
        if (varProblems.length) throw new Error('变量解析失败：' + varProblems.join('；'));

        // ② 素材真实性与完整性（主图 + 四色，按 fileKey+行号）
        updateSuiteStatus('⏳ 正在检查素材…');
        const { assets, problems, fileKey } = await resolveSuiteAssets(product);
        if (problems.length) throw new Error('素材检查未通过：' + problems.join('；'));

        // ③ 组装一次快速五图（外部/随机素材等冲突会在此抛出，指明步骤）
        const task = await SuiteQuickFive.build(steps, async (step) => renderSuitePrompt(step, product));

        // ③b 后处理可用性预检（尽量避免生成后才发现缺资源/不支持）
        const avail = SuitePostprocess.checkAvailability(steps, task.outputKeys, (key, decl) => {
            const meta = getSuiteDirHandles();
            return decl.type === 'folder' ? !!meta.assets || !!meta.scripts : (!!meta.assets || !!meta.scripts);
        });
        if (!avail.ok) throw new Error('后处理配置不可用：' + avail.problems.join('；'));

        // ④ 创建后台任务（含配置快照与素材对应；运行中改配置/切产品不影响本任务）
        const created = await suiteSend('suiteCreate', {
            task: {
                fileKey, rowNum: product.row, productId: product.row,
                mode: 'quick-five', expectCount: task.expectCount, targetKeys: task.outputKeys.map(o => o.key),
                prompt: task.prompt,
                configSnapshot: {
                    model: task.model, ratio: task.ratio, outputKeys: task.outputKeys, steps: steps.length,
                    // 后处理配置冻结进快照：运行中改配置不影响本任务
                    postprocessByKey: task.outputKeys.reduce((acc, o) => {
                        const k = String(o.key).trim();
                        const s = steps.find(x => (x.outputKeys || []).some(y => (typeof y === 'string' ? y : (y.key || '')).toString().trim() === k));
                        acc[k] = (s && s.postprocess) ? JSON.parse(JSON.stringify(s.postprocess)) : { type: 'none' };
                        return acc;
                    }, {})
                },
                assets: Object.values(assets).map(a => ({ color: a.color, url: a.url, filename: a.url, fileKey: a.fileKey, row: a.row, bytes: a.bytes, width: a.width, height: a.height }))
            }
        });
        if (!created.ok) throw new Error(created.error);

        updateSuiteStatus(`⏳ 任务 ${created.task.taskId} 已接收（received），开始执行…`);
        renderSuiteImages(product);

        // ⑤ 真正送入豆包执行（一次快速五图；失败会带回具体阶段）
        const ran = await suiteSend('suiteRun', { taskId: created.task.taskId }, 3600000);
        if (!ran.ok) {
            updateSuiteStatus(`❌ 执行失败：${ran.error}`);
            showToast(`❌ 套图执行失败：${ran.error}`);
            return created.task;
        }

        // ⑥ 结果识别 → 编号映射（内容指纹在浏览器侧计算）
        const fpOf = async (it) => {
            try {
                const resp = await fetch(it.url, { cache: 'no-store' });
                const blob = await resp.blob();
                const bmp = await createImageBitmap(blob);
                const c = document.createElement('canvas');
                c.width = 16; c.height = 16;
                const ctx2 = c.getContext('2d');
                ctx2.drawImage(bmp, 0, 0, 16, 16);
                if (typeof bmp.close === 'function') bmp.close();
                return c.toDataURL('image/png');
            } catch (_) { return null; }
        };
        const rec = await SuiteCore.recognize(ran.images, created.task.targetKeys, { expectCount: 5, fingerprint: fpOf });
        if (!rec.ok) {
            updateSuiteStatus(`❌ 结果校验未通过：${rec.error}（原始 ${rec.diag.rawCount} 张，去重后 ${rec.diag.afterDedupe} 张）`);
            showToast(`❌ 结果校验未通过：${rec.error}`);
            await suiteSend('suiteProgress', { report: { taskId: created.task.taskId, final: true, finalStage: 'failed', error: `结果识别：${rec.error}`, diag: rec.diag } });
            return created.task;
        }

        // ⑦ 后处理（按编号顺序；未配置='none' 直接用原图）—— 必须在写盘前完成
        const ctxPost = {
            // 资源只用【真实授权句柄】：优先「后处理脚本目录」等已授权目录
            getHandle: async (decl) => {
                const ids = decl.type === 'folder' ? ['assets', 'scripts'] : ['assets', 'scripts'];
                for (const id of ids) {
                    const h = await loadSuiteDirHandle(id);
                    if (!h) continue;
                    if (decl.type === 'folder') return h;
                    if (decl.name) { try { return await h.getFileHandle(decl.name); } catch (_) {} }
                }
                return null;
            },
            transform: async (blob, action, options) => {
                const bmp = await createImageBitmap(blob);
                const pad = action === 'padSquare' ? Math.max(bmp.width, bmp.height) : bmp.width;
                const max = action === 'resizeMax' ? (options.max || 1536) : pad;
                const scale = Math.min(1, max / Math.max(bmp.width, bmp.height));
                const w = Math.max(1, Math.round(bmp.width * scale));
                const h = Math.max(1, Math.round(bmp.height * scale));
                const c = document.createElement('canvas');
                c.width = action === 'padSquare' ? max : w;
                c.height = action === 'padSquare' ? max : h;
                const cx = c.getContext('2d');
                cx.drawImage(bmp, (c.width - w) / 2, (c.height - h) / 2, w, h);
                if (typeof bmp.close === 'function') bmp.close();
                return await new Promise(res => c.toBlob(b => res(b), 'image/png'));
            }
        };
        const blobsByKey = {};
        for (let i = 0; i < rec.results.length; i++) {
            const resp = await fetch(rec.results[i].url, { cache: 'no-store' });
            blobsByKey[rec.results[i].key] = await resp.blob();
        }
        const post = await SuitePostprocess.runAll(steps, created.task.targetKeys, blobsByKey, ctxPost);
        if (!post.ok) {
            updateSuiteStatus(`❌ 后处理失败：编号 ${post.failedKeys.join('/')} — ${post.results.filter(r => !r.ok).map(r => r.error).join('；')}（原始图已保留，可「仅重试处理」）`);
            showToast(`❌ 后处理失败：${post.failedKeys.join('/')}`);
            await suiteSend('suiteProgress', { report: { taskId: created.task.taskId, stage: 'acquired', diag: [`后处理失败：${post.failedKeys.join('/')}`] } });
            return created.task;
        }
        const items = post.results.map(r => ({ key: r.key, blob: r.output }));

        // ⑧ 写盘 + 重新读取校验（真实目录句柄；五张全成功才 saved）
        const outHandle = await loadSuiteDirHandle('suiteOut');
        if (!outHandle) {
            updateSuiteStatus('❌ 套图输出目录未授权，已获取并处理完成的 5 张结果已保留；请到「路径配置」授权后重试保存');
            await suiteSend('suiteProgress', { report: { taskId: created.task.taskId, stage: 'acquired', diag: ['写盘前：输出目录未授权'] } });
            return created.task;
        }
        const perm = await outHandle.queryPermission({ mode: 'readwrite' });
        if (perm !== 'granted') {
            updateSuiteStatus(`❌ 输出目录权限不足（${perm}），结果已保留，请重新授权后重试保存`);
            return created.task;
        }
        const saved = await SuiteCore.saveAll(outHandle, items, {
            fileKey, rowNum: product.row,
            decodeSize: async (f) => { const b = await createImageBitmap(f); const s = { width: b.width, height: b.height }; if (b.close) b.close(); return s; }
        });
        if (!saved.ok) {
            updateSuiteStatus(`⚠️ 生成成功、保存失败：已保存 ${saved.savedCount}/5，失败编号 ${saved.failedKeys.join('/')}（结果已保留，可「仅重试保存」）`);
            showToast(`⚠️ 保存失败 ${saved.failedKeys.join('/')}，结果已保留`);
            await suiteSend('suiteProgress', { report: { taskId: created.task.taskId, stage: 'acquired', results: saved.results, diag: [`写盘失败：${saved.failedKeys.join('/')}`] } });
            return created.task;
        }

        // ⑨ 先写索引，成功后才 saved → completed（避免"显示完成但索引写入失败"）
        const store = SuiteCore.ResultStore();
        try {
            for (const it of items) {
                const rec2 = saved.results.find(x => x.key === it.key);
                await store.put({
                    fileKey, rowNum: product.row, key: it.key, taskId: created.task.taskId, blob: it.blob,
                    meta: { filename: rec2 && rec2.filename, bytes: rec2 && rec2.bytes, width: rec2 && rec2.width, height: rec2 && rec2.height, verified: true, postprocess: (post.results.find(p => p.key === it.key) || {}).applied || 'none' }
                });
            }
        } catch (e) {
            updateSuiteStatus(`⚠️ 文件已保存但索引写入失败：${e.message}（文件在磁盘上可用；请刷新后重试恢复）`);
            showToast('⚠️ 索引写入失败，未标记完成');
            await suiteSend('suiteProgress', { report: { taskId: created.task.taskId, stage: 'saved', results: saved.results, diag: ['索引写入失败：' + e.message] } });
            return created.task;
        }
        await suiteSend('suiteProgress', { report: { taskId: created.task.taskId, stage: 'saved', results: saved.results } });
        await suiteSend('suiteProgress', { report: { taskId: created.task.taskId, final: true, finalStage: 'completed', results: saved.results } });

        updateSuiteStatus(`✅ 套图完成：5 张已后处理、保存、回读校验并写入索引（任务 ${created.task.taskId}）`);
        showToast('✅ 套图完成（5 张已保存并校验）');
        await renderSuiteImages(product);
        return created.task;
    } catch (e) {
        updateSuiteStatus(`❌ ${e.message}`);
        showToast(`❌ ${e.message}`);
        return null;
    } finally {
        suiteTaskRunning = false;
        if (btn) { btn.disabled = false; btn.textContent = '🖼️ 生成套图'; }
    }
}

// 套图结果区：从 ResultStore 读取（fileKey+rowNum 绑定），重建有效预览
// - 不把临时 blob URL 当永久来源：每次渲染重新从已落盘记录生成
// - 释放上一轮 object URL，避免长期切换累积
// - 异步读取带身份检查，旧产品读完后不得覆盖当前产品
let suiteObjectUrls = [];
let suiteRenderSeq = 0;

function releaseSuiteObjectUrls() {
    for (const u of suiteObjectUrls) { try { URL.revokeObjectURL(u); } catch (_) {} }
    suiteObjectUrls = [];
}

async function renderSuiteImages(product) {
    const area = document.getElementById('suiteImagesArea');
    const grid = document.getElementById('suiteImagesGrid');
    if (!area || !grid) return;
    const row = product ? product.row
        : ((typeof currentRowIndex === 'number' && products && products[currentRowIndex]) ? products[currentRowIndex].row : null);
    if (row === null || row === undefined) { area.style.display = 'none'; return; }
    area.style.display = 'block';

    const seq = ++suiteRenderSeq;
    const fileKey = currentFileKey();
    const stale = () => seq !== suiteRenderSeq || fileKey !== currentFileKey();

    const resp = await suiteSend('suiteListTasks', { fileKey, rowNum: row });
    if (stale()) return;                                   // 期间已切产品/重渲染 → 丢弃
    const tasks = (resp && resp.ok && resp.tasks) ? resp.tasks : [];
    const t = tasks[0];

    let recs = [];
    try {
        const store = SuiteCore.ResultStore();
        recs = await store.list(fileKey, row);
    } catch (e) { recs = []; }
    if (stale()) return;

    releaseSuiteObjectUrls();
    const byKey = {};
    for (const r of recs) byKey[String(r.key)] = r;

    const keys = (t && t.targetKeys && t.targetKeys.length) ? t.targetKeys
        : recs.map(r => String(r.key)).sort();

    if (!t && recs.length === 0) {
        grid.innerHTML = '<div style="font-size:12px;color:rgba(255,255,255,0.45);padding:8px;">该产品还没有套图结果</div>';
        const st0 = document.getElementById('suiteStatusText');
        if (st0) st0.textContent = '';
        return;
    }

    grid.innerHTML = keys.map(key => {
        const r = byKey[key];
        let url = '';
        if (r && r.blob && r.blob.size) {
            url = URL.createObjectURL(r.blob);
            suiteObjectUrls.push(url);
        }
        const meta = (r && r.meta) || {};
        const status = r
            ? `✅ 已保存 ${meta.width ? meta.width + '×' + meta.height : ''}${meta.postprocess && meta.postprocess !== 'none' ? ' · ' + meta.postprocess : ''}`
            : '⏳ 未完成';
        const img = url
            ? `<img src="${url}" style="width:100%;border-radius:8px;cursor:zoom-in;" onclick="openImageModal(this.src)">`
            : `<div style="height:90px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.04);border-radius:8px;font-size:11px;color:rgba(255,255,255,0.4);">${r ? '文件缺失或已移动' : '未生成'}</div>`;
        return `<div class="color-img-item" style="text-align:center;">
            <div class="img-label" style="justify-content:center;"><span>${key}</span></div>
            ${img}
            <div style="font-size:10px;color:rgba(255,255,255,0.5);margin-top:4px;">${status}</div>
            <button class="batch-color-btn" style="padding:2px 8px;font-size:11px;margin-top:4px;" onclick="startSuiteRegenerate('${key}')">🔁 重生成</button>
        </div>`;
    }).join('');

    const st = document.getElementById('suiteStatusText');
    if (st) st.textContent = t ? `任务 ${t.taskId}｜阶段 ${t.stage}${t.error ? '｜' + t.error : ''}` : `已保存 ${recs.length} 张`;
}

// 指定单图重生成：只执行该编号对应的自定义步骤，成功后只替换该张
async function startSuiteRegenerate(key) {
    if (!key) { showToast('ℹ️ 请选择要重生成的编号'); return null; }
    if (suiteTaskRunning) { showToast('⚠️ 已有套图任务进行中'); return null; }
    if (!products || products.length === 0) { showToast('⚠️ 请先上传 Excel'); return null; }
    const product = (typeof currentRowIndex === 'number' && products[currentRowIndex]) ? products[currentRowIndex] : products[0];
    const steps = getSuiteSteps();
    const step = (steps || []).find(s => (s.outputKeys || []).some(o => (typeof o === 'string' ? o : (o.key || '')).toString().trim() === String(key).trim()));
    if (!step) { showToast(`⚠️ 编号 ${key} 没有对应的自定义步骤`); return null; }

    const btn = document.getElementById('suiteGenBtn');
    suiteTaskRunning = true;
    if (btn) { btn.disabled = true; btn.textContent = '⏳ 重生成中...'; }
    try {
        const cur = (typeof currentRowIndex === 'number' && products[currentRowIndex]) ? products[currentRowIndex] : products[0];
        // 变量校验（只针对该步骤）
        const rendered = renderSuitePrompt(step, cur);
        const left = rendered.match(/\{\{\s*([^}]+?)\s*\}\}/g);
        if (left && left.length) throw new Error(`编号 ${key} 存在未解析变量：${[...new Set(left)].join(' ')}`);
        // 素材校验（该步骤允许的素材规则；单图复用当前产品素材）
        const { assets, problems, fileKey } = await resolveSuiteAssets(cur);
        if (problems.length) throw new Error('素材检查未通过：' + problems.join('；'));

        const created = await suiteSend('suiteCreate', {
            task: {
                fileKey, rowNum: cur.row, productId: cur.row,
                mode: 'single-regen', expectCount: 1, targetKeys: [String(key).trim()],
                prompt: rendered,
                configSnapshot: { model: step.model || '5.0', ratio: step.ratio || '1:1', outputKeys: [{ key }], postprocess: step.postprocess || { type: 'none' } },
                assets: Object.values(assets).map(a => ({ color: a.color, url: a.url, filename: a.url, fileKey: a.fileKey, row: a.row }))
            }
        });
        if (!created.ok) throw new Error(created.error);

        updateSuiteStatus(`⏳ 编号 ${key} 重生成中（任务 ${created.task.taskId}）…`);
        const ran = await suiteSend('suiteRun', { taskId: created.task.taskId }, 3600000);
        if (!ran.ok) throw new Error(ran.error);

        // 单图校验：只认 1 张（不套用五图映射）
        const fpOf = async (it) => {
            try {
                const resp = await fetch(it.url, { cache: 'no-store' });
                const bmp = await createImageBitmap(await resp.blob());
                const c = document.createElement('canvas'); c.width = 16; c.height = 16;
                c.getContext('2d').drawImage(bmp, 0, 0, 16, 16);
                if (bmp.close) bmp.close();
                return c.toDataURL('image/png');
            } catch (_) { return null; }
        };
        const recOne = await SuiteCore.recognize(ran.images, [{ key }], { expectCount: 1, fingerprint: fpOf });
        if (!recOne.ok) throw new Error('单图校验未通过：' + recOne.error);

        // 后处理（仅该步骤）
        const resp1 = await fetch(recOne.results[0].url, { cache: 'no-store' });
        const rawBlob = await resp1.blob();
        const post = await SuitePostprocess.runStep(step, String(key).trim(), rawBlob, {
            getHandle: async (decl) => {
                for (const id of ['assets', 'scripts']) {
                    const h = await loadSuiteDirHandle(id);
                    if (!h) continue;
                    if (decl.type === 'folder') return h;
                    if (decl.name) { try { return await h.getFileHandle(decl.name); } catch (_) {} }
                }
                return null;
            },
            transform: async (blob, action, options) => {
                const bmp = await createImageBitmap(blob);
                const max = action === 'resizeMax' ? (options.max || 1536) : Math.max(bmp.width, bmp.height);
                const scale = Math.min(1, max / Math.max(bmp.width, bmp.height));
                const c = document.createElement('canvas');
                c.width = Math.max(1, Math.round(bmp.width * scale));
                c.height = Math.max(1, Math.round(bmp.height * scale));
                c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
                if (bmp.close) bmp.close();
                return await new Promise(res => c.toBlob(b => res(b), 'image/png'));
            }
        });
        if (!post.ok) throw new Error(`后处理失败：${post.error}`);

        const outHandle = await loadSuiteDirHandle('suiteOut');
        if (!outHandle) throw new Error('套图输出目录未授权');
        const perm = await outHandle.queryPermission({ mode: 'readwrite' });
        if (perm !== 'granted') throw new Error(`输出目录权限不足（${perm}）`);
        const saveOne = await SuiteCore.saveAll(outHandle, [{ key, blob: post.output }], {
            fileKey, rowNum: cur.row,
            decodeSize: async (f) => { const b = await createImageBitmap(f); const s = { width: b.width, height: b.height }; if (b.close) b.close(); return s; }
        });
        if (!saveOne.ok) throw new Error(`保存失败：${saveOne.failedKeys.join('/')}`);

        // 只更新该编号（其他四张不动），且先写索引再标记完成
        const store = SuiteCore.ResultStore();
        await store.put({
            fileKey, rowNum: cur.row, key, taskId: created.task.taskId, blob: post.output,
            meta: Object.assign({}, (saveOne.results[0] || {}), { verified: true, postprocess: post.applied || 'none', regeneratedAt: Date.now() })
        });
        await suiteSend('suiteProgress', { report: { taskId: created.task.taskId, stage: 'saved', results: saveOne.results } });
        await suiteSend('suiteProgress', { report: { taskId: created.task.taskId, final: true, finalStage: 'completed', results: saveOne.results } });

        updateSuiteStatus(`✅ 编号 ${key} 已重生成并替换（其余 4 张未改动）`);
        showToast(`✅ 编号 ${key} 重生成完成`);
        await renderSuiteImages(cur);
        return created.task;
    } catch (e) {
        updateSuiteStatus(`❌ 编号 ${key} 重生成失败：${e.message}（原图保留，未清空套图）`);
        showToast(`❌ 编号 ${key} 重生成失败：${e.message}`);
        return null;
    } finally {
        suiteTaskRunning = false;
        if (btn) { btn.disabled = false; btn.textContent = '🖼️ 生成套图'; }
    }
}

function renderSuiteSteps() {
    const box = document.getElementById('stepConfigList');
    if (!box) return;
    const steps = getSuiteSteps();
    if (!Array.isArray(steps) || steps.length === 0) {
        box.innerHTML = '<div style="font-size:13px;color:rgba(255,255,255,0.5);">尚未配置。点击「↺ 恢复默认」生成 5 步默认配置后编辑保存。</div>';
        return;
    }
    box.innerHTML = steps.map((s, i) => {
        const key = (s.outputKeys && s.outputKeys[0]) ? (s.outputKeys[0].key || s.outputKeys[0]) : '';
        return `
        <div style="background: rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); border-radius:10px; padding:12px;">
            <div style="display:flex; gap:8px; align-items:center; margin-bottom:8px;">
                <span style="font-size:12px;color:rgba(255,255,255,0.6);">步骤 ${i + 1}</span>
                <input value="${escapeHtml(s.name || '')}" data-i="${i}" data-k="name" class="suite-input" placeholder="名称" style="flex:1;padding:6px 8px;border-radius:6px;border:1px solid rgba(255,255,255,0.14);background:rgba(0,0,0,0.25);color:#fff;font-size:12px;">
                <input value="${escapeHtml(key)}" data-i="${i}" data-k="outputKey" placeholder="编号" style="width:70px;padding:6px 8px;border-radius:6px;border:1px solid rgba(255,255,255,0.14);background:rgba(0,0,0,0.25);color:#fff;font-size:12px;">
                <input value="${escapeHtml(s.model || '5.0')}" data-i="${i}" data-k="model" placeholder="模型" style="width:64px;padding:6px 8px;border-radius:6px;border:1px solid rgba(255,255,255,0.14);background:rgba(0,0,0,0.25);color:#fff;font-size:12px;">
                <input value="${escapeHtml(s.ratio || '1:1')}" data-i="${i}" data-k="ratio" placeholder="比例" style="width:64px;padding:6px 8px;border-radius:6px;border:1px solid rgba(255,255,255,0.14);background:rgba(0,0,0,0.25);color:#fff;font-size:12px;">
            </div>
            <textarea data-i="${i}" data-k="prompt" rows="3" class="suite-input" placeholder="提示词（可用 {{字段}} 变量）" style="width:100%;padding:8px;border-radius:6px;border:1px solid rgba(255,255,255,0.14);background:rgba(0,0,0,0.25);color:#fff;font-size:12px;">${escapeHtml(s.prompt || '')}</textarea>
        </div>`;
    }).join('');
}

function resetSuiteSteps() {
    const def = SUITE_OUTPUTS.map(([key, name]) => ({
        name, expectCount: 1, outputKeys: [{ key, postprocess: null }],
        prompt: `【${name}】基于当前套装参考图生成这一张图片（${key}）。`,
        model: '5.0', ratio: '1:1',
        uploads: [{ type: 'current_file', filenames: ['main.jpg', 'white.png', 'black.png', 'gray.png', 'navy.png'] }],
        mappings: []
    }));
    localStorage.setItem('polo_suite_steps_v1', JSON.stringify(def));
    renderSuiteSteps();
    showToast('↺ 已生成 5 步默认配置（请按需修改后保存）');
}

function saveSuiteSteps() {
    const box = document.getElementById('stepConfigList');
    if (!box) return;

// 真实目录授权：只存路径字符串不算获得读写能力，必须持有并复查 FileSystemDirectoryHandle
async function pickSuiteDir(dirId) {
    try {
        if (!window.showDirectoryPicker) { showToast('⚠️ 当前浏览器不支持目录授权（需 Chrome）'); return; }
        const handle = await window.showDirectoryPicker({ mode: 'readwrite' });

const SUITE_DIR_DB = 'polo_suite_dir_handles';

function openSuiteDirDB() {
    return new Promise((resolve, reject) => {
        const req = indexedDB.open(SUITE_DIR_DB, 1);
        req.onupgradeneeded = () => { req.result.createObjectStore('handles'); };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
    });
}

async function persistSuiteDirHandle(dirId, handle) {
    const db = await openSuiteDirDB();
    await new Promise((resolve, reject) => {
        const tx = db.transaction('handles', 'readwrite');
        tx.objectStore('handles').put(handle, dirId);
        tx.oncomplete = resolve; tx.onerror = () => reject(tx.error);
    });
    const meta = getSuiteDirHandles();
    meta[dirId] = { name: handle.name, at: Date.now() };
    localStorage.setItem('polo_suite_dirs_v1', JSON.stringify(meta));
}

async function loadSuiteDirHandle(dirId) {
    try {
        const db = await openSuiteDirDB();
        return await new Promise((resolve, reject) => {
            const tx = db.transaction('handles', 'readonly');
            const r = tx.objectStore('handles').get(dirId);
            r.onsuccess = () => resolve(r.result || null);
            r.onerror = () => reject(r.error);
        });
    } catch (_) { return null; }
}

async function checkPathPermissions() {
    const meta = getSuiteDirHandles();
    const problems = [];
    for (const d of SUITE_DIRS) {
        const el = document.getElementById('dir-' + d.id);
        const rec = meta[d.id];
        if (!rec) { if (el) el.textContent = '未授权'; if (d.required) problems.push(`${d.label}：未授权`); continue; }
        const handle = await loadSuiteDirHandle(d.id);
        if (!handle) { if (el) el.textContent = `${rec.name}｜授权丢失，需重新选择`; problems.push(`${d.label}：授权丢失`); continue; }
        const perm = await handle.queryPermission({ mode: 'readwrite' });
        if (perm !== 'granted') {
            if (el) el.textContent = `${rec.name}｜权限 ${perm}，需重新授权`;
            problems.push(`${d.label}：权限不足（${perm}）`);
        } else if (el) el.textContent = `${rec.name}｜✅ 读写已授权`;
    }
    const st = document.getElementById('pathConfigStatus');
    if (st) st.textContent = problems.length ? `⚠️ 存在问题：${problems.join('；')}` : '✅ 所有必需目录已授权，可直接生成';
    return problems;
}

function escapeHtml(s) {

        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// 解析品牌商标黑名单文本为分级词条（🔴必换 / 🟡需确认）
function parseBlacklist(text) {
    AUDIT_DATA.blacklist = [];
    if (!text) return;
    
    const lines = text.split('\n');
    let currentSection = null;
    
    for (let line of lines) {
        line = line.trim();
        if (!line || line.startsWith('#') || line.startsWith('>') || line.startsWith('---')) continue;
        
        if (line.includes('第一级：注册商标材质词')) { currentSection = 'level1'; continue; }
        if (line.includes('第二级：知名服装品牌名')) { currentSection = 'level2'; continue; }
        if (line.includes('第三级：品牌暗示')) { currentSection = 'level3'; continue; }
        if (line.includes('第五级：灰色地带')) { currentSection = 'level5'; continue; }
        
        if (currentSection === 'level1') {
            const match = line.match(/^\|\s*([^|]+?)\s*\|\s*([^|]+?)\s*\|\s*([^|]+?)\s*\|\s*([^|]*?)\s*\|$/);
            if (match) {
                const raw = match[1].trim();
                const company = match[2].trim();
                const replacement = match[3].trim();
                const note = match[4].trim();
                const names = raw.split('/').map(n => n.trim()).filter(n => n);
                names.forEach(name => {
                    AUDIT_DATA.blacklist.push({
                        word: name.replace(/[®™]/g, ''),
                        original: name,
                        level: 'high',
                        type: 'material_brand',
                        replacement: replacement,
                        company: company,
                        note: note
                    });
                });
            }
        } else if (currentSection === 'level2') {
            const match = line.match(/^\|\s*([^|]+?)\s*\|\s*([^|]+?)\s*\|\s*([^|]*?)\s*\|/);
            if (match) {
                const name = match[1].trim();
                const chinese = match[2].trim();
                const names = name.split('/').map(n => n.trim()).filter(n => n);
                names.forEach(n => {
                    AUDIT_DATA.blacklist.push({
                        word: n.replace(/[®™]/g, ''),
                        original: name,
                        level: 'high',
                        type: 'brand',
                        chinese: chinese,
                        replacement: ''
                    });
                });
            }
        } else if (currentSection === 'level3') {
            const match = line.match(/- "([^"]+)"\s*→\s*(\S+)/);
            if (match) {
                AUDIT_DATA.blacklist.push({
                    word: match[1].trim(),
                    level: 'high',
                    type: 'implication',
                    replacement: match[2].trim()
                });
            }
        } else if (currentSection === 'level5') {
            const match = line.match(/^\|\s*([^|]+?)\s*\|\s*([^|]+?)\s*\|\s*([^|]+?)\s*\|\s*([^|]*?)\s*\|$/);
            if (match) {
                const word = match[1].trim();
                const level = match[2].trim();
                const names = word.split('/').map(n => n.trim()).filter(n => n);
                names.forEach(n => {
                    AUDIT_DATA.blacklist.push({
                        word: n,
                        level: level.includes('🔴') ? 'high' : 'medium',
                        type: 'gray',
                        replacement: match[3].trim(),
                        note: match[4].trim()
                    });
                });
            }
        }
    }
}

function parseMaterialList(text) {
    AUDIT_DATA.materialList = new Set();
    if (!text) return;
    
    const lines = text.split('\n');
    for (let line of lines) {
        line = line.trim();
        if (!line || line.startsWith('#') || line.startsWith('>') || line.startsWith('---')) continue;
        
        const bulletMatch = line.match(/^[-*•]\s+(.+)$/);
        if (bulletMatch) {
            const content = bulletMatch[1].trim();
            const parenMatch = content.match(/^(.+?)(?:\s*\(.+\))?$/);
            const mainWord = parenMatch ? parenMatch[1].trim() : content;
            AUDIT_DATA.materialList.add(mainWord.toLowerCase());
            AUDIT_DATA.materialList.add(content.toLowerCase());
        }
        
        const tableMatch = line.match(/^\|\s*([^|]+?)\s*\|\s*([^|]+?)\s*\|\s*([^|]+?)\s*\|\s*([^|]*?)\s*\|$/);
        if (tableMatch) {
            AUDIT_DATA.materialList.add(tableMatch[1].trim().toLowerCase());
        }
    }
}

function findBrandWords(text) {
    if (!text || !AUDIT_DATA.loaded) return [];
    const results = [];
    const lowerText = text.toLowerCase();
    
    for (const item of AUDIT_DATA.blacklist) {
        const lowerWord = item.word.toLowerCase();
        if (lowerWord.length < 2) continue;
        
        const regex = new RegExp('\\b' + lowerWord.replace(/[-[\]{}()*+?.,\\^$|#\s]/g, '\\$&') + '\\b', 'gi');
        let match;
        while ((match = regex.exec(text)) !== null) {
            results.push({
                ...item,
                found: match[0],
                position: match.index,
                context: text.substring(Math.max(0, match.index - 20), match.index + match[0].length + 20)
            });
        }
    }
    return results;
}

function checkMaterialWords(text) {
    if (!text || !AUDIT_DATA.loaded) return [];
    const results = [];
    const tokens = text.split(/[，。、；：！？,.!?:;()\s]+/).filter(t => t.length >= 2);
    
    for (const token of tokens) {
        const lowerToken = token.toLowerCase();
        if (!AUDIT_DATA.materialList.has(lowerToken)) {
            if (!containsAnySafeMaterial(lowerToken)) {
                results.push({
                    word: token,
                    level: 'medium',
                    type: 'unknown_material',
                    reason: '不在材质大全列表中'
                });
            }
        }
    }
    return results;
}

function containsAnySafeMaterial(text) {
    for (const material of AUDIT_DATA.materialList) {
        if (text.includes(material)) return true;
    }
    return false;
}

// 品牌词审核：扫描文案中的黑名单词并分级标记风险
function auditProduct(product) {
    const issues = [];
    
    const fieldsToCheck = [
        { key: 'title', label: '标题', content: product.title },
        { key: 'highlights', label: '卖点', content: product.highlights },
        { key: 'faq', label: 'FAQ', content: product.faq },
        { key: 'material', label: '材质', content: product.material },
        { key: 'fabric_type', label: '面料类型', content: product.fabric_type },
        { key: 'features', label: '产品特性', content: product.features },
        { key: 'technics', label: '工艺', content: product.technics },
        { key: 'design', label: '设计', content: product.design },
    ];
    
    for (const field of fieldsToCheck) {
        if (!field.content) continue;
        
        const brandIssues = findBrandWords(field.content);
        for (const issue of brandIssues) {
            issues.push({
                row: product.row,
                field: field.label,
                type: 'brand',
                level: issue.level,
                word: issue.found,
                original: issue.original,
                replacement: issue.replacement,
                note: issue.note || '',
                context: issue.context
            });
        }
        
        if (['材质', '面料类型', '产品特性'].includes(field.label)) {
            const materialIssues = checkMaterialWords(field.content);
            for (const issue of materialIssues) {
                issues.push({
                    row: product.row,
                    field: field.label,
                    type: 'material',
                    level: issue.level,
                    word: issue.word,
                    reason: issue.reason
                });
            }
        }
    }
    
    return issues;
}

function runAudit() {
    if (!AUDIT_DATA.loaded) {
        showToast('⚠️ 审核数据加载中，请稍候');
        return;
    }
    
    const startTime = Date.now();
    const allIssues = [];
    
    for (const product of products) {
        const issues = auditProduct(product);
        if (issues.length > 0) {
            allIssues.push(...issues);
        }
    }
    
    const duration = Date.now() - startTime;
    console.log(`📊 审核完成，耗时 ${duration}ms，发现 ${allIssues.length} 个问题`);
    
    renderAuditReport(allIssues);
}

function groupByRow(issues) {
    return issues.reduce((acc, issue) => {
        if (!acc[issue.row]) acc[issue.row] = [];
        acc[issue.row].push(issue);
        return acc;
    }, {});
}

function buildFilteredHighlightsText() {
    if (!currentProduct) return '';
    const highlights = parseHighlights(currentProduct.highlights || '');
    return highlights.filter((h, i) => !isSkipped(currentProduct.row, i, 'highlight')).map(h => {
        let line = `${h.num || ''}. ${h.label_en ? h.label_en + ': ' : ''}${h.desc_en}`;
        if (h.label_cn || h.desc_cn) {
            line += ` [${h.label_cn}]：${h.desc_cn}`;
        }
        return line;
    }).join('\n');
}

function getFilteredHighlightDescs() {
    if (!currentProduct) return [];
    const highlights = parseHighlights(currentProduct.highlights || '');
    return highlights
        .filter((h, i) => !isSkipped(currentProduct.row, i, 'highlight'))
        .map(h => (h.desc_en || '').trim())

}

function buildFilteredFaqText() {
    if (!currentProduct) return '';

    }).join('\n');
}

    if (extensionInstalled) {

            const baseDir = getBaseDir();
            const colorImgDir = baseDir || '';
            chrome.runtime.sendMessage(EXTENSION_ID, {
                action: 'saveProductData', 
                data: filteredProduct, 
                imageDir: baseDir ? baseDir + '/extracted_images' : '',
                colorImgDir: colorImgDir
            }, () => {});
        } catch (e) {}
    }
    setTimeout(() => { window.open(PUBLISH_URL, '_blank'); }, 200);
}

const COLOR_PROMPT = '原图原样，只改衣服颜色，背景版型纹理光影不变，高清服装实拍 四张图片，一张白色，一张黑色，一张灰色，一张深藏青色 ，图片比例1：1，锐化不要太严重';
const COLOR_NAMES = ['white', 'black', 'gray', 'navy'];
const BATCH_COLOR_COMPLETE_TIMEOUT = 6 * 60 * 1000;

let batchColorState = null;

const batchColorProgressEl = () => document.getElementById('batchColorProgress');
const batchColorStatusEl = () => document.getElementById('batchColorStatus');
const batchColorFillEl = () => document.getElementById('batchColorFill');
const batchColorCounterEl = () => document.getElementById('batchColorCounter');
const batchColorCurrentEl = () => document.getElementById('batchColorCurrent');

function startBatchColorChange() {
    if (!products || products.length === 0) {
        showToast('⚠️ 请先上传 Excel');
        return;
    }
    if (batchColorState && batchColorState.running) {
        showToast('⚠️ 批量换色正在进行中');
        return;
    }
    if (!extensionInstalled) {
        showToast('⚠️ 请确认扩展已安装');
        return;
    }

    const targetList = products.filter(p => p.status !== '废弃' && p.status !== '是');
    if (targetList.length === 0) {
        showToast('⚠️ 没有可处理的产品');
        return;
    }

    let startIdx = 0;
    if (currentProduct) {
        startIdx = targetList.findIndex(p => p.row === currentProduct.row);
        if (startIdx === -1) startIdx = 0;
    }
    const remainingList = targetList.slice(startIdx);
    const remainingCount = remainingList.length;

    const ok = confirm(`将从 row${remainingList[0].row} 开始，对 ${remainingCount} 款产品依次执行 AI 换色（从当前款到最后一款）。\n\n每款产品处理完后再处理下一款，处理过程中可随时点"停止"按钮中断。\n\n确定开始？`);
    if (!ok) return;

    beginColorBatch(remainingList, '一键换色');
}

// 批量换色统一启动入口：一键换色与「指定重生成」共用
function beginColorBatch(queueList, label) {
    if (batchColorState && (batchColorState.inFlightRow || batchColorState.pendingAckRow)) {
        showToast('当前款尚未结束，未覆盖原换色任务'); return;
    }
    batchColorState = {
        running: true,
        stopRequested: false,
        queue: queueList.map((p, i) => ({ ...p, _idx: i })),
        currentIndex: 0,
        successCount: 0,
        failCount: 0,
        startTime: Date.now(),
        startRow: queueList[0].row,
        lastAdvancedRow: null,
        lastProcessedTimestamp: 0,
        pollTimer: null,
        label: label || '批量换色',
        failedRows: [],
        skippedRows: [],
        lastMemMB: 0,
        // 任务标识：完成消息据此拒绝旧任务/重复消息
        batchId: 'cb_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8),
        // 当前执行行；暂停清除执行等待并保留该行，继续时重新执行。
        // 暂停保留当前行，继续时生成新的执行身份并重做当前行。
        inFlightRow: null,
        inFlightSince: 0,
        pendingAckRow: null,    // 已委派但未确认接收的行（阻挡后续派发）
        fileKey: currentFileKey(),   // 任务创建时绑定文件：切文件后不被接管
        fileFolder: loadedFileName || '默认',
        timedOutRows: [],       // 已判超时、等待人工确认的行（迟到完成只提示，不重复入账）
        pausedReason: ''
    };
    saveColorBatchState();

    // 新任务启动即清空「继续」待办（旧待办已被本次任务取代）
    setColorResumeRows([]);

    showBatchColorProgress();
    startBatchColorPolling();
    processNextBatchColor();
}

// 生成「行N · 序号X · 标题」预览行（确认框用）
function buildRowPreviewLines(queue, max = 15) {
    const lines = queue.slice(0, max).map(p => {
        const title = String(p.title_cn || p.title_en || '未命名').slice(0, 16);
        const idxText = (p.index === '' || p.index === null || p.index === undefined) ? '-' : p.index;
        return `  行${p.row} · 序号${idxText} · ${title}`;
    });
    if (queue.length > max) lines.push(`  … 等共 ${queue.length} 款`);
    return lines;
}

// ===== 「继续」：记住被停止 / 失败打断的剩余行，供续跑 =====
const COLOR_RESUME_KEY = 'polo_color_resume_rows';

function getColorResumeRows() {
    const raw = localStorage.getItem(COLOR_RESUME_KEY + '::' + colorBatchFileKey()) || '';
    return raw.split(/\s+/).filter(Boolean).map(Number).filter(n => Number.isInteger(n) && n > 0);
}

function setColorResumeRows(rows) {
    const list = Array.isArray(rows) ? rows.filter(r => Number.isInteger(r) && r > 0) : [];
    const uniq = [...new Set(list)]; // 按传入顺序去重
    const key = COLOR_RESUME_KEY + '::' + colorBatchFileKey();
    if (uniq.length === 0) {
        localStorage.removeItem(key);
    } else {
        localStorage.setItem(key, uniq.join(' '));
    }
    syncColorResumeButton();
}

// 兼容旧版本超时缓存；继续时清除，不作为操作门槛。
const COLOR_TIMEOUT_KEY = 'polo_color_timeout_rows';

function getColorTimeoutRows() {
    const raw = localStorage.getItem(COLOR_TIMEOUT_KEY + '::' + colorBatchFileKey()) || '';
    return raw.split(/\s+/).filter(Boolean).map(Number).filter(n => Number.isInteger(n) && n > 0);
}

function setColorTimeoutRows(rows) {
    const uniq = [...new Set((Array.isArray(rows) ? rows : []).filter(r => Number.isInteger(r) && r > 0))];
    const key = COLOR_TIMEOUT_KEY + '::' + colorBatchFileKey();
    if (uniq.length === 0) localStorage.removeItem(key);
    else localStorage.setItem(key, uniq.join(' '));
    if (batchColorState) batchColorState.timedOutRows = uniq;
    syncBatchColorTimeoutActions();
}

function syncBatchColorTimeoutActions() {
    for (const id of ['colorCheckExecBtn', 'colorTimeoutDoneBtn', 'colorTimeoutRetryBtn', 'colorTimeoutSkipBtn', 'colorTimeoutHint']) {
        const el = document.getElementById(id);
        if (el) el.style.display = 'none';
    }
}




// 「停止 / 继续」一体按钮：运行中显示"停止"，暂停且有剩余时显示"继续"
function setBatchColorToggle(mode) {
    const btn = document.getElementById('batchColorToggleBtn');
    if (!btn) return;
    if (mode === 'resume') {
        const n = getColorResumeRows().length;
        btn.textContent = n > 0 ? `▶ 继续（剩 ${n}）` : '▶ 继续';
        btn.disabled = n === 0;
    } else {
        btn.textContent = '⏸ 暂停';
        btn.disabled = false;
    }
}

// 重绘后从实际任务恢复文案、按钮和异常处理入口，不沿用模板默认状态。
function restoreBatchColorUI() {
    const panel = batchColorProgressEl();
    const left = getColorResumeRows().length;
    const hasTask = !!batchColorState;
    const pending = getColorTimeoutRows().length > 0;
    if (panel) panel.style.display = hasTask || left > 0 || pending ? 'block' : 'none';
    updateBatchColorProgress();
    if (!hasTask && left > 0) updateBatchColorStatus(`换色已暂停 · 剩 ${left} 款，等待你继续`);
    if (!hasTask && left > 0) {
        updateBatchColorFill(0);
        const counter = batchColorCounterEl(); if (counter) counter.textContent = `剩 ${left} 款`;
        const cur = batchColorCurrentEl(); if (cur) cur.textContent = '已暂停';
    }
    if (!hasTask && pending) updateBatchColorStatus('换色已暂停');
    const running = !!(batchColorState && batchColorState.running);
    setBatchColorToggle(running ? 'stop' : 'resume');
    const toggle = document.getElementById('batchColorToggleBtn');
    if (toggle) {
        const blocked = !running && !!(batchColorState && colorBatchFileKey() !== currentFileKey());
        toggle.disabled = blocked || (!running && left === 0 && !(batchColorState && (batchColorState.inFlightRow || batchColorState.pendingAckRow)));
        if (!running && left === 0 && !(batchColorState && (batchColorState.inFlightRow || batchColorState.pendingAckRow))) toggle.textContent = blocked ? '继续' : '已完成';
    }
    const btn = document.getElementById('batchColorBtn');
    if (btn) { btn.disabled = running || !!(batchColorState && batchColorState.inFlightRow); btn.textContent = running ? '⏳ 换色中...' : '🚀 一键换色'; }
    const rowsBtn = document.getElementById('colorRowsBtn');
    if (rowsBtn) rowsBtn.disabled = running || !!(batchColorState && batchColorState.inFlightRow);
    syncBatchColorTimeoutActions();
}

// 兼容旧调用点：非运行态才刷新
function syncColorResumeButton() {
    restoreBatchColorUI();
}

// 面板按钮点击：运行中 → 停止；否则 → 继续
function toggleBatchColorRun() {
    if (batchColorState && batchColorState.running) {
        stopBatchColorChange();
        return;
    }
    resumeColorBatch();
}

// 从上次停止 / 失败处继续
function resumeColorBatch() {
    if (batchColorState && colorBatchFileKey() !== currentFileKey()) {
        showToast('请先切回任务所属 Excel，再继续换色'); return;
    }
    if (batchColorState && batchColorState.running) {
        showToast('⚠️ 换色任务正在进行中');
        return;
    }
    if (!extensionInstalled) {
        showToast('⚠️ 请确认扩展已安装');
        return;
    }
    if (!products || products.length === 0) {
        showToast('⚠️ 请先上传 Excel');
        return;
    }

    if (batchColorState) {
        const state = batchColorState;
        // 兼容旧缓存中的在途/超时记录：当前款重新执行，不等待旧引擎。
        const pausedRow = state.inFlightRow || state.pendingAckRow || getColorTimeoutRows()[0] || (state.failedRows || [])[0];
        const idx = state.queue.findIndex(p => p.row === pausedRow);
        if (idx >= 0) state.currentIndex = idx;
        state.inFlightRow = null; state.pendingAckRow = null; state.inFlightSince = 0;
        state.executionId = null;
        if (state.currentTimeoutId) clearTimeout(state.currentTimeoutId);
        stopBatchColorPolling();
        setColorTimeoutRows([]);
        state.timedOutRows = [];
        state.batchId = 'bc_' + Date.now() + '_' + Math.random().toString(36).slice(2);
        state.pausedReason = '';
        state.stopRequested = false;
        state.running = true;
        // 先让旧执行失效，再重新派发；不弹额外确认框。
        chrome.runtime.sendMessage(EXTENSION_ID, { action: 'pauseColorDispatch' }, response => {
            if (batchColorState !== state || state.stopRequested) return;
            if (chrome.runtime.lastError || !response || !response.ok) { state.running = false; restoreBatchColorUI(); showToast('无法连接扩展，请重新加载扩展'); return; }
            state.running = true;
            saveColorBatchState(); showBatchColorProgress();
            startBatchColorPolling(); sendNextBatchColor();
        });
        return;
    }
    const rows = getColorResumeRows();
    if (rows.length === 0) {
        showToast('ℹ️ 没有可继续的任务');
        return;
    }

    const byRow = new Map(products.map(p => [p.row, p]));
    const queue = [];
    const missing = [];
    for (const r of rows) {
        const p = byRow.get(r);
        if (p) queue.push(p); else missing.push(r);
    }
    if (queue.length === 0) {
        showToast(`⚠️ 剩余行号都不在当前 Excel：${missing.slice(0, 8).join(' ')}`);
        return;
    }

    beginColorBatch(queue, '继续');
}

// 解析行号输入：空格 / 英文逗号 / 中文逗号 / 分号 / 顿号 / 换行分隔，支持 a-b 区间
function parseRowNumbers(text) {
    const seen = new Set();
    const out = [];
    const push = (n) => {
        if (Number.isInteger(n) && n > 0 && !seen.has(n)) { seen.add(n); out.push(n); }
    };
    const norm = String(text || '').replace(/\s*[-~—]\s*/g, '-');
    for (const t of norm.split(/[\s,，;；、]+/).filter(Boolean)) {
        const m = t.match(/^(\d+)-(\d+)$/);
        if (m) {
            let a = parseInt(m[1], 10);
            let b = parseInt(m[2], 10);
            if (a > b) { const tmp = a; a = b; b = tmp; }
            if (b - a > 2000) continue; // 防误输入把区间撑爆
            for (let i = a; i <= b; i++) push(i);
        } else if (/^\d+$/.test(t)) {
            push(parseInt(t, 10));
        }
    }
    return out;
}

// 指定重生成：输入行号，只跑这些行（复用一键换色的队列/进度/停止/超时逻辑）
function startColorChangeForRows() {
    if (!products || products.length === 0) {
        showToast('⚠️ 请先上传 Excel');
        return;
    }
    if (batchColorState && batchColorState.running) {
        showToast('⚠️ 换色任务正在进行中');
        return;
    }
    if (!extensionInstalled) {
        showToast('⚠️ 请确认扩展已安装');
        return;
    }

    const lastInput = localStorage.getItem('polo_color_rows_last') || '';
    const input = prompt(
        '输入要重新生成的行号\n（空格 / 逗号 / 换行分隔，支持 315-357 区间）\n\n例：32 42 44 48 49 52',
        lastInput
    );
    if (input === null) return;

    const rows = parseRowNumbers(input);
    if (rows.length === 0) {
        showToast('⚠️ 没解析到有效行号');
        return;
    }

    const byRow = new Map(products.map(p => [p.row, p]));
    const queue = [];
    const missing = [];
    for (const r of rows) {
        const p = byRow.get(r);
        if (p) queue.push(p); else missing.push(r);
    }
    if (queue.length === 0) {
        showToast(`⚠️ 这些行号都不在当前 Excel：${missing.slice(0, 8).join(' ')}${missing.length > 8 ? ' ...' : ''}`);
        return;
    }

    // 确认框逐条显示身份（行号 · 序号 · 标题），防止误填「序号」命中错款
    const previewLines = buildRowPreviewLines(queue);
    const missMsg = missing.length
        ? `\n\n⚠️ 不在当前 Excel 中，将跳过 ${missing.length} 个：\n${missing.slice(0, 30).join(' ')}${missing.length > 30 ? ' ...' : ''}`
        : '';
    const ok = confirm(
        `将对指定的 ${queue.length} 款产品依次执行 AI 换色：\n\n${previewLines.join('\n')}${missMsg}\n\n确定开始？`
    );
    if (!ok) return;

    localStorage.setItem('polo_color_rows_last', input.trim());
    beginColorBatch(queue, '指定重生成');
}

// 轮询兜底：网页通过消息查询扩展存储；不依赖网页中不存在的 chrome.storage API
function startBatchColorPolling() {
    if (!batchColorState || batchColorState.pollTimer) return;
    // 有在途行时即使已暂停也继续轮询：直接通知可能因断连丢失，需靠持久化完成事件补收
    const pollActive = () => !!batchColorState && (batchColorState.running || !!batchColorState.inFlightRow);
    batchColorState.pollTimer = setInterval(() => {
        if (!pollActive()) return;
        try {
            chrome.runtime.sendMessage(EXTENSION_ID, { action: 'getColorTaskEvents' }, (response) => {
                if (chrome.runtime.lastError || !response || !response.ok || !pollActive()) return;
                const result = response.events || {};
                if (result.color_task_stopped_event) handleColorTaskStopped(result.color_task_stopped_event);
                if (!pollActive()) return;
                if (result.color_task_accepted_event) handleColorTaskAccepted(result.color_task_accepted_event);
                const evt = result['color_task_complete_event'];
                if (!evt || !evt.rowNum || !evt.timestamp) return;
                if (batchColorState.executionId && evt.executionId !== batchColorState.executionId) return;
                // 只处理比上次处理过的新事件
                if (evt.timestamp <= batchColorState.lastProcessedTimestamp) return;
                // 只认当前在途行（暂停中同样成立）
                if (batchColorState.inFlightRow === evt.rowNum) {
                    console.log(`🎨 轮询兜底捕获完成事件: row${evt.rowNum}`);
                    batchColorState.lastProcessedTimestamp = evt.timestamp;
                    advanceBatchColorForRow(evt.rowNum, 'poll', evt.batchId, evt.results);
                }
            });
        } catch (e) {
            console.warn('批量换色轮询异常:', e);
        }
    }, 3000);
}

function stopBatchColorPolling() {
    if (batchColorState && batchColorState.pollTimer) {
        clearInterval(batchColorState.pollTimer);
        batchColorState.pollTimer = null;
    }
}

function processNextBatchColor() {
    if (!batchColorState || !batchColorState.running) return;
    if (batchColorState.stopRequested) {
        finishBatchColor(false);
        return;
    }
    if (batchColorState.currentIndex >= batchColorState.queue.length) {
        finishBatchColor(true);
        return;
    }
    sendNextBatchColor();
}

function sendNextBatchColor() {
    if (!batchColorState || !batchColorState.running) return;
    if (batchColorState.inFlightRow) return;
    // 上一款委派未确认接收：不推进、不当作已派发，等确认或用户明确处理
    if (batchColorState.pendingAckRow) {
        showToast(`⚠️ row${batchColorState.pendingAckRow} 委派未确认接收，已暂停派发下一款`);
        return;
    }
    if (batchColorState.currentIndex >= batchColorState.queue.length) {
        finishBatchColor(true);
        return;
    }

    const product = batchColorState.queue[batchColorState.currentIndex];
    // 重置去重标记，允许新行被推进
    batchColorState.lastAdvancedRow = null;
    // 记录在途行：暂停后它仍会在豆包继续生成，其完成消息必须能落地
    batchColorState.inFlightRow = product.row;
    batchColorState.inFlightSince = Date.now();
    updateBatchColorProgress();

    if (colorBatchFileKey() !== currentFileKey()) { finishBatchColor(false, '请切回任务所属 Excel 后继续'); return; }
    const imagePath = getMainImagePath(product.row);
    batchColorState.executionId = 'ce_' + Date.now() + '_' + Math.random().toString(36).slice(2);
    const dispatchState = batchColorState, dispatchId = batchColorState.executionId;
    saveColorBatchState();
    chrome.runtime.sendMessage(EXTENSION_ID, {
        action: 'startColorChange',
        task: {
            imagePath, prompt: COLOR_PROMPT, rowNum: product.row,
            batchId: batchColorState.batchId,
            executionId: dispatchId,
            fileKey: colorBatchFileKey(),
            fileFolder: batchColorState.fileFolder || loadedFileName || '默认'   // 执行期内绑定，异步回调不再读当前文件
        }
    }, (response) => {
        if (batchColorState !== dispatchState || batchColorState.executionId !== dispatchId) return;
        if (chrome.runtime.lastError || !response || !response.ok) {
            if (response && response.pending) {
                batchColorState.pendingAckRow = product.row;
                saveColorBatchState(); startBatchColorPolling(); setupBatchColorTimeout(product); return;
            }
            finishBatchColor(false);
            showToast('换色启动失败，已暂停，点击继续重试');
            return;
        }
        // 待接收仍是当前在途行：接收事件与完成事件都能落地，超时有明确恢复路径。
        if (response.pending || response.unconfirmed) {
            batchColorState.pendingAckRow = product.row;
            saveColorBatchState();
            startBatchColorPolling();
            setupBatchColorTimeout(product);
            updateBatchColorStatus(`等待 row${product.row} 被豆包接收`);
            return;
        }
        batchColorState.pendingAckRow = null;
        saveColorBatchState();
        showToast(`🚀 已发送 row${product.row} 到豆包生成颜色图...`);
        setupBatchColorTimeout(product);
    });
}

function setupBatchColorTimeout(product) {
    if (!batchColorState) return;
    if (batchColorState.currentTimeoutId) clearTimeout(batchColorState.currentTimeoutId);
    const state = batchColorState, executionId = state.executionId;
    state.currentTimeoutId = setTimeout(() => {
        if (batchColorState !== state || state.executionId !== executionId || state.inFlightRow !== product.row) return;
        finishBatchColor(false);
        showToast('换色超时，已暂停');
    }, BATCH_COLOR_COMPLETE_TIMEOUT);
}

function checkAllColorsReady(rowNum) {
    try {
        const storageKey = (loadedFileName || '默认').replace(/[^a-zA-Z0-9\u4e00-\u9fff]/g, '_') + '__color__' + rowNum;
        let ready = true;
        for (const color of COLOR_NAMES) {
            const img = document.querySelector(`.color-img-item[data-color="${color}"][data-row="${rowNum}"] img`)
                || document.querySelector(`.color-images-grid .color-img-item[data-color="${color}"] img`);
            if (!img || !img.complete || !img.src || img.src.includes('data:image/png;base64,iVBORw0KGgo')) {
                const cached = localStorage.getItem('ps_color_' + storageKey + '_' + color);
                if (!cached) { ready = false; break; }
            }
        }
        return ready;
    } catch (e) {
        return false;
    }
}

function stopBatchColorChange() {
    if (!batchColorState) return;
    batchColorState.stopRequested = true;
    updateBatchColorStatus('⏸ 正在暂停...');
    // 立即收尾：扩展侧没有取消通道，若只设标记，推进只能等单款超时（最长 6 分钟），表现为「卡住」
    // finishBatchColor 内部会清超时、停轮询、恢复按钮
    finishBatchColor(false);
}

function finishBatchColor(completed, reason) {
    if (!batchColorState) return;
    if (!completed) {
        const state = batchColorState;
        const row = state.inFlightRow || state.pendingAckRow;
        const idx = state.queue.findIndex(p => p.row === row);
        if (idx >= 0) state.currentIndex = idx;
        state.running = false; state.stopRequested = true;
        state.inFlightRow = null; state.pendingAckRow = null; state.inFlightSince = 0;
        state.executionId = null; state.pausedReason = '';
        if (state.currentTimeoutId) clearTimeout(state.currentTimeoutId);
        state.currentTimeoutId = null;
        stopBatchColorPolling();
        setColorTimeoutRows([]); state.timedOutRows = [];
        refreshColorResumeRowsFromState(); saveColorBatchState();
        try { chrome.runtime.sendMessage(EXTENSION_ID, { action: 'pauseColorDispatch' }, () => { void chrome.runtime.lastError; }); } catch (_) {}
        restoreBatchColorUI(); updateBatchColorProgress();
        updateBatchColorStatus('换色已暂停');
        return;
    }
    const finishedState = batchColorState;
    const batchLabel = batchColorState.label || '批量换色';
    // 在途行仍会在豆包继续生成：保留其超时定时器与完成轮询，让完成/失败都能入账
    const hasInFlight = !!batchColorState.inFlightRow;
    if (!hasInFlight && batchColorState.currentTimeoutId) {
        clearTimeout(batchColorState.currentTimeoutId);
        batchColorState.currentTimeoutId = null;
    }
    if (!hasInFlight) stopBatchColorPolling();
    batchColorState.running = false;
    batchColorState.pausedReason = reason || '';
    saveColorBatchState();
    try { chrome.runtime.sendMessage(EXTENSION_ID, { action: 'pauseColorDispatch' }, () => { void chrome.runtime.lastError; }); } catch (_) {}
    const total = batchColorState.queue.length;
    const success = batchColorState.successCount;
    const fail = batchColorState.failCount;
    const elapsed = Math.round((Date.now() - batchColorState.startTime) / 1000);
    const minutes = Math.floor(elapsed / 60);
    const seconds = elapsed % 60;
    const timeStr = minutes > 0 ? `${minutes}分${seconds}秒` : `${seconds}秒`;

    // 记下「失败 + 尚未派发」的行（**不含**仍在生成中的在途行，否则「继续」会重复提交它）
    const leftOver = computeColorResumeRows();
    setColorResumeRows(leftOver);

    updateBatchColorStatus(`✅ ${batchLabel}完成 ${success} 款`);
    updateBatchColorFill(100);
    restoreBatchColorUI();

    if (colorPollTimer) { clearInterval(colorPollTimer); colorPollTimer = null; }

    setTimeout(() => {
        // 5 秒内若已开新任务，勿干扰新任务的状态与按钮
        if (batchColorState && batchColorState !== finishedState) return;
        const btn = document.getElementById('batchColorBtn');
        if (btn) { btn.disabled = false; btn.innerHTML = '🚀 一键换色'; }
        const rowsBtn = document.getElementById('colorRowsBtn');
        if (rowsBtn) rowsBtn.disabled = false;
        if (batchColorState.inFlightRow) {
            // 在途行还在豆包生成：保留面板与状态，等它结束（不重复提交该款）
            restoreBatchColorUI();
            return;
        }
        if (getColorResumeRows().length > 0) {
            // 还有没跑完的：保留进度面板、按钮停在「继续」，state 不置空（供再次续跑）
            restoreBatchColorUI();
            return;
        }
        const el = batchColorProgressEl();
        if (el) el.style.display = 'none';
        if (batchColorState === finishedState) {
            const key = colorBatchFileKey();
            localStorage.removeItem(COLOR_BATCH_STATE_KEY + '::' + key);
            const global = localStorage.getItem(COLOR_BATCH_STATE_KEY);
            try { if (global && JSON.parse(global).fileKey === key) localStorage.removeItem(COLOR_BATCH_STATE_KEY); } catch (_) {}
            batchColorState = null;
        }
        setBatchColorToggle('stop');
    }, 5000);
}

function openPhotopea(rowNum) {
    const imgFileName = `row${rowNum}_main.jpg`;
    const imgPath = `extracted_images/${imgFileName}`;
    const pngFileName = `row${rowNum}_main.png`;
    const pngPath = `extracted_images/${pngFileName}`;
    const isFileProtocol = location.protocol === 'file:';

    const tryFsAccessWay = async (fileName = imgFileName) => {
        if (!psEditDirHandle) {
            showToast('❌ 请先授权 extracted_images 目录');
            return;
        }
        try {
            let fileHandle;
            try {
                fileHandle = await psEditDirHandle.getFileHandle(fileName);
            } catch (e) {
                if (fileName === imgFileName) {
                    fileHandle = await psEditDirHandle.getFileHandle(pngFileName);
                    fileName = pngFileName;
                } else {
                    throw e;
                }
            }
            const file = await fileHandle.getFile();
            const reader = new FileReader();
            reader.onload = () => {
                openPhotopeaWithExtension(reader.result, fileName, rowNum);
            };
            reader.onerror = () => {
                showToast('❌ 图片转码失败');
            };
            reader.readAsDataURL(file);
        } catch (e) {
            console.warn('File System Access 读取失败:', e);
            showToast('❌ 加载图片失败: ' + e.message);
        }
    };

    const tryFetchWay = (path = imgPath, fileName = imgFileName) => {
        fetch(path + '?t=' + Date.now())
            .then(res => {
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return res.blob();
            })
            .then(blob => {
                const reader = new FileReader();
                reader.onload = () => {
                    openPhotopeaWithExtension(reader.result, fileName, rowNum);
                };
                reader.onerror = () => {
                    showToast('❌ 图片转码失败');
                };
                reader.readAsDataURL(blob);
            })
            .catch(e => {
                console.warn('fetch 失败:', e);
                if (path === imgPath) {
                    tryFetchWay(pngPath, pngFileName);
                } else if (isFileProtocol) {
                    tryFsAccessWay();
                } else {
                    tryImageWay();
                }
            });
    };

    const tryImageWay = (path = imgPath, fileName = imgFileName) => {
        const tempImg = new Image();
        if (!isFileProtocol) tempImg.crossOrigin = 'anonymous';
        tempImg.onload = () => {
            try {
                const dataUrl = imgToDataUrl(tempImg);
                openPhotopeaWithExtension(dataUrl, fileName, rowNum);
            } catch (e2) {
                showToast('❌ 图片转码失败: ' + e2.message);
            }
        };
        tempImg.onerror = () => {
            if (path === imgPath) {
                tryImageWay(pngPath, pngFileName);
            } else {
                showToast('❌ 加载图片失败');
            }
        };
        tempImg.src = path + '?t=' + Date.now();
    };

    tryFetchWay();
}

function imgToDataUrl(img) {

    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);
    return canvas.toDataURL('image/png');
}
