function startPsEditPolling(rowNum) {
    if (psPollTimer) clearInterval(psPollTimer);
    const imgPath = `extracted_images/row${rowNum}_main.jpg`;
    const imgPathPng = `extracted_images/row${rowNum}_main.png`;
    psImgCheckState[rowNum] = { width: 0, height: 0 };
    let count = 0;
    let usePng = false;
    psPollTimer = setInterval(() => {
        count++;
        if (count > 200) {
            clearInterval(psPollTimer);
            psPollTimer = null;
            return;
        }

        try {
            chrome.runtime.sendMessage(EXTENSION_ID, { action: 'getPsEditResult', rowNum }, (response) => {
                if (chrome.runtime.lastError) {
                    console.log('[PS轮询] 扩展未安装或消息发送失败');

                }
                const psResult = response?.result;

                    lastPsEditTimestamp = psResult.timestamp;
                    handlePsEditComplete(psResult);
                    chrome.runtime.sendMessage(EXTENSION_ID, { action: 'clearPsEditResult' }, () => {});
                    return;
                }
            });
        } catch (e) {
            console.error('[PS轮询] 消息发送失败:', e);
        }

        const testImg = new Image();
        testImg.onload = () => {
            const state = psImgCheckState[rowNum];
            if (!state) return;
            if (state.width === 0 && state.height === 0) {
                state.width = testImg.naturalWidth;
                state.height = testImg.naturalHeight;
                return;
            }
            if (testImg.naturalWidth !== state.width || testImg.naturalHeight !== state.height) {
                state.width = testImg.naturalWidth;
                state.height = testImg.naturalHeight;
                refreshMainImage(rowNum);
                showToast('✅ 图片已更新');
                return;
            }
            const canvas = document.createElement('canvas');
            const w = Math.min(testImg.naturalWidth, 50);
            const h = Math.min(testImg.naturalHeight, 50);
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(testImg, 0, 0, w, h);
            try {
                const data = ctx.getImageData(0, 0, w, h).data;
                let hash = 0;
                for (let i = 0; i < data.length; i += 40) {
                    hash = ((hash << 5) - hash + data[i]) | 0;
                }
                if (state.pixelHash && state.pixelHash !== hash) {
                    state.pixelHash = hash;
                    refreshMainImage(rowNum);
                    showToast('✅ 图片已更新');
                } else if (!state.pixelHash) {
                    state.pixelHash = hash;
                }
            } catch (e) {}
        };
        testImg.onerror = () => {
            if (!usePng) {
                usePng = true;
            }
        };
        const path = usePng ? imgPathPng : imgPath;
        testImg.src = path + (path.includes('?') ? '&' : '?') + 't=' + Date.now() + '_' + count;
    }, 3000);

function hasChinese(s) { return /[\u4e00-\u9fa5]/.test(s); }
function hasEnglish(s) { return /[a-zA-Z]/.test(s); }

// 拆分中英双语单元格：支持「中文\n英文」两行与「中英混排」两种格式，返回 { cn, en }
function splitBilingual(text) {
    if (!text) return { en: '', cn: '' };
    let str = String(text).replace(/\n/g, ' ').trim();
    if (!str) return { en: '', cn: '' };

    const pipeIdx = str.indexOf('||');
    if (pipeIdx !== -1) {
        const left = str.substring(0, pipeIdx).trim();
        const right = str.substring(pipeIdx + 2).trim();
        const leftCn = hasChinese(left);
        const leftEn = hasEnglish(left);
        const rightCn = hasChinese(right);
        const rightEn = hasEnglish(right);
        if (!leftCn && leftEn && rightCn) return { en: left, cn: right };
        if (leftCn && !rightCn && rightEn) return { en: right, cn: left };
    }

    const slashRegex = /[\/／]/g;
    const slashIndices = [];
    let m;
    while ((m = slashRegex.exec(str)) !== null) {
        slashIndices.push(m.index);
    }
    if (slashIndices.length > 0) {
        let bestMatch = null;
        for (const slashIdx of slashIndices) {
            const left = str.substring(0, slashIdx).trim();
            const right = str.substring(slashIdx + 1).trim();
            const leftCn = hasChinese(left);
            const leftEn = hasEnglish(left);
            const rightCn = hasChinese(right);
            const rightEn = hasEnglish(right);

            if (!leftCn && leftEn && rightCn) {
                bestMatch = { en: left, cn: right };
            }
            if (leftCn && !rightCn && rightEn) {
                bestMatch = { en: right, cn: left };
            }
        }
        if (bestMatch) return bestMatch;
    }

    const hasCn = hasChinese(str);
    const hasEn = hasEnglish(str);

    if (!hasCn) return { en: str, cn: '' };
    if (!hasEn) return { en: '', cn: str };

    let firstCn = -1, lastCn = -1;
    let firstEn = -1, lastEn = -1;
    for (let i = 0; i < str.length; i++) {
        if (/[\u4e00-\u9fa5]/.test(str[i])) {
            if (firstCn === -1) firstCn = i;
            lastCn = i;
        }
        if (/[a-zA-Z]/.test(str[i])) {
            if (firstEn === -1) firstEn = i;
            lastEn = i;
        }
    }

    if (lastEn < firstCn) {
        let endEn = lastEn;
        let i = lastEn + 1;
        while (i < str.length && !/[\u4e00-\u9fa5\s]/.test(str[i])) {
            endEn = i;
            i++;
        }
        const en = str.substring(0, endEn + 1).trim();
        const cn = str.substring(endEn + 1).trim();
        return { en, cn };
    }

    if (lastCn < firstEn) {
        let startEn = firstEn;
        let i = firstEn - 1;
        while (i >= 0 && !/[\u4e00-\u9fa5\s]/.test(str[i])) {
            startEn = i;
            i--;
        }
        const cn = str.substring(0, startEn).trim();
        const en = str.substring(startEn).trim();
        return { en, cn };
    }

    let splitIdx = firstCn;
    let i = firstCn - 1;
    while (i >= 0 && /[\d\s%.,\-]/.test(str[i])) {
        i--;
    }
    let j = i;
    while (j >= 0 && /[a-zA-Z]/.test(str[j])) {
        j--;
    }
    if (j < i && i >= 0) {
        splitIdx = i + 1;
    }

    const en = str.substring(0, splitIdx).trim();
    const cn = str.substring(splitIdx).trim();
    return { en, cn };
}

function calcPriceHtml(priceStr) {
    if (!priceStr) return '';
    const match = String(priceStr).match(/[\d.]+/);
    if (!match) return '';
    const x = parseFloat(match[0]);
    if (isNaN(x)) return '';
    const z = Math.ceil(x * 6.5) * 0.5;
    const p1 = z / 6.5 / 0.5; const p2 = z / 6.5 / 0.7; const p3 = z / 6.5 / 0.8; const p4 = z / 6.5 / 0.9;
    return `<div style="margin-top:10px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;">
        <div style="padding:10px;background:rgba(255,59,48,0.1);border-radius:8px;text-align:center;"><div style="font-size:12px;color:var(--text-secondary);">÷0.5</div><div style="font-size:15px;font-weight:600;color:#ff3b30;">$${p1.toFixed(2)}</div></div>
        <div style="padding:10px;background:rgba(255,149,0,0.1);border-radius:8px;text-align:center;"><div style="font-size:12px;color:var(--text-secondary);">÷0.7</div><div style="font-size:15px;font-weight:600;color:#ff9500;">$${p2.toFixed(2)}</div></div>
        <div style="padding:10px;background:rgba(52,199,89,0.1);border-radius:8px;text-align:center;"><div style="font-size:12px;color:var(--text-secondary);">÷0.8</div><div style="font-size:15px;font-weight:600;color:#34c759;">$${p3.toFixed(2)}</div></div>
        <div style="padding:10px;background:rgba(0,113,227,0.1);border-radius:8px;text-align:center;"><div style="font-size:12px;color:var(--text-secondary);">÷0.9</div><div style="font-size:15px;font-weight:600;color:var(--accent);">$${p4.toFixed(2)}</div></div>
    </div>`;
}

function parseSeoTitle(text) {
    if (!text) return { en: '', cn: '' };
    const str = String(text).trim();
    const markers = ['[中文翻译]：', '【中文翻译】：', '[中文翻译]:', '【中文翻译】:'];
    for (const marker of markers) {
        const idx = str.indexOf(marker);
        if (idx !== -1) return { en: str.substring(0, idx).trim(), cn: str.substring(idx + marker.length).trim() };
    }
    const pipeIdx = str.indexOf('||');
    if (pipeIdx !== -1) {
        const left = str.substring(0, pipeIdx).trim();
        const right = str.substring(pipeIdx + 2).trim();
        const leftCn = hasChinese(left);
        const rightCn = hasChinese(right);
        if (!leftCn && rightCn) return { en: left, cn: right };
        if (leftCn && !rightCn) return { en: right, cn: left };
    }
    return splitBilingual(str);
}

function splitMixedText(s) {
    if (!s) return { en: '', cn: '' };
    if (!hasChinese(s)) return { en: s.trim(), cn: '' };
    if (!hasEnglish(s)) return { en: '', cn: s.trim() };

    const chars = [...s];
    let enParts = [];
    let cnParts = [];
    let curEn = [];
    let curCn = [];
    let lastType = null;

    function flush() {
        if (curEn.length) { enParts.push(curEn.join('')); curEn = []; }
        if (curCn.length) { cnParts.push(curCn.join('')); curCn = []; }
    }

    for (const ch of chars) {
        const isCnChar = /[\u4e00-\u9fa5\u3000-\u303f\uff00-\uffef]/.test(ch);
        const isEnChar = /[a-zA-Z]/.test(ch);
        const isPunctSpace = /[\s,.\-;:!?()\[\]{}'"，。、；：！？（）【】《》""'']/.test(ch);

        if (isCnChar) {
            if (lastType === 'en' && curEn.length) { enParts.push(curEn.join('')); curEn = []; }
            curCn.push(ch);
            lastType = 'cn';
        } else if (isEnChar) {
            if (lastType === 'cn' && curCn.length) { cnParts.push(curCn.join('')); curCn = []; }
            curEn.push(ch);
            lastType = 'en';
        } else if (isPunctSpace) {
            if (lastType === 'en') curEn.push(ch);
            else if (lastType === 'cn') curCn.push(ch);
            else enParts.push(ch);
        } else {
            if (lastType === 'en') curEn.push(ch);
            else if (lastType === 'cn') curCn.push(ch);
            else enParts.push(ch);
        }
    }
    flush();

    return {
        en: enParts.join(' ').replace(/\s+/g, ' ').trim(),
        cn: cnParts.join(' ').replace(/\s+/g, ' ').trim()
    };
}

function parseHighlights(text) {
    if (!text) return [];
    const results = [];
    const lines = String(text).split('\n').map(l => l.trim()).filter(l => l);

    const blocks = [];
    let curBlock = null;
    for (const line of lines) {
        const numMatch = line.match(/^(\d+)[.\u3001)\uff09\u2460-\u2473]\s*/);
        if (numMatch) {
            if (curBlock) blocks.push(curBlock);
            curBlock = { num: numMatch[1], lines: [line.substring(numMatch[0].length).trim()] };
        } else {
            if (curBlock) curBlock.lines.push(line);
            else blocks.push({ num: '', lines: [line] });
        }
    }
    if (curBlock) blocks.push(curBlock);

    for (const block of blocks) {
        let label_en = '', desc_en = '', label_cn = '', desc_cn = '';

        for (let raw of block.lines) {
            let s = raw.trim();
            if (!s) continue;
            s = s.replace(/[\*_]{1,3}/g, '').trim();

            let isCnBracketLine = false;
            const obMatch = s.match(/^[\uff08(](.+)[\uff09)]\s*$/);
            const obMatch2 = s.match(/^[\[\uff3b\u3010\u300a](.+)[\]\uff3d\u3011\u300b]\s*$/);
            if (obMatch && hasChinese(obMatch[1])) { s = obMatch[1].trim(); isCnBracketLine = true; }
            else if (obMatch2 && hasChinese(obMatch2[1])) { s = obMatch2[1].trim(); isCnBracketLine = true; }

            const inlineCn = s.match(/[\[\uff3b\u3010\u300a]([\u4e00-\u9fa5\u3001\uff0c\s]+?)[\]\uff3d\u3011\u300b][\uff1a:]\s*(.+?)\s*$/);
            let cnPart = '';
            if (inlineCn && hasChinese(inlineCn[1])) {
                cnPart = inlineCn[1].trim() + '：' + inlineCn[2].trim();
                s = s.substring(0, s.length - inlineCn[0].length).trim();
            }

            const colonIdx = s.search(/[\uff1a:]/);
            let labelPart = '';
            let descPart = '';
            let hasColon = colonIdx !== -1;
            if (hasColon) {
                labelPart = s.substring(0, colonIdx).trim();
                descPart = s.substring(colonIdx + 1).trim();
            } else {
                descPart = s;
            }

            const labelHasCn = hasChinese(labelPart);
            const isCnLine = isCnBracketLine || labelHasCn;

            if (s) {
                if (isCnLine) {
                    if (labelPart && !label_cn) label_cn = labelPart;
                    if (descPart) {
                        if (!desc_cn) desc_cn = descPart;
                        else desc_cn += ' ' + descPart;
                    }
                } else if (hasChinese(s) && hasEnglish(s)) {
                    if (hasColon) {
                        const labelSplit = splitMixedText(labelPart);
                        const descSplit = splitMixedText(descPart);
                        if (labelSplit.en && !label_en) label_en = labelSplit.en;
                        if (labelSplit.cn && !label_cn) label_cn = labelSplit.cn;
                        if (descSplit.en) {
                            if (!desc_en) desc_en = descSplit.en;
                            else desc_en += ' ' + descSplit.en;
                        }
                        if (descSplit.cn) {
                            if (!desc_cn) desc_cn = descSplit.cn;
                            else desc_cn += ' ' + descSplit.cn;
                        }
                    } else {
                        const split = splitMixedText(s);
                        if (split.en) {
                            if (!desc_en) desc_en = split.en;
                            else desc_en += ' ' + split.en;
                        }
                        if (split.cn) {
                            if (!desc_cn) desc_cn = split.cn;
                            else desc_cn += ' ' + split.cn;
                        }
                    }
                } else {
                    if (hasColon) {
                        if (labelPart && !label_en) label_en = labelPart;
                        if (descPart) {
                            if (!desc_en) desc_en = descPart;
                            else desc_en += ' ' + descPart;
                        }
                    } else {
                        if (!desc_en) desc_en = s;
                        else desc_en += ' ' + s;
                    }
                }
            }

            if (cnPart) {
                const cm = cnPart.match(/^(.+?)[\uff1a:]\s*(.+)$/);
                if (cm) {
                    if (!label_cn) label_cn = cm[1].trim();
                    if (!desc_cn) desc_cn = cm[2].trim();
                } else {
                    if (!desc_cn) desc_cn = cnPart;
                }
            }
        }

        results.push({ num: block.num, label_en, desc_en, label_cn, desc_cn, raw: block.lines.join('\n') });
    }

    return results;
}

function parseFaqs(text) {
    if (!text) return [];
    const faqs = [];

    const lines = String(text).split('\n').map(l => l.trim()).filter(l => l);

    function classifyLine(line) {
        if (/^Q[\uff1a:]\s*/i.test(line)) {
            const rest = line.replace(/^Q[\uff1a:]\s*/i, '').trim();
            const aIdx = rest.search(/\s+A[\uff1a:]\s*/i);
            if (aIdx !== -1) {
                return { type: 'Q_EN', value: rest.substring(0, aIdx).trim(),
                    extra: { type: 'A_EN', value: rest.substring(aIdx).replace(/^\s*A[\uff1a:]\s*/i, '').trim() } };
            }
            return { type: 'Q_EN', value: rest };
        }
        if (/^A[\uff1a:]\s*/i.test(line)) {
            return { type: 'A_EN', value: line.replace(/^A[\uff1a:]\s*/i, '').trim() };
        }
        if (/^\u95ee[\uff1a:]\s*/.test(line)) {
            const rest = line.replace(/^\u95ee[\uff1a:]\s*/, '').trim();
            const aIdx = rest.search(/\s*\u7b54[\uff1a:]\s*/);
            if (aIdx !== -1) {
                return { type: 'Q_CN', value: rest.substring(0, aIdx).trim(),
                    extra: { type: 'A_CN', value: rest.substring(aIdx).replace(/^\s*\u7b54[\uff1a:]\s*/, '').trim() } };
            }
            return { type: 'Q_CN', value: rest };
        }
        if (/^\u7b54[\uff1a:]\s*/.test(line)) {
            return { type: 'A_CN', value: line.replace(/^\u7b54[\uff1a:]\s*/, '').trim() };
        }
        return { type: 'CONT', value: line };
    }

    let current = null;
    let lastType = null;

    function flushFaq() {
        if (current && (current.q_en || current.q_cn)) {
            faqs.push({ ...current });
        }
        current = null;
        lastType = null;
    }

    for (let idx = 0; idx < lines.length; idx++) {
        const line = lines[idx];
        let info = classifyLine(line);

        if (info.type === 'Q_EN') {
            if (current && (current.q_en || current.q_cn)) {
                flushFaq();
            }
            current = { q_en: info.value, a_en: '', q_cn: '', a_cn: '' };
            lastType = 'Q_EN';
            if (info.extra && info.extra.type === 'A_EN') {
                current.a_en = info.extra.value;
                lastType = 'A_EN';
            }
        } else if (info.type === 'A_EN') {
            if (!current) current = { q_en: '', a_en: '', q_cn: '', a_cn: '' };
            current.a_en = info.value;
            lastType = 'A_EN';
        } else if (info.type === 'Q_CN') {
            if (!current) current = { q_en: '', a_en: '', q_cn: '', a_cn: '' };
            const cnInlineMatch = info.value.match(/[\[\uff3b\u3010\u300a]\s*[\u95ee][\uff1a:]?\s*(.+?)\s*[\]\uff3d\u3011\u300b][\uff1a:\s]*[\[\uff3b\u3010\u300a]\s*[\u7b54][\uff1a:]?\s*(.+?)\s*[\]\uff3d\u3011\u300b]\s*$/);
            if (cnInlineMatch) {
                current.q_cn = cnInlineMatch[1].trim();
                current.a_cn = cnInlineMatch[2].trim();
            } else {
                current.q_cn = info.value;
            }
            lastType = 'Q_CN';
            if (info.extra && info.extra.type === 'A_CN') {
                current.a_cn = info.extra.value;
                lastType = 'A_CN';
            }
        } else if (info.type === 'A_CN') {
            if (!current) current = { q_en: '', a_en: '', q_cn: '', a_cn: '' };
            current.a_cn = info.value;
            lastType = 'A_CN';
        } else if (info.type === 'CONT' && current && lastType) {
            if (lastType === 'A_EN') {
                current.a_en += ' ' + info.value;
            } else if (lastType === 'A_CN') {
                current.a_cn += ' ' + info.value;
            } else if (lastType === 'Q_EN') {
                current.q_en += ' ' + info.value;
            } else if (lastType === 'Q_CN') {
                current.q_cn += ' ' + info.value;
            }
        }
    }

    flushFaq();

    for (const f of faqs) {
        const cnInlineMatch = f.a_en.match(/[\[\uff3b\u3010\u300a]\s*[\u95ee][\uff1a:]?\s*(.+?)\s*[\]\uff3d\u3011\u300b][\uff1a:\s]*[\[\uff3b\u3010\u300a]\s*[\u7b54][\uff1a:]?\s*(.+?)\s*[\]\uff3d\u3011\u300b]\s*$/);
        if (cnInlineMatch && !f.q_cn && !f.a_cn) {
            f.q_cn = cnInlineMatch[1].trim();
            f.a_cn = cnInlineMatch[2].trim();
            f.a_en = f.a_en.substring(0, f.a_en.length - cnInlineMatch[0].length).trim();
        }
    }

    return faqs;
}

let uploadPollTimer = null;
checkExtension();
loadFromLocalStorage();
loadSkippedItems();
function startUploadPolling() {
    if (uploadPollTimer) clearInterval(uploadPollTimer);
    if (!products.length) return;
    uploadPollTimer = setInterval(() => {
        if (!chrome?.runtime || products.length === 0) {
            clearInterval(uploadPollTimer);
            uploadPollTimer = null;
            return;
        }
        try {
            const queriedFile = currentFileKey();
            refreshPublishState();
            chrome.runtime.sendMessage(EXTENSION_ID, { action: 'getUploadedRows', fileKey: queriedFile }, (response) => {
                if (queriedFile !== currentFileKey()) return;
                if (!chrome.runtime.lastError && response?.rows) {
                    if (response.fileKey !== undefined && response.fileKey !== queriedFile) return;
                    uploadedRows = response.rows;
                    legacyRows = response.legacy || {};
                    const productCards = document.getElementById('productCards');
                    if (productCards) {
                        productCards.querySelectorAll('.product-card').forEach(card => {
                            const idx = parseInt(card.dataset.idx);
                            const product = products[idx];
                            if (product && response.rows[product.row]) {
                                let badge = card.querySelector('.uploaded-badge');
                                if (!badge) {
                                    badge = document.createElement('span');
                                    const tags = card.querySelector('.product-tags');
                                    if (tags) tags.appendChild(badge);
                                }
                                badge.className = 'uploaded-badge';
                                badge.textContent = '已保存';
                                badge.style.opacity = '';
                                badge.removeAttribute('title');
                            }
                        });
                    }
                    updateBatchBar();
                }
            });
        } catch (e) {}
    }, 3000);
}

// Keyboard shortcut for modal
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeImageModal(); });

function navigateTab(direction) {
    const tabOrder = ['basic', 'highlights', 'faq', 'audit'];
    const currentIdx = tabOrder.indexOf(currentActiveTab);
    if (currentIdx === -1) return;
    let newIdx;
    if (direction === 'left') {
        newIdx = currentIdx > 0 ? currentIdx - 1 : 0;
    } else {
        newIdx = currentIdx < tabOrder.length - 1 ? currentIdx + 1 : tabOrder.length - 1;
    }
    if (newIdx === currentIdx) return;
    const newTab = tabOrder[newIdx];
    const tabEl = document.querySelector(`.tab[data-tab="${newTab}"]`);
    if (tabEl) tabEl.click();
}

// 键盘选择产品：W/↑ 上移，S/↓ 下移；A/← 左移Tab，D/→ 右移Tab
document.addEventListener('keydown', (e) => {
    if (e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey || e.target?.closest('input,textarea,select,[contenteditable="true"],[contenteditable=""]')) return;
    if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') {
        e.preventDefault();
        navigateProduct('up');
    } else if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') {
        e.preventDefault();
        navigateProduct('down');
    } else if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') {
        e.preventDefault();
        navigateTab('left');
    } else if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') {
        e.preventDefault();
        navigateTab('right');
    }
});

// FPS 监测器
(function() {
    const fpsEl = document.createElement('div');
    fpsEl.className = 'fps-monitor';
    fpsEl.textContent = 'FPS: --';
    fpsEl.title = '点击切换显示/隐藏详细信息';
    document.body.appendChild(fpsEl);

    let frameCount = 0;
    let lastTime = performance.now();
    let fps = 0;
    let minFps = 60;
    let showDetail = false;

    function update() {
        frameCount++;
        const now = performance.now();
        const elapsed = now - lastTime;

        if (elapsed >= 500) {
            fps = Math.round((frameCount * 1000) / elapsed);
            if (fps < minFps) minFps = fps;
            
            fpsEl.classList.remove('low', 'critical');
            if (fps < 30) {
                fpsEl.classList.add('critical');
            } else if (fps < 50) {
                fpsEl.classList.add('low');
            }

            if (showDetail) {
                fpsEl.textContent = `FPS: ${fps} (min: ${minFps})`;
            } else {
                fpsEl.textContent = `${fps} FPS`;
            }

            frameCount = 0;
            lastTime = now;
        }

        requestAnimationFrame(update);
    }

    fpsEl.addEventListener('click', () => {
        showDetail = !showDetail;
        if (showDetail) {
            minFps = 60;
        }
    });

    requestAnimationFrame(update);
})();
