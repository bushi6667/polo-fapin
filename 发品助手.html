<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta name="polo-build" content="2026-10-30T23:03:47+08:00">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#30263f">
<title>Polo产品发品助手</title>
<style>
:root {
    --bg-primary: #0a0a1a;
    --bg-card: rgba(255, 255, 255, 0.06);
    --bg-card-solid: rgba(255, 255, 255, 0.1);
    --bg-card-hover: rgba(255, 255, 255, 0.12);
    --text-primary: rgba(255, 255, 255, 0.95);
    --text-secondary: rgba(255, 255, 255, 0.7);
    --text-tertiary: rgba(255, 255, 255, 0.5);
    --accent: #4d96ff;
    --accent-hover: #6ba8ff;
    --accent-light: rgba(77, 150, 255, 0.2);
    --border: rgba(255, 255, 255, 0.12);
    --border-light: rgba(255, 255, 255, 0.06);
    --border-inner: rgba(255, 255, 255, 0.18);
    --glass-blur: 60px;
    --glass-saturate: 220%;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.08), 0 2px 8px rgba(0,0,0,0.06);
    --shadow-md: 0 4px 24px rgba(0,0,0,0.12), 0 1px 4px rgba(0,0,0,0.08);
    --shadow-lg: 0 24px 80px rgba(0,0,0,0.2), 0 8px 24px rgba(0,0,0,0.12);
    --shadow-inner: inset 0 0.5px 0 rgba(255, 255, 255, 0.2), inset 0 -0.5px 0 rgba(0, 0, 0, 0.08);
    --radius-sm: 12px;
    --radius-md: 18px;
    --radius-lg: 22px;
    --radius-xl: 28px;
    --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    --transition-slow: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    --transition-spring: 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    --transition-spring-soft: 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    --transition-ease-out: 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    --transition-ease-in-out: 0.4s cubic-bezier(0.65, 0, 0.35, 1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    background: #0a0a1a;
    position: relative;
    scroll-behavior: smooth;
}

body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: #0a0a1a;
    pointer-events: none;
    z-index: 0;
}

/* 水波纹动态背景层 */
body::after {
    content: '';
    position: fixed;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background:
        radial-gradient(ellipse 70% 50% at 25% 35%, rgba(120, 119, 198, 0.55) 0%, transparent 55%),
        radial-gradient(ellipse 55% 70% at 75% 25%, rgba(255, 119, 198, 0.45) 0%, transparent 55%),
        radial-gradient(ellipse 60% 60% at 50% 75%, rgba(119, 198, 255, 0.4) 0%, transparent 55%),
        radial-gradient(ellipse 45% 50% at 35% 65%, rgba(198, 119, 255, 0.35) 0%, transparent 55%),
        radial-gradient(ellipse 50% 45% at 65% 55%, rgba(255, 198, 119, 0.3) 0%, transparent 55%);
    filter: blur(80px);
    animation: waterRipple 25s ease-in-out infinite;
    pointer-events: none;
    z-index: 0;
    transform-origin: center center;
    opacity: 0.9;
}

@keyframes waterRipple {
    0% {
        transform: translate(0, 0) scale(1) rotate(0deg);
        opacity: 0.85;
    }
    25% {
        transform: translate(-4%, 3%) scale(1.15) rotate(3deg);
        opacity: 0.65;
    }
    50% {
        transform: translate(3%, -4%) scale(0.9) rotate(-2deg);
        opacity: 1;
    }
    75% {
        transform: translate(-3%, -3%) scale(1.1) rotate(2deg);
        opacity: 0.75;
    }
    100% {
        transform: translate(0, 0) scale(1) rotate(0deg);
        opacity: 0.85;
    }
}

.container {
    position: relative;
    z-index: 1;
    width: 60%;
    min-width: 900px;
    max-width: 1600px;
    height: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    padding: 16px 0;
    gap: 16px;
    opacity: 0;
    transform: translateY(20px);
    animation: pageIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
}

@keyframes pageIn {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Page Header (竖排左上角，独立于container) */
.page-header {
    position: fixed;
    top: 24px;
    left: 20px;
    z-index: 10;
    display: flex;
    flex-direction: row;
    align-items: flex-start;
    gap: 8px;
    opacity: 0;
    transform: translateY(-10px);
    animation: fadeDownIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.25s forwards;
}
@keyframes fadeDownIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
}
.page-header h1 {
    font-size: 22px;
    font-weight: 600;
    color: #fff;
    text-shadow: 0 2px 12px rgba(0,0,0,0.15);
    margin: 0;
    writing-mode: vertical-rl;
    text-orientation: upright;
    letter-spacing: 4px;
}
.page-header .sub-title {
    font-size: 12px;
    color: rgba(255, 255, 255, 0.65);
    font-weight: 400;
    margin: 0;
    writing-mode: vertical-rl;
    text-orientation: upright;
    letter-spacing: 1px;
    margin-top: 4px;
}

/* Main Content */
.main-content {
    display: grid;
    grid-template-columns: 360px 1fr;
    gap: 16px;
    flex: 1;
    min-height: 0;
    overflow: hidden;
}

/* Left Panel */
.left-panel {
    display: flex;
    flex-direction: column;
    gap: 12px;
    flex: 1;
    min-height: 0;
    opacity: 0;
    transform: translateX(-20px);
    animation: slideLeftIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;
}

@keyframes slideLeftIn {
    from {
        opacity: 0;
        transform: translateX(-20px);
    }
    to {
        opacity: 1;
        transform: translateX(0);
    }
}

/* Detail Panel 入场动画 */
.detail-panel {
    opacity: 0;
    transform: translateX(20px);
    animation: slideRightIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.55s forwards;
}

@keyframes slideRightIn {
    from {
        opacity: 0;
        transform: translateX(20px);
    }
    to {
        opacity: 1;
        transform: translateX(0);
    }
}

/* Card Base */
.card {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
    -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: var(--radius-lg);
    box-shadow: 
        var(--shadow-lg),
        var(--shadow-inner);
    color: #fff;
    position: relative;
    overflow: hidden;
}

.card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 1px;
    background: linear-gradient(90deg, 
        transparent 0%, 
        rgba(255, 255, 255, 0.15) 20%, 
        rgba(255, 255, 255, 0.25) 50%, 
        rgba(255, 255, 255, 0.15) 80%, 
        transparent 100%);
    pointer-events: none;
    z-index: 1;
}

.card h2, .card h3, .card h4 {
    color: rgba(255, 255, 255, 0.95);
}

.card p, .card span, .card div {
    color: rgba(255, 255, 255, 0.85);
}

/* Upload Section */
.upload-section {
    flex-shrink: 0;
    padding: 20px;
}
.upload-section h2 {
    font-size: 13px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.7);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 16px;
}

.upload-area {
    border: 1.5px dashed rgba(255, 255, 255, 0.2);
    border-radius: var(--radius-md);
    padding: 20px 16px;
    text-align: center;
    cursor: pointer;
    transition: background-color var(--transition-fast), border-color var(--transition-fast), color var(--transition-fast), box-shadow var(--transition-fast), transform var(--transition);
    background: rgba(255, 255, 255, 0.03);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    position: relative;
    overflow: hidden;
}
.upload-area::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, transparent 50%, rgba(255,255,255,0.02) 100%);
    pointer-events: none;
}
.upload-area:hover {
    border-color: rgba(255, 255, 255, 0.5);
    background: rgba(255, 255, 255, 0.08);
    transform: translateY(-1px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.12);
}
.upload-area.dragover {
    border-color: rgba(255, 255, 255, 0.7);
    background: rgba(255, 255, 255, 0.12);
    transform: scale(1.02);
    box-shadow: 0 12px 40px rgba(0,0,0,0.15);
}
.upload-icon {
    font-size: 30px;
    margin-bottom: 8px;
    opacity: 0.8;
}
.upload-text {
    color: #fff;
    font-size: 15px;
    font-weight: 500;
    margin-bottom: 6px;
}
.upload-hint {
    color: rgba(255, 255, 255, 0.6);
    font-size: 13px;
}
#excelInput { display: none; }

/* Stats */
.stats {
    display: flex;
    gap: 10px;
    margin-top: 16px;
}
.stat-item {
    flex: 1;
    background: rgba(255, 255, 255, 0.06);
    border-radius: var(--radius-sm);
    padding: 14px 12px;
    text-align: center;
    transition: 
        transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
        background 0.3s cubic-bezier(0.4, 0, 0.2, 1),
        box-shadow 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    border: 1px solid rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    box-shadow: inset 0 0.5px 0 rgba(255,255,255,0.12);
    position: relative;
    overflow: hidden;
}
.stat-item::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 1px;
    background: linear-gradient(90deg, 
        transparent 0%, 
        rgba(255, 255, 255, 0.1) 50%, 
        transparent 100%);
    pointer-events: none;
}
.stat-item:hover {
    background: rgba(255, 255, 255, 0.1);
    transform: translateY(-3px) scale(1.02);
    box-shadow: 
        0 8px 24px rgba(0,0,0,0.15),
        inset 0 0.5px 0 rgba(255,255,255,0.15);
}
.stat-num {
    font-size: 26px;
    font-weight: 600;
    color: #fff;
    line-height: 1;
}
.stat-label {
    font-size: 11px;
    color: rgba(255, 255, 255, 0.7);
    margin-top: 6px;
    font-weight: 500;
}

/* Product List */
.product-list {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    padding: 16px;
    overflow: hidden;
}
.product-list h2 {
    font-size: 13px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.7);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 12px;
    flex-shrink: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.product-count {
    font-size: 12px;
    color: rgba(255, 255, 255, 0.6);
    font-weight: 500;
    text-transform: none;
    letter-spacing: 0;
}

.product-cards {
    display: flex;
    flex-direction: column;
    gap: 10px;
    overflow-y: auto;
    flex: 1;
    min-height: 0;
    padding-right: 4px;
}
.product-cards::-webkit-scrollbar { width: 6px; }
.product-cards::-webkit-scrollbar-track { background: transparent; }
.product-cards::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
.product-cards::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.35); }

/* Product Card */
.product-card {
    border-radius: 16px;
    padding: 14px;
    cursor: pointer;
    transition: background-color var(--transition-fast), border-color var(--transition-fast), color var(--transition-fast), box-shadow var(--transition-fast), transform var(--transition);
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.15);
    display: flex;
    gap: 14px;
    align-items: center;
    position: relative;
}
.product-card:hover {
    background: rgba(255, 255, 255, 0.18);
    border-color: rgba(255, 255, 255, 0.25);
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(0,0,0,0.1);
}
.product-card.active {
    background: rgba(255, 255, 255, 0.25);
    border-color: rgba(255, 255, 255, 0.5);
    box-shadow: 0 0 0 3px rgba(255,255,255,0.1), 0 8px 24px rgba(0,0,0,0.15);
}

/* 产品卡片错落入场动画 */
.product-card.card-enter {
    opacity: 0;
    transform: translateX(-12px);
    animation: cardSlideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes cardSlideIn {
    from {
        opacity: 0;
        transform: translateX(-12px);
    }
    to {
        opacity: 1;
        transform: translateX(0);
    }
}

.uploaded-badge {
    display: inline-block;
    font-size: 11px;
    padding: 5px 12px;
    background: linear-gradient(
        135deg,
        rgba(52, 199, 89, 0.9) 0%,
        rgba(48, 209, 88, 0.9) 100%
    );
    color: white;
    font-weight: 500;
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.3);
    box-shadow: 0 1px 4px rgba(52, 199, 89, 0.3);
    letter-spacing: 0.3px;
}

.color-generated-badge {
    /* 文字垂直居中：inline-block 靠默认行高会偏下，改成 flex 居中并压掉行高 */
    display: inline-flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    height: 18px;
    font-size: 10px;
    padding: 0 7px;
    vertical-align: middle;
    background: linear-gradient(
        135deg,
        rgba(102, 126, 234, 0.9) 0%,
        rgba(118, 75, 162, 0.9) 100%
    );
    color: white;
    font-weight: 500;
    border-radius: 20px;
    box-shadow: 0 1px 4px rgba(102, 126, 234, 0.3);
}

.suite-generated-badge {
    /* 与「颜色图」角标同款同高，配色区分（青绿），文字垂直居中 */
    display: inline-flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    height: 18px;
    font-size: 10px;
    padding: 0 7px;
    vertical-align: middle;
    background: linear-gradient(135deg, rgba(19, 194, 194, 0.9) 0%, rgba(0, 150, 136, 0.9) 100%);
    color: white;
    font-weight: 500;
    border-radius: 20px;
    box-shadow: 0 1px 4px rgba(19, 194, 194, 0.3);
}

.batch-checkbox {
    position: absolute;
    top: 10px;
    left: 10px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.4);
    background: rgba(0,0,0,0.3);
    cursor: pointer;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background-color var(--transition-fast), border-color var(--transition-fast), color var(--transition-fast), box-shadow var(--transition-fast), transform 0.2s;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
}
.batch-checkbox:hover {
    border-color: var(--accent);
    transform: scale(1.1);
}
.batch-checkbox.checked {
    background: var(--accent);
    border-color: var(--accent);
}
.batch-checkbox.checked::after {
    content: '✓';
    color: white;
    font-size: 11px;
    font-weight: 700;
    line-height: 1;
}

.batch-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    /* 控件多、面板窄时换行，而不是把文字压成竖排 */
    flex-wrap: wrap;
    gap: 6px 10px;
    padding: 8px 12px;
    margin-bottom: 10px;
    background: rgba(77, 150, 255, 0.1);
    border: 1px solid rgba(77, 150, 255, 0.2);
    border-radius: 12px;
    font-size: 12px;
    color: rgba(255,255,255,0.9);
}
.batch-bar-left {
    display: flex;
    align-items: center;
    flex-wrap: wrap;          /* 同上：宁换行不压字 */
    gap: 6px 8px;
    flex: 1 1 auto;
    min-width: 0;
}
/* 工具条里所有文字都不许折行（否则窄面板会出现竖排的「全 选」「跳 过 已 保 存」） */
.batch-bar .batch-select-all span,
.batch-bar .batch-skip-uploaded span,
.batch-bar .batch-count,
.batch-bar .batch-size-field,
.batch-bar .batch-size-field span {
    white-space: nowrap;
}
.batch-select-all {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    user-select: none;
    padding: 4px 8px;
    border-radius: 8px;
    transition: background 0.2s;
}
.batch-select-all:hover {
    background: rgba(255,255,255,0.08);
}
.batch-select-all .mini-check {
    width: 14px;
    height: 14px;
    border-radius: 4px;
    border: 1.5px solid rgba(255,255,255,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background-color var(--transition-fast), border-color var(--transition-fast), color var(--transition-fast), box-shadow var(--transition-fast), transform 0.2s;
}
.batch-select-all .mini-check.checked {
    background: var(--accent);
    border-color: var(--accent);
}
.batch-select-all .mini-check.checked::after {
    content: '✓';
    color: white;
    font-size: 9px;
    font-weight: 700;
    line-height: 1;
}
.batch-count {
    color: rgba(255,255,255,0.6);
}
.batch-count strong {
    color: var(--accent);
    font-weight: 600;
}
/* 每批款数：用户自己填，1-500 */
.batch-size-field {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    color: rgba(255,255,255,0.6);
}
.batch-size-field input {
    width: 48px;
    padding: 3px 4px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.18);
    background: rgba(0,0,0,0.25);
    color: inherit;
    font-size: 12px;
    text-align: center;
}
.batch-size-field input:disabled { opacity: 0.45; cursor: not-allowed; }
.batch-size-field input:focus { outline: none; border-color: var(--accent); }
.batch-publish-btn {
    padding: 6px 14px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #4d96ff 0%, #6b7bff 100%);
    color: white;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    flex: 0 0 auto;           /* 按钮不许被挤窄 */
    white-space: nowrap;      /* 「批量发品」不折成两行 */
    margin-left: auto;        /* 换行后仍靠右，不像个孤零零的块 */
    min-width: 96px;
    transition: background-color var(--transition-fast), border-color var(--transition-fast), color var(--transition-fast), box-shadow var(--transition-fast), transform 0.2s;
    box-shadow: 0 2px 8px rgba(77, 150, 255, 0.3);
}
.batch-publish-btn:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(77, 150, 255, 0.4);
}
.batch-publish-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}
.batch-skip-uploaded {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    user-select: none;
    padding: 4px 8px;
    border-radius: 8px;
    transition: background 0.2s;
}
.batch-skip-uploaded:hover {
    background: rgba(255,255,255,0.08);
}

.card-thumb {
    width: 56px;
    height: 56px;
    border-radius: var(--radius-sm);
    background: linear-gradient(145deg, #f0f0f0, #e8e8e8);
    flex-shrink: 0;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
}
.card-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.card-info { flex: 1; min-width: 0; }
.product-row {
    font-size: 11px;
    color: var(--text-secondary);
    margin-bottom: 5px;
    font-weight: 500;
}
.product-name {
    font-weight: 600;
    color: var(--text-primary);
    font-size: 14px;
    line-height: 1.4;
    margin-bottom: 6px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}
.product-material {
    font-size: 12px;
    color: rgba(255, 255, 255, 0.9);
    font-weight: 500;
}
/* 类目单独一行 */
.product-cat { margin-top: 8px; }
/* 底部：左素材角标（套图/颜色图），右保存状态 */
.product-footer {
    display: flex;
    flex-direction: column;   /* 上下排：角标一行、保存状态一行，避免挤在一行把文字压成竖排 */
    align-items: stretch;
    gap: 6px;
    margin-top: 10px;
}
.tags-row-media { display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; }
/* 已保存单独一行，与角标行之间一条分隔线（1 / ——— / 2） */
.footer-status {
    width: 100%;
    margin-top: 2px;
    padding-top: 6px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    text-align: right;
    font-size: 12px;
    color: #52c41a;
    white-space: nowrap;
}
.footer-status.is-legacy { color: rgba(255,255,255,.45); }
/* 类目胶囊 */
.product-cat .tag {
    display: inline-flex; align-items: center; justify-content: center;
    height: 20px; padding: 0 9px; font-size: 11px; line-height: 1;
    border-radius: 20px; box-sizing: border-box;
}
/* 素材角标：带图标，尺寸一致 */
.tags-row-media .color-generated-badge,
.tags-row-media .suite-generated-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;   /* "套图" 不许被挤成两行 */
    height: 24px;
    padding: 0 10px;
    font-size: 11px;
    font-weight: 500;
    line-height: 1;
    border-radius: 14px;
    box-sizing: border-box;
    border: 1px solid rgba(255, 255, 255, 0.16);
}
.tags-row-media svg { width: 12px; height: 12px; flex: none; }
.tag {
    /* 和「颜色图」角标同高同基线，避免一排标签高低不齐 */
    display: inline-flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    height: 18px;
    vertical-align: middle;
    font-size: 10px;
    padding: 0 7px;
    background: rgba(255, 255, 255, 0.12);
    color: rgba(255, 255, 255, 0.9);
    border-radius: 20px;
    font-weight: 500;
    backdrop-filter: blur(10px) saturate(180%);
    -webkit-backdrop-filter: blur(10px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.12);
}

/* Detail Panel */
.detail-panel {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
    -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: var(--radius-xl);
    box-shadow: 
        var(--shadow-lg),
        var(--shadow-inner);
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
    color: #fff;
    position: relative;
}
.detail-panel::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 1px;
    background: linear-gradient(90deg, 
        transparent 0%, 
        rgba(255, 255, 255, 0.15) 15%, 
        rgba(255, 255, 255, 0.25) 50%, 
        rgba(255, 255, 255, 0.15) 85%, 
        transparent 100%);
    pointer-events: none;
    z-index: 2;
}
.detail-panel.empty {
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255, 255, 255, 0.6);
}
.detail-panel.empty::before {
    content: '';
    width: 80px;
    height: 80px;
    background: linear-gradient(135deg, rgba(255,255,255,0.2), rgba(255,255,255,0.1));
    border-radius: 50%;
    margin-bottom: 20px;
    opacity: 0.5;
}

.detail-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 24px 28px 20px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.15);
    flex-shrink: 0;
    gap: 20px;
    border-radius: var(--radius-xl) var(--radius-xl) 0 0;
}
.detail-title {
    flex: 1;
    min-width: 0;
    overflow: hidden;
}
.detail-title h2 {
    font-size: 22px;
    font-weight: 600;
    color: #fff;
    margin-bottom: 6px;
    letter-spacing: -0.3px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.detail-subtitle {
    color: rgba(255, 255, 255, 0.7);
    font-size: 13px;
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

/* 液态玻璃按钮 */
.publish-btn, .color-change-btn, .copy-all-btn {
    position: relative;
    color: white;
    font-weight: 600;
    cursor: pointer;
    overflow: hidden;
    transition: 
        transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
        box-shadow 0.4s cubic-bezier(0.16, 1, 0.3, 1),
        background 0.3s cubic-bezier(0.4, 0, 0.2, 1),
        border-color 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    border: 1px solid rgba(255, 255, 255, 0.45);
    border-top-color: rgba(255, 255, 255, 0.6);
    border-bottom-color: rgba(255, 255, 255, 0.25);
    backdrop-filter: blur(20px) saturate(200%);
    -webkit-backdrop-filter: blur(20px) saturate(200%);
    box-shadow:
        inset 0 1px 1px rgba(255, 255, 255, 0.4),
        0 8px 32px rgba(0, 0, 0, 0.2),
        0 2px 8px rgba(0, 0, 0, 0.1);
}

.publish-btn::before, .color-change-btn::before, .copy-all-btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(255, 255, 255, 0.1) 50%,
        transparent 100%
    );
    transition: left 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    pointer-events: none;
}

.publish-btn:hover::before, .color-change-btn:hover::before, .copy-all-btn:hover::before {
    left: 100%;
}

.publish-btn:hover, .color-change-btn:hover, .copy-all-btn:hover {
    transform: translateY(-3px) scale(1.02);
    box-shadow:
        inset 0 1px 1px rgba(255, 255, 255, 0.5),
        0 0 30px rgba(255, 255, 255, 0.15),
        0 16px 48px rgba(0, 0, 0, 0.25);
}

.publish-btn:active, .color-change-btn:active, .copy-all-btn:active {
    transform: translateY(0) scale(0.97);
    transition: transform 0.15s cubic-bezier(0.4, 0, 1, 1);
    box-shadow:
        inset 0 1px 1px rgba(255, 255, 255, 0.35),
        0 4px 16px rgba(0, 0, 0, 0.2);
}

/* 发布按钮 - 微红色调 */
.publish-btn {
    padding: 12px 24px;
    border-radius: 30px;
    font-size: 14px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
    background: linear-gradient(

}
.publish-btn:hover {

/* 换色按钮 - 微橙色调 */

/* 一键换色按钮 - 紫粉渐变 */
.batch-color-btn {
    padding: 8px 16px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);

    color: #fff;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(245, 87, 108, 0.3);
    transition: background-color var(--transition-fast), border-color var(--transition-fast), color var(--transition-fast), box-shadow var(--transition-fast), transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    overflow: hidden;
}
.batch-color-btn::before {
    content: '';

    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    transition: left 0.5s;
}
.batch-color-btn:hover::before {

}
.batch-color-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(245, 87, 108, 0.4);
}
.batch-color-btn:active {

}
.batch-color-btn:disabled {
    background: rgba(255, 255, 255, 0.15);
    box-shadow: none;
    cursor: not-allowed;
    color: rgba(255, 255, 255, 0.5);

/* 一键换色进度条 */
.detail-column { display: flex; flex-direction: column; gap: 12px; min-width: 0; min-height: 0; overflow: hidden; }
.detail-column > .detail-panel { flex: 1; }
.task-progress {
    margin: 0;
    padding: 14px 16px;
    flex-shrink: 0;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    animation: slideDown 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}
.task-progress .progress-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.85);
    gap: 12px;
}
.task-progress { position: relative; box-sizing: border-box; align-self: stretch; width: 100%; max-width: 100%; min-width: 0; overflow: hidden; }
 .progress-recycle-controls { position: absolute; right: 5px; top: 12px; bottom: 12px; width: 12px; transition: width .22s ease; }
.progress-recycle-controls.is-open { width: 52px; }
.progress-recycle-bar { position: absolute; left: 0; top: 22%; bottom: 22%; width: 12px; padding: 0; border: 0; background: transparent; cursor: pointer; }
.progress-recycle-bar::after { content: ''; display: block; width: 3px; height: 100%; margin: auto; border-radius: 3px; background: rgba(255,255,255,.8); transition: background .2s ease; }
.progress-recycle-bar:hover::after { background: white; }
.progress-recycle-arrow { position: absolute; right: 0; top: 0; bottom: 0; width: 35px; padding: 0; border: 0; background: transparent; color: white; font-size: 32px; line-height: 1; cursor: pointer; opacity: 0; visibility: hidden; transform: translateX(-12px) scale(.7); transition: opacity .22s ease, transform .22s ease; }
.progress-recycle-controls.is-open .progress-recycle-arrow { opacity: 1; visibility: visible; transform: translateX(0) scale(1); }
.progress-recycle-open { padding-right: 62px; transition: padding-right .22s ease; }
.progress-recycling { pointer-events: none; overflow: hidden; transform-origin: left center; }
.progress-recycle-bar:focus-visible, .progress-recycle-arrow:focus-visible { outline: 2px solid #c4a6ff; border-radius: 4px; }
@media (prefers-reduced-motion: reduce) { .progress-recycle-controls, .progress-recycle-arrow, .progress-recycle-open { transition: none; } }

.task-progress .progress-header > span { min-width: 0; overflow-wrap: anywhere; line-height: 1.5; }
.task-progress .progress-header > button { flex-shrink: 0; }
.task-progress .stop-btn:disabled { opacity: 0.5; cursor: default; }
.task-progress .progress-bar {
    width: 100%;
    height: 8px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 3px;
    overflow: hidden;
}
.task-progress .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #f093fb 0%, #f5576c 100%);
    border-radius: 3px;
    transition: width 0.3s ease;
}

/* 进度条全局样式：换色、发品、套图共用（此前只定义在 .task-progress 下，导致条高为 0 看不见） */
.progress-bar { width: 100%; height: 10px; background: rgba(255,255,255,0.14); border-radius: 5px; overflow: hidden;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08); }
.progress-fill { height: 100%; width: 0%; min-width: 0; border-radius: 5px;
  background: linear-gradient(90deg,#a58ade,#c5a8eb); box-shadow: 0 0 6px rgba(165,138,222,.45); transition: width .25s ease; }
.task-progress .progress-text {
    font-size: 11px;
    color: rgba(255, 255, 255, 0.55);
    margin-top: 6px;
    display: flex;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
}
.task-progress .stop-btn {
    padding: 4px 10px;
    border-radius: 6px;
    background: rgba(245, 87, 108, 0.2);
    border: 1px solid rgba(245, 87, 108, 0.4);
    color: #fff;
    font-size: 11px;
    cursor: pointer;
    transition: background-color var(--transition-fast), border-color var(--transition-fast), color var(--transition-fast), box-shadow var(--transition-fast), transform 0.2s;
}
.task-progress .stop-btn:hover {
    background: rgba(245, 87, 108, 0.35);
}
@keyframes slideDown {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
}

/* Tabs */
.tabs {
    position: relative;
    display: flex;
    gap: 4px;
    padding: 4px 28px;
    margin-top: 20px;
    flex-shrink: 0;
}
.tabs .glider {
    position: absolute;
    top: 4px;
    left: 0;
    height: 40px;
    border-radius: 12px;
    background: linear-gradient(
        135deg,
        rgba(255,255,255,0.18) 0%,
        rgba(255,255,255,0.1) 100%
    );
    border: 1px solid rgba(255,255,255,0.2);
    box-shadow:
        inset 0 1px 2px rgba(255,255,255,0.2),
        0 2px 12px rgba(0,0,0,0.15),
        0 0 0 1px rgba(255,255,255,0.05);
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), width 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 1;
    pointer-events: none;
}
.tab {
    position: relative;
    z-index: 2;
    min-width: 100px;
    padding: 0 20px;
    height: 40px;
    line-height: 1;
    border: none;
    background: transparent;
    color: rgba(255, 255, 255, 0.55);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    border-radius: 12px;
    transition: color 0.35s ease, text-shadow 0.35s ease;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    white-space: nowrap;
}
.tab:hover {
    color: rgba(255, 255, 255, 0.85);
}
.tab.active {
    color: #fff;
    text-shadow: 0 0 12px rgba(255,255,255,0.3);
}
.tab.active .tab-text {
    display: inline-block;
    transform: scale(1.12);
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.tab .tab-text {
    display: inline-block;
    transition: transform 0.3s ease;
}

.tab-content { 
    display: none;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
}
.tab-content.active { 
    display: block;
    animation: tabContentIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes tabContentIn {
    from {
        opacity: 0;
        transform: translateY(8px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.tab-body {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    min-height: 0;
    padding: 20px 28px 28px;
    border-radius: 0 0 var(--radius-xl) var(--radius-xl);
}

<script>

// 通过扩展“打开发品助手”传入连接ID；旧的本地绑定继续有效。
// 先移除启动参数，避免它进入后续外部消息的file URL来源校验。
try {
    const launch = new URL(location.href);
    const id = launch.searchParams.get('poloExtension');
    if (id && /^[a-p]{32}$/.test(id)) {
        launch.searchParams.delete('poloExtension');
        history.replaceState(null, '', launch.href);
        localStorage.setItem('polo_extension_id', id);
    }
} catch (error) { console.warn('读取扩展连接参数失败', error); }
let EXTENSION_ID = localStorage.getItem('polo_extension_id') || '';
let colorImgBaseDir = '';
let extensionConfig = {};
let configSyncInterval = null;

try {
    const savedDir = localStorage.getItem('polo_color_img_dir');
    if (savedDir) colorImgBaseDir = savedDir;
} catch (e) {}

function syncConfigFromExtension() {
    if (!chrome || !chrome.runtime) return;
    try {
        chrome.runtime.sendMessage(EXTENSION_ID, { action: 'getConfig' }, (response) => {
            if (response && response.ok && response.config) {
                extensionConfig = response.config;
                if (typeof response.config.colorImgDir === 'string') {

function psDirectoryMessage(message) {
    return new Promise((resolve,reject)=>{
        try {chrome.runtime.sendMessage(EXTENSION_ID,message,r=>{
            const error=chrome.runtime.lastError;
            if(error)reject(new Error(error.message));else if(!r)reject(new Error('扩展没有响应'));else resolve(r);

let psEditDirHandle = null;
const PS_DIR_IDB_KEY = 'ps_edit_dir_handle';

async function initPsDirHandle() {
    try {
        if (!('indexedDB' in window)) return;
        const db = await openIDB();
        try { psEditDirHandle = await getIDBValue(db, PS_DIR_IDB_KEY) || null; }
        finally { db.close(); }
        // prompt句柄也要保留；点击PS编辑时才能恢复授权，初始化不弹权限框。
    } catch (error) { console.warn('读取助手原图目录失败',error); }

const psPageSaveRows = new Set();

function openIDB() {
    return new Promise((resolve, reject) => {
        const req = indexedDB.open('PoloPsEditDB', 1);
        req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains('settings')) {
                db.createObjectStore('settings');
            }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
    });
}

function getIDBValue(db, key) {
    return new Promise((resolve, reject) => {
        const tx = db.transaction('settings', 'readonly');
        const req = tx.objectStore('settings').get(key);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
    });
}

function setIDBValue(db, key, value) {
    return new Promise((resolve, reject) => {
        const tx = db.transaction('settings', 'readwrite');
        tx.objectStore('settings').put(value, key);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
    });
}

async function savePsEditedImage(fileName, imgDataArray, format) {
    try {
        const status = await psDirectoryMessage({action:'psDirectoryStatus'});
        const row = Number((/^row(\d+)_main\./.exec(fileName) || [])[1]);
        if (status.configured && status.permission === 'granted' && !psPageSaveRows.has(row)) {
            const result = await psDirectoryMessage({action:'writePsImage',fileName,data:imgDataArray,format});
            if (!result.ok) throw new Error(result.error);
            return true;
        }
    } catch(e) {showToast('❌ PS保存失败: '+e.message);return false;}

    if (!psEditDirHandle || await psEditDirHandle.queryPermission({mode:'readwrite'}) !== 'granted') {
        showToast('⚠️ 助手原图目录需要确认权限，请重新点击PS编辑');
        return false;
    }
    try {
        const fileHandle = await psEditDirHandle.getFileHandle(fileName, { create: true });
        const writable = await fileHandle.createWritable();
        const uint8 = new Uint8Array(imgDataArray);
        const blob = new Blob([uint8], { type: format === 'png' ? 'image/png' : 'image/jpeg' });
        await writable.write(blob);
        await writable.close();
        console.log('✅ PS编辑图片已保存:', fileName);
        return true;
    } catch (e) {
        console.error('保存PS编辑图片失败:', e);
        showToast('❌ 保存失败: ' + e.message);
        return false;
    }
}

        return path.substring(0, lastSlash);

}

function toggleSkip(row, idx, type) {
    const key = `${row}_${idx}_${type}`;
    const isNowSkipped = !skippedItems[key];
    if (isNowSkipped) {
        skippedItems[key] = true;
    } else {
        delete skippedItems[key];
    }
    saveSkippedItems();
    // 只更新当前项的样式，不重新渲染整个面板以保持滚动位置
    const tabId = type === 'highlight' ? 'tab-highlights' : 'tab-faq';
    const tabContent = document.getElementById(tabId);
    if (tabContent) {
        const items = tabContent.querySelectorAll(`.${type}-item`);
        if (items[idx]) {
            items[idx].classList.toggle('skipped', isNowSkipped);
            const numEl = items[idx].querySelector(`.${type === 'highlight' ? 'highlight-num' : 'div'}`);
            if (numEl && type === 'highlight') {
                numEl.textContent = isNowSkipped ? '✕' : (idx + 1);
            }
            if (type === 'faq') {
                const circle = items[idx].querySelector('div[style*="border-radius:50%"]');
                if (circle) {
                    circle.textContent = isNowSkipped ? '✕' : 'Q' + (idx + 1);
                    circle.style.background = isNowSkipped ? 'rgba(255,255,255,0.2)' : 'rgba(77,150,255,0.9)';
                }
            }
        }
    }
}

// 解析工作表范围 "A3:F100" 的起始行号（1 基）；用于把数据数组下标还原成真实 Excel 行号，
// 表头不在第 1 行时也能得到正确行号（不能写死第 2 行，也不能用界面列表下标冒充 Excel 行号）。
function sheetRangeStartRow(ref) {
    const m = /^[A-Z]+\$?(\d+)/.exec(String(ref || ''));
    return m ? Number(m[1]) : 1;
}

// 「当前导入 Excel 的当前产品行」快照接口：锁定 文件 / 工作表 / 实际行号 / 原始表头与行值。
// excelRowSpec 返回**可持久化的纯数据规格**（任务开始时写入任务记录，刷新后仍在）；
// buildExcelRowSnapshot 由该规格构建冻结快照（ctx.data.excelRow = 该快照），
// 之后切换产品、调整步骤顺序或另导 Excel 都不会改变已开始任务的数据。保留原始中文列名，数值 0 不丢失。
function excelRowSpec(rowNumber) {
    if (!currentSheet) throw new Error('尚未导入 Excel，无法构建行数据快照');
    const index = Number(rowNumber) - currentSheet.startRow;
    const values = index >= 0 ? currentSheet.rows[index] : null;
    if (!values) throw new Error(`工作表「${currentSheet.sheetName}」中不存在第 ${rowNumber} 行`);
    return {
        fileName: currentSheet.fileName,
        sheetName: currentSheet.sheetName,
        rowNumber: Number(rowNumber),
        headers: currentSheet.headers.slice(),
        values: values.slice(),
    };
}
function buildExcelRowSnapshot(rowNumber) {
    if (!window.ExcelRow) throw new Error('缺少 excel-row.js 模块，无法构建行数据快照');
    return window.ExcelRow.build(excelRowSpec(rowNumber));
}
window.buildExcelRowSnapshot = buildExcelRowSnapshot;

// 读取 Excel 文件：FileReader → XLSX 解析 → 提取产品数据 + 提取图片 + 通知扩展清旧数据
function handleFile(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
        try {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const sheetName = workbook.SheetNames[0];
            const sheet = workbook.Sheets[sheetName];
            const jsonData = XLSX.utils.sheet_to_json(sheet, { header: 1 });
            // 锁定真实表头 + 原始行单元格 + 表头所在实际行号：后处理脚本据此按真实 Excel 列名取「当前产品行」。
            // 不再读取「属性TXT文件夹」，也不再生成 材质.txt / group.txt 等虚拟键。
            const sheetStartRow = sheetRangeStartRow(sheet['!ref']);
            currentSheet = jsonData.length
                ? { fileName: file.name, sheetName, startRow: sheetStartRow, headers: (jsonData[0] || []).slice(), rows: jsonData }
                : null;
            const fileName = file.name.replace(/\.[^/.]+$/, '');
            const fileChanged = fileName !== loadedFileName;
            if (fileChanged) {
                handleColorFileSwitched({ to: fileName });
                if (batchColorState && !batchColorState.inFlightRow && !batchColorState.pendingAckRow) {
                    stopBatchColorPolling();
                    saveColorBatchState();
                    batchColorState = null;
                }
                selectedRows.clear();
                uploadedRows = {}; legacyRows = {};
                currentProduct = null;
                const detail = document.getElementById('detailPanel');
                if (detail) { detail.innerHTML = ''; detail.classList.add('empty'); }
            }
            if (typeof chrome !== 'undefined' && chrome.runtime) {
                try {
                    chrome.runtime.sendMessage(EXTENSION_ID, { action: 'setCurrentFilename', filename: fileName }, () => { void chrome.runtime.lastError; });
                } catch (e) {}
            }
            loadedFileName = fileName;
            // 真实初始化入口：文件就绪后恢复上次换色任务（保持暂停、不自动派发）
            setTimeout(() => { try { restoreColorBatchState(); } catch (e) { console.warn('恢复换色任务失败:', e); } }, 300);
            try { localStorage.setItem('polo_loaded_filename', fileName); } catch (e) {}
            const skippedCount = parseProducts(jsonData);
            let toastMsg = '✅ 加载成功，共 ' + products.length + ' 款产品';
            if (skippedCount > 0) toastMsg += '（已过滤 ' + skippedCount + ' 款）';
            showToast(toastMsg);
        } catch (err) {
            showToast('❌ 文件读取失败: ' + err.message);
        }
    };
    reader.readAsArrayBuffer(file);
}

function detectCategoryFromHeader(header) {
    const headerLower = header.map(h => String(h || '').toLowerCase().trim());
    if (headerLower.some(h => h.includes('衬衫类型') || h.includes('袖长') || h.includes('衣服门襟'))) {
        return 'shirt';
    }
    if (headerLower.some(h => h.includes('种类') && (h.includes('面料克重') || headerLower.some(h2 => h2.includes('面料克重'))))) {
        if (headerLower.some(h => h.includes('领型') && headerLower.some(h2 => h2.includes('帽') || h2.includes('hood')))) {
            return 'hoodie';
        }
        return 'sweatshirt';
    }
    if (headerLower.some(h => h.includes('领子') || h.includes('板型'))) {
        return 'tshirt';
    }
    return 'polo';
}

function buildColumnMap(headerRow) {
    const detectedCategory = detectCategoryFromHeader(headerRow);
    console.log('🔍 检测到类目:', detectedCategory);
    
    const keywordsConfig = HEADER_KEYWORDS_BY_CATEGORY[detectedCategory] || HEADER_KEYWORDS_BY_CATEGORY.polo;
    const colMap = {};
    colMap._detectedCategory = detectedCategory;
    const header = headerRow.map(h => String(h || '').trim());
    const matchedCols = new Set();
    
    for (const [field, keywords] of Object.entries(keywordsConfig)) {
        let bestIdx = -1;
        let bestKwLen = 0;
        let bestLabel = '';
        for (let i = 0; i < header.length; i++) {
            const cell = header[i];
            if (!cell) continue;
            for (const kw of keywords) {
                const cellLower = cell.toLowerCase();
                const kwLower = kw.toLowerCase();
                if (cellLower === kwLower || cellLower.includes(kwLower)) {
                    if (kw.length > bestKwLen) {
                        bestKwLen = kw.length;
                        bestIdx = i;
                        bestLabel = cell;
                    }
                }
            }
        }
        if (bestIdx !== -1) {
            colMap[field] = bestIdx;
            colMap[field + '_label'] = bestLabel;
            matchedCols.add(bestIdx);
        }
    }
    
    colMap._dynamic = [];
    for (let i = 0; i < header.length; i++) {
        if (matchedCols.has(i)) continue;
        const cell = header[i];
        if (!cell) continue;
        const clean = cell.trim();
        if (!clean) continue;
        const key = 'attr_' + i;
        colMap[key] = i;
        colMap._dynamic.push({ key, label: clean, col: i });
    }
    return colMap;
}

// 解析二维数组为产品对象数组：按类目关键词映射表头、拆分中英双语字段、过滤废弃行
function parseProducts(data) {
    products = [];
    let skippedCount = 0;
    if (!data || data.length < 2) return 0;

    const colMap = buildColumnMap(data[0]);
    currentColMap = colMap;
    // 表头所在真实 Excel 行号；数据下标 i（1 基）对应实际行 startRow + i，不写死第 2 行。
    const startRow = currentSheet ? currentSheet.startRow : 1;
    const categoryType = colMap._detectedCategory || 'polo';
    console.log('📊 表头匹配结果:', colMap);
    console.log('📋 原始表头行:', data[0]);
    console.log('📏 总行数:', data.length, '类目:', categoryType);

    for (let i = 1; i < data.length; i++) {
        const row = data[i];
        let idx;
        if (colMap.index !== undefined) {
            idx = row[colMap.index];
        } else {
            idx = i;
        }
        const titleCol = colMap.title !== undefined ? colMap.title : 1;
        if (!idx && !row[titleCol]) continue;

        const statusCol = colMap.status !== undefined ? colMap.status : data[0].length - 1;
        const status = String(row[statusCol] || '').trim();
        const discardValues = ['废弃', '是', 'yes', 'Yes', 'YES', 'true', 'True', 'TRUE', '1', 'discard', 'Discard', 'DISCARD'];
        if (discardValues.includes(status)) { skippedCount++; continue; }

        const priceCol = colMap.price !== undefined ? colMap.price : 1;
        const highlightsCol = colMap.highlights !== undefined ? colMap.highlights : data[0].length - 4;
        const faqCol = colMap.faq !== undefined ? colMap.faq : data[0].length - 3;
        const categoryCol = colMap.category !== undefined ? colMap.category : data[0].length - 2;

        const product = {
            row: startRow + i, index: idx || '', title_en: '', title_cn: '',
            material_en: '', material_cn: '', technics_en: '', technics_cn: '',
            design_en: '', design_cn: '', features_en: '', features_cn: '',
            style_en: '', style_cn: '', printing_en: '', printing_cn: '',
            fabric_en: '', fabric_cn: '', length_en: '', length_cn: '',
            sleeve_en: '', sleeve_cn: '', price: row[priceCol] || '',
            highlights: row[highlightsCol] || '', faq: row[faqCol] || '',
            status: status || '正常',
            pattern_en: '', pattern_cn: '',
            fabric_weight_en: '', fabric_weight_cn: '',
            weaving_method_en: '', weaving_method_cn: '',
            logo_position_en: '', logo_position_cn: '',
            fabric_type_en: '', fabric_type_cn: '',
            origin_en: '', origin_cn: '',
            province_en: '', province_cn: '',
            gender_en: '', gender_cn: '',
            collar_en: '', collar_cn: '',
            placket_en: '', placket_cn: '',
            product_type_en: '', product_type_cn: '',
            shirt_type_en: '', shirt_type_cn: '',
            fit_en: '', fit_cn: '',
            category_type_en: '', category_type_cn: '',
            _categoryType: categoryType,
        };

        const fieldMap = [
            ['title', 'title_en', 'title_cn'],
            ['material', 'material_en', 'material_cn'],
            ['technics', 'technics_en', 'technics_cn'],
            ['design', 'design_en', 'design_cn'],
            ['features', 'features_en', 'features_cn'],
            ['style', 'style_en', 'style_cn'],
            ['printing', 'printing_en', 'printing_cn'],
            ['fabric', 'fabric_en', 'fabric_cn'],
            ['fabric_type', 'fabric_type_en', 'fabric_type_cn'],
            ['length', 'length_en', 'length_cn'],
            ['sleeve', 'sleeve_en', 'sleeve_cn'],
            ['pattern', 'pattern_en', 'pattern_cn'],
            ['fabric_weight', 'fabric_weight_en', 'fabric_weight_cn'],
            ['weaving_method', 'weaving_method_en', 'weaving_method_cn'],
            ['logo_position', 'logo_position_en', 'logo_position_cn'],
            ['origin', 'origin_en', 'origin_cn'],
            ['province', 'province_en', 'province_cn'],
            ['gender', 'gender_en', 'gender_cn'],
            ['collar', 'collar_en', 'collar_cn'],
            ['placket', 'placket_en', 'placket_cn'],
            ['product_type', 'product_type_en', 'product_type_cn'],
            ['shirt_type', 'shirt_type_en', 'shirt_type_cn'],
            ['fit', 'fit_en', 'fit_cn'],
            ['category_type', 'category_type_en', 'category_type_cn'],
        ];

        for (const [field, enKey, cnKey] of fieldMap) {
            const col = colMap[field];
            if (col === undefined) continue;
            const val = row[col];
            if (val) {
                const lines = String(val).split('\n').filter(l => l.trim());
                if (lines.length >= 2) {
                    product[enKey] = lines[0].trim();
                    product[cnKey] = lines[1].trim();
                } else {
                    const split = splitBilingual(String(val));
                    product[enKey] = split.en;
                    product[cnKey] = split.cn;
                }
            }
        }

        if (row[categoryCol] && String(row[categoryCol]).trim()) {
            product.category = String(row[categoryCol]).trim();
            const catBilingual = splitBilingual(product.category);
            product._category_en = catBilingual.en;
            product._category_cn = catBilingual.cn;
        } else {
            if (categoryType === 'shirt') {
                product.category = "Men's Shirts";
            } else if (categoryType === 'tshirt') {
                product.category = "Men's T-shirts";
            } else if (categoryType === 'hoodie') {
                product.category = "Men's Hoodies";
            } else if (categoryType === 'sweatshirt') {
                product.category = "Men's Sweatshirts";
            } else {
                product.category = "Men's Polo Shirts";
            }
            product._category_en = product.category;
            product._category_cn = "";
        }

        product._attrs = [];
        if (colMap._dynamic) {
            for (const dyn of colMap._dynamic) {
                const val = row[dyn.col];
                if (val === undefined || val === null || String(val).trim() === '') continue;
                const strVal = String(val);
                const lines = strVal.split('\n').filter(l => l.trim());
                let en = '', cn = '';
                if (lines.length >= 2) {
                    en = lines[0].trim();
                    cn = lines[1].trim();
                } else {
                    const split = splitBilingual(strVal);
                    en = split.en;
                    cn = split.cn;
                }
                product._attrs.push({ label: dyn.label, en, cn });
            }
        }

        product.imagePath = 'extracted_images/row' + product.row + '_main.png';
        products.push(product);
    }

    saveToLocalStorage();
    renderProductList();
    return skippedCount;
}

// 产品与原始工作表作为同一份快照存储，避免刷新后只恢复一半。
function openImportCache() {
    return new Promise((resolve, reject) => {
        const req = indexedDB.open('PoloImportCache', 1);
        req.onupgradeneeded = () => req.result.createObjectStore('imports');
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
    });
}
async function saveToLocalStorage() {
    if (!currentSheet) return;
    const snapshot = structuredClone({ version: 1, products, currentColMap, currentSheet, loadedFileName });
    let db;
    try {
        db = await openImportCache();
        await new Promise((resolve, reject) => {
            const tx = db.transaction('imports', 'readwrite');
            tx.objectStore('imports').put(snapshot, 'last');
            tx.oncomplete = resolve;
            tx.onerror = () => reject(tx.error);
            tx.onabort = () => reject(tx.error || new Error('缓存写入中断'));
        });
    } catch (e) {
        console.warn('保存完整 Excel 缓存失败:', e);
        showToast('⚠️ 自动导入缓存保存失败，下次打开请重新导入 Excel');
    } finally { if (db) db.close(); }
}
function saveSelectedIdx(idx) { try { localStorage.setItem('polo_selected_idx', idx); } catch (e) {} }
function saveActiveTab(tab) { try { localStorage.setItem('polo_active_tab', tab); } catch (e) {} }

async function loadFromLocalStorage() {
    try {
        const db = await openImportCache();
        let saved;
        try {
            saved = await new Promise((resolve, reject) => {
                const req = db.transaction('imports', 'readonly').objectStore('imports').get('last');
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        } finally { db.close(); }
        // 用户已手动导入时，不让较晚返回的缓存覆盖新文件。
        if (currentSheet) return false;
        if (saved && saved.version === 1 && Array.isArray(saved.products) &&
            saved.currentSheet && Array.isArray(saved.currentSheet.rows) &&
            Array.isArray(saved.currentSheet.headers) && saved.loadedFileName) {
            products = saved.products;
            currentColMap = saved.currentColMap;
            currentSheet = saved.currentSheet;
            loadedFileName = saved.loadedFileName;
            // 真实启动入口：产品与文件名就绪后恢复换色任务（保持暂停、不自动派发）
            setTimeout(() => { try { restoreColorBatchState(); } catch (e) { console.warn('恢复换色任务失败:', e); } }, 300);
            renderProductList();
            document.getElementById('stats').style.display = 'flex';
            const categoryMap = {};
            products.forEach(p => { const cat = p.category || '未分类'; categoryMap[cat] = (categoryMap[cat] || 0) + 1; });
            let statsHtml = `<div class="stat-item"><div class="stat-num">${products.length}</div><div class="stat-label">产品总数</div></div>`;
            for (const [cat, count] of Object.entries(categoryMap)) {
                if (count > 0) statsHtml += `<div class="stat-item"><div class="stat-num">${count}</div><div class="stat-label">${cat}</div></div>`;
            }
            document.getElementById('stats').innerHTML = statsHtml;
            const savedIdx = localStorage.getItem('polo_selected_idx');
            const savedTab = localStorage.getItem('polo_active_tab');
            if (['basic','highlights','faq'].includes(savedTab)) currentActiveTab = savedTab;
            startUploadPolling();
            if (chrome && chrome.runtime && loadedFileName) {
                try { chrome.runtime.sendMessage(EXTENSION_ID, { action: 'setCurrentFilename', filename: loadedFileName }, () => {}); } catch (e) {}
            }
            if (savedIdx !== null && products[parseInt(savedIdx)]) selectProduct(parseInt(savedIdx));
            return true;
        }
        if (localStorage.getItem('polo_products')) {
            showToast('⚠️ 旧缓存缺少完整 Excel 数据，请重新导入一次，之后打开将自动恢复');
        }
    } catch (e) { console.warn('恢复本地产品缓存失败:', e); }
    return false;
}

let selectedRows = new Set();
let skipUploaded = false;
let uploadedRowsFileKey = null;
let uploadedRows = {};   // 已核实保存（跳过依据）
let legacyRows = {};     // 旧 uploaded 标记：历史待核，仅展示

function getSelectedProducts() {
    return products.filter(p => selectedRows.has(p.row));
}

function updateBatchBar() {
    const batchBar = document.getElementById('batchBar');
    const selectedCountEl = document.getElementById('selectedCount');
    const batchPublishBtn = document.getElementById('batchPublishBtn');
    const selectAllCheck = document.getElementById('selectAllCheck');
    const skipUploadedCheck = document.getElementById('skipUploadedCheck');

    const count = selectedRows.size;
    if (count > 0) {
        batchBar.style.display = 'flex';
    } else {
        batchBar.style.display = 'none';
    }
    selectedCountEl.textContent = count;
    batchPublishBtn.disabled = count === 0;

    if (skipUploadedCheck) {
        if (skipUploaded) {
            skipUploadedCheck.classList.add('checked');
        } else {
            skipUploadedCheck.classList.remove('checked');
        }
    }

    const uploadableCount = skipUploaded
        ? products.filter(p => !uploadedRows[p.row]).length
        : products.length;

    if (count === uploadableCount && uploadableCount > 0 && count > 0) {
        selectAllCheck.classList.add('checked');
    } else {
        selectAllCheck.classList.remove('checked');
    }
}

function toggleSkipUploaded() {
    skipUploaded = !skipUploaded;
    const skipUploadedCheck = document.getElementById('skipUploadedCheck');
    if (skipUploadedCheck) {
        if (skipUploaded) {
            skipUploadedCheck.classList.add('checked');
            const selectedList = Array.from(selectedRows);
            for (const row of selectedList) {
                if (uploadedRows[row]) {
                    selectedRows.delete(row);
                    const checkbox = document.querySelector(`.product-card .batch-checkbox[data-row="${row}"]`);
                    if (checkbox) checkbox.classList.remove('checked');
                }
            }
            showToast('ℹ️ 已跳过已保存的产品');
        } else {
            skipUploadedCheck.classList.remove('checked');
        }
    }
    updateBatchBar();
}

function toggleSelectRow(rowNum, event) {
    if (event) {
        event.stopPropagation();
    }
    if (skipUploaded && uploadedRows[rowNum]) {
        showToast('ℹ️ 已开启跳过已保存，无法勾选');
        return;
    }
    if (selectedRows.has(rowNum)) {
        selectedRows.delete(rowNum);
    } else {
        selectedRows.add(rowNum);
    }
    updateBatchBar();
    const checkbox = document.querySelector(`.product-card .batch-checkbox[data-row="${rowNum}"]`);
    if (checkbox) {
        if (selectedRows.has(rowNum)) {
            checkbox.classList.add('checked');
        } else {
            checkbox.classList.remove('checked');
        }
    }
}

function toggleSelectAll() {
    const uploadableProducts = skipUploaded
        ? products.filter(p => !uploadedRows[p.row])
        : products;

    const uploadableRows = new Set(uploadableProducts.map(p => p.row));
    const allSelected = uploadableProducts.length > 0 &&
        uploadableProducts.every(p => selectedRows.has(p.row));

    if (allSelected) {
        for (const row of uploadableRows) {
            selectedRows.delete(row);
        }
    } else {
        for (const row of uploadableRows) {
            selectedRows.add(row);
        }
    }
    updateBatchBar();
    document.querySelectorAll('.product-card .batch-checkbox').forEach(cb => {
        const row = parseInt(cb.dataset.row);
        if (selectedRows.has(row)) {
            cb.classList.add('checked');
        } else {
            cb.classList.remove('checked');
        }
    });
}

// 批量发品：产品快照与队列在一次请求中创建；每批款数由设置（1-500）决定
function batchPublish() {
    window.UnifiedTaskStarted?.();
    const selectedProducts = getSelectedProducts();
    if (selectedProducts.length === 0) return;

    if (!extensionInstalled) {
        showToast('❌ 请先安装Chrome扩展');
        return;
    }

    window.UnifiedPublishProgress?.({phase:'preparing',done:0,total:selectedProducts.length,fileKey:currentFileKey()});
    const batchData = selectedProducts.map(p => {
        const filtered = { ...p };
        const highlights = parseHighlights(p.highlights || '');
        filtered.highlights = highlights
            .filter((h, i) => !isSkipped(p.row, i, 'highlight'))
            .map(h => {
                let line = h.desc_en || '';
                if (h.label_en) line = `[${h.label_en}]：${line}`;
                return line;
            }).join('\n');

        const faqs = parseFaqs(p.faq || '');
        filtered.faq = faqs
            .filter((f, i) => !isSkipped(p.row, i, 'faq'))
            .map(f => {
                let result = `Q: ${f.q_en} A: ${f.a_en}`;
                if (f.q_cn) result += ` 问：${f.q_cn}`;
                if (f.a_cn) result += ` 答：${f.a_cn}`;
                return result;
            }).join('\n');

        filtered._highlightDescs = highlights
            .filter((h, i) => !isSkipped(p.row, i, 'highlight'))
            .map(h => (h.desc_en || '').trim())
            .filter(Boolean);

        return filtered;
    });

    const baseDir = getBaseDir();
    const colorImgDir = baseDir || '';

    try {
        chrome.runtime.sendMessage(EXTENSION_ID, {
            action: 'openBatchPublish',
            rows: selectedProducts.map(p => p.row), products: batchData,
            fileKey: currentFileKey(),
            imageDir: baseDir ? baseDir + '/extracted_images' : '', colorImgDir
        }, (resp) => {
            window.UnifiedPublishProgress?.({phase:'idle'});
            if (chrome.runtime.lastError || !resp) { showToast('❌ 无法启动发品任务'); refreshPublishState(); return; }
            if (!resp.ok) { showToast('❌ ' + (resp.error || '无法启动发品任务')); refreshPublishState(); return; }
            showToast(`🚀 发品任务已启动：共 ${selectedProducts.length} 款，每批 ${resp.batchSize || 50} 款`);
            refreshPublishState();
        });
    } catch (e) {
        showToast('❌ 批量发品失败: ' + e.message);
        window.UnifiedPublishProgress?.({phase:'idle'});
    }
}

// 渲染左侧产品卡片列表（缩略图 + 标题 + 已上传状态）
// 批次号取自文件名（第45批_100款_Polo衫…）：表格里没有单独的批次字段
function parseBatchLabel(fileName) {
    const m = String(fileName || '').match(/第\s*(\d+)\s*批/) || String(fileName || '').match(/(\d+)\s*批/);
    return m ? '第' + m[1] + '批' : '';
}

// 产品总数下面显示批次；没有批次信息就整行隐藏，不占位置
function renderProductBatch(fileName) {
    const el = document.getElementById('productBatch');
    if (!el) return;
    const label = parseBatchLabel(fileName === undefined ? loadedFileName : fileName);
    if (!label) { el.style.display = 'none'; el.textContent = ''; return; }
    const name = String(fileName === undefined ? loadedFileName : fileName || '');
    el.textContent = label + (name && name.indexOf(label) < 0 ? '（' + name + '）' : '');
    el.style.display = 'block';
}

function renderProductList() {
    const productList = document.getElementById('productList');
    const productCards = document.getElementById('productCards');
    const productCount = document.getElementById('productCount');
    productList.style.display = 'flex';
    productCount.textContent = products.length + '款';
    renderProductBatch();
    const renderFileKey = currentFileKey();
    const renderProducts = products;

    function doRender(uploaded, legacy) {
        if (renderFileKey !== currentFileKey() || renderProducts !== products) return;
        uploaded = uploaded || (uploadedRowsFileKey === renderFileKey ? uploadedRows : {});
        legacy = legacy || (uploadedRowsFileKey === renderFileKey ? legacyRows : {});
        uploadedRowsFileKey = renderFileKey;
        uploadedRows = uploaded;   // 仅「已核实保存」记录（跳过依据）
        legacyRows = legacy;       // 旧 uploaded 标记：历史待核，仅展示
        productCards.innerHTML = products.map((p, idx) => {
            const isUploaded = uploaded[p.row];
            const isLegacy = legacy[p.row] && !isUploaded;
            const isChecked = selectedRows.has(p.row);
            const delay = Math.min(idx * 0.04, 0.4);
            return `
                <div class="product-card card-enter" data-idx="${idx}" style="animation-delay: ${delay}s;">
                    <div class="batch-checkbox ${isChecked ? 'checked' : ''}" data-row="${p.row}" onclick="toggleSelectRow(${p.row}, event)">
                        <input type="checkbox" data-row="${p.row}" style="display:none;">
                    </div>
                    <div class="card-thumb">
                        <img src="extracted_images/row${p.row}_main.jpg" alt="" onerror="if(this.src.endsWith('_main.jpg')){this.src='extracted_images/row${p.row}_main.png';}else{this.style.display='none';this.parentElement.innerHTML='<span style=\\'font-size:24px;opacity:0.3;\\'>🖼️</span>';}">
                    </div>
                    <div class="card-info">
                        <div class="product-row">行${p.row} · ${p.index}</div>
                        <div class="product-name">${p.title_cn || p.title_en}</div>
                        ${currentColMap.material !== undefined ? `<div class="product-material">${p.material_cn || p.material_en}</div>` : ''}
                        <div class="product-cat"><span class="tag">${p.category.split("'s ")[1] || p.category}</span></div>
                        <div class="product-footer">
                            <div class="tags-row-media"></div>
                            ${isUploaded ? '<span class="footer-status">✓ 已保存</span>' : (isLegacy ? '<span class="footer-status is-legacy" title="旧标记，未核实保存，不作为跳过依据">历史待核</span>' : '')}
                        </div>
                    </div>
                </div>`;
        }).join('');
        productCards.querySelectorAll('.product-card').forEach(card => {
            card.addEventListener('click', (e) => {
                if (e.target.closest('.batch-checkbox')) return;
                selectProduct(parseInt(card.dataset.idx));
            });
        });
        updateBatchBar();
        checkColorGeneratedStatus();
        checkSuiteGeneratedStatus();
        renderSuiteAutoControls();
    }

    if (chrome && chrome.runtime) {
        try {
            chrome.runtime.sendMessage(EXTENSION_ID, { action: 'getUploadedRows', fileKey: renderFileKey }, (response) => {
                if (chrome.runtime.lastError || !response?.ok) doRender();
                else if (response.fileKey === undefined || response.fileKey === renderFileKey) doRender(response.rows, response.legacy);
            });
        } catch (e) { doRender(); }
    } else { doRender(); }
}

async function checkColorGeneratedStatus() {
    if (!extensionInstalled || products.length === 0) return;
    const queriedFile = currentFileKey();
    const queriedProducts = products;

    // 以磁盘为准：颜色图和套图都扫一次目录，避免"存储里没有但磁盘有图"时角标丢失
    try {
        if (typeof PageDirectories !== 'undefined' && PageDirectories.dispatch) {
            if (PageDirectories.ready && typeof PageDirectories.ready.then === 'function') await PageDirectories.ready.catch(() => {});
            const got = await PageDirectories.dispatch({ action: 'pageScanSuiteRows', fileFolder: loadedFileName || '' });
            if (got && got.ok && got.colors) {
                const colors = got.colors;
                products.forEach((p, idx) => {
                    if ((colors[String(p.row)] || []).length >= 4) addColorBadge(idx);
                });
                return;
            }
        }
    } catch (_) {}

    // 只认磁盘：扫不到就不显示
    document.querySelectorAll('.color-generated-badge').forEach(b => b.remove());
}

function addSuiteGeneratedBadge(rowNum) {
    // 生成/重生成结束后重新判定（5 张齐才显示角标）。
    // 旧实现在这里是"把角标删掉"，正是它让角标永远不出现。
    if (products.findIndex(p => p.row === rowNum) === -1) return;
    checkSuiteGeneratedStatus().catch(() => {});
}

// 「套图」角标只按成品验收：同一 fileKey+rowNum 的 111/222/333/444/666 全部存在
// 已保存并校验过的后处理成品才显示；跨任务补齐同样计入，单步任务完成不代表整套完成。
// 角标已取消（用户要求）：不再做全表核验，只清理历史遗留标记。
// 「套图」角标：与颜色图并列的一条。只在 5 张成品齐全（111/222/333/444/666）
// 时显示——缺任意一张就不标，避免"看着整套齐了"其实少图。
async function checkSuiteGeneratedStatus() {
    if (products.length === 0) return;
    const fileKey = currentFileKey();
    const wanted = ['111', '222', '333', '444', '666'];
    let diskRows = null;

    // 以磁盘为准：一次扫目录拿到每行有哪些成品图。
    // 以前按 IndexedDB 记录判定，套图是拷进来的/记录被清过时磁盘有图也不显示角标。
    try {
        if (typeof PageDirectories !== 'undefined' && PageDirectories.dispatch) {
            if (PageDirectories.ready && typeof PageDirectories.ready.then === 'function') await PageDirectories.ready.catch(() => {});
            const got = await PageDirectories.dispatch({ action: 'pageScanSuiteRows', fileFolder: loadedFileName || '' });
            if (got && got.ok) diskRows = got.rows || {};
        }
    } catch (_) { diskRows = null; }

    // 只认磁盘：扫不到（目录未授权等）就不显示角标，不再用旧记录顶着
    if (!diskRows) {
        document.querySelectorAll('.suite-generated-badge').forEach(b => b.remove());
        return;
    }

    for (const product of products) {
        if (fileKey !== currentFileKey()) return;
        let complete = false;
        {
            const have = new Set(diskRows[String(product.row)] || []);
            complete = wanted.every(k => have.has(k));
        }
        const idx = products.findIndex(p => p.row === product.row);
        if (idx < 0) continue;
        const card = document.querySelector(`.product-card[data-idx="${idx}"]`);
        if (!card) continue;
        const existing = card.querySelector('.suite-generated-badge');
        if (existing) existing.remove();
        if (!complete) continue;
        const badge = document.createElement('span');
        badge.className = 'suite-generated-badge';
        badge.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5" fill="currentColor" stroke="none"/><path d="M21 16l-5-5-4 4-3-3-6 6"/></svg><span>套图</span>';
        const row = mediaTagsRow(card);
        if (row) row.insertBefore(badge, row.firstChild);   // 行2：套图 在前，颜色图 在后
    }
}

function syncProductToExtension(product) {
    if (!chrome || !chrome.runtime || !product) return;
    try {
        chrome.runtime.sendMessage(EXTENSION_ID, { action: 'saveProductData', data: product }, response => {
            const error = chrome.runtime.lastError;
            if (error || !response?.ok) console.warn('产品资料同步失败：', error?.message || response?.error || '扩展未回复');
        });
    } catch (e) {}
}

// 选中产品：高亮卡片 + 渲染右侧详情面板
function selectProduct(idx) {
    currentProduct = products[idx];
    saveSelectedIdx(idx);
    document.querySelectorAll('.product-card').forEach(c => c.classList.remove('active'));
    document.querySelectorAll('.product-card').forEach(c => {
        if (parseInt(c.dataset.idx) === idx) c.classList.add('active');
    });
    syncProductToExtension(currentProduct);
    const detailPanel = document.getElementById('detailPanel');
    renderDetail();
}

function navigateProduct(direction) {
    if (!products || products.length === 0) return;
    let currentIdx = -1;
    if (currentProduct) {
        currentIdx = products.findIndex(p => p.row === currentProduct.row);
    }
    if (currentIdx === -1) currentIdx = 0;
    
    let newIdx;
    if (direction === 'up') {
        newIdx = currentIdx > 0 ? currentIdx - 1 : 0;
    } else {
        newIdx = currentIdx < products.length - 1 ? currentIdx + 1 : products.length - 1;
    }
    
    if (newIdx !== currentIdx) {
        selectProduct(newIdx);
        const card = document.querySelector(`.product-card[data-idx="${newIdx}"]`);
        if (card) {
            card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    }
}

let extensionInstalled = false;
let extensionPort = null;
let extensionReconnectTimer = null;


// 扩展被重载 → 页面自动刷新（省掉手动 Ctrl+Shift+R）
// 判据是扩展 onInstalled 打的时间戳：SW 休眠/唤醒不会改它，所以不会误刷新丢进度
const EXT_RELOAD_TS_KEY = 'polo_ext_reload_ts_seen';
let extReloadCheckBusy = false;

function checkExtensionReloaded() {
    if (extReloadCheckBusy || !EXTENSION_ID) return;
    extReloadCheckBusy = true;
    try {
        chrome.runtime.sendMessage(EXTENSION_ID, { action: 'getExtBootInfo' }, (resp) => {
            extReloadCheckBusy = false;
            if (chrome.runtime.lastError || !resp || !resp.ok) return;
            const ts = resp.reloadTs || 0;
            if (!ts) return; // 扩展还没跑过 onInstalled（老版本）→ 不动
            const seen = parseInt(localStorage.getItem(EXT_RELOAD_TS_KEY), 10) || 0;
            if (seen === 0) {
                localStorage.setItem(EXT_RELOAD_TS_KEY, String(ts)); // 首次只记，不刷
                return;
            }
            if (ts !== seen) {
                localStorage.setItem(EXT_RELOAD_TS_KEY, String(ts));
                console.log(`🔁 检测到扩展已重载（${seen} → ${ts}），页面自动刷新`);
                showToast('🔁 扩展已重载，页面自动刷新中...');
                setTimeout(() => location.reload(), 800);
            }
        });
    } catch (e) {
        extReloadCheckBusy = false;
    }
}

function setupExtensionReconnect() {
    if (extensionReconnectTimer) clearInterval(extensionReconnectTimer);
    extensionReconnectTimer = setInterval(() => {
        if (!extensionInstalled || !extensionPort) {
            console.log('🔄 尝试重新连接扩展...');
            checkExtension();
        }
    }, 15000);
}

function checkExtension() {
    // EXTENSION_ID 未配置时直接提示，避免 sendMessage 报错
    if (!EXTENSION_ID) {
        extensionInstalled = false;
        extensionPort = null;
        updateExtensionStatus();
        console.warn('[发品助手] 扩展 ID 未配置，请从浏览器扩展弹窗点击“打开发品助手”自动连接');
        return;
    }
    try {
        chrome.runtime.sendMessage(EXTENSION_ID, { action: 'ping' }, (response) => {
            if (chrome.runtime.lastError || !response?.ok) {
                extensionInstalled = false;
                extensionPort = null;
                updateExtensionStatus();
                return;
            }
            const restoredConnection = !extensionInstalled || !extensionPort;
            extensionInstalled = true;
            updateExtensionStatus();
            if (restoredConnection && products.length) {
                renderProductList();
                startUploadPolling();
                if(currentProduct)syncProductToExtension(currentProduct);
            }
            checkExtensionReloaded();
            // 每次（重新）连上扩展都重新拉一次发品任务状态，避免刷新/断线后面板状态丢失
            refreshPublishState();
            try {
                if (!extensionPort) {
                    extensionPort = chrome.runtime.connect(EXTENSION_ID, { name: 'assistant-channel' });
                    chrome.runtime.sendMessage(EXTENSION_ID,{action:'registerPagePaths'},()=>{void chrome.runtime.lastError;});
                    // 目录桥握手：告诉扩展本页支持目录桥请求（扩展据此快速拒绝旧版页面，不再静默超时）
                    try{extensionPort.postMessage({action:'pageDirectoryBridgeReady'});}catch(_){}
                    extensionPort.onMessage.addListener((msg) => {
                        // 扩展侧主动探测（连接建立后由扩展发出）：回一次握手，供扩展确认本页支持目录桥
                        if(msg.action==='bridgeProbe'){
                            try{extensionPort.postMessage({action:'pageDirectoryBridgeReady'});}catch(_){}
                        }
                        if(msg.action==='pageDirectoryRequest'){
                            const replyPort=extensionPort;
                            // 先立即确认收到，扩展据此区分「旧版页面无监听」与「页面执行慢」
                            try{replyPort.postMessage({action:'pageDirectoryAck',requestId:msg.requestId});}catch(_){}
                            let dispatchPromise;
                            try{
                                dispatchPromise = (typeof PageDirectories!=='undefined')
                                    ? PageDirectories.dispatch(msg.request)
                                    : Promise.reject(Error('页面目录模块未加载'));
                            }catch(error){ dispatchPromise = Promise.reject(error); }
                            dispatchPromise.then(result=>replyPort.postMessage({action:'pageDirectoryResponse',requestId:msg.requestId,ok:true,result}))
                                .catch(error=>{try{replyPort.postMessage({action:'pageDirectoryResponse',requestId:msg.requestId,ok:false,error:error.message});}catch(_){}});
                        }
                        if(msg.action==='publicationImagesRequest'){
                            const replyPort=extensionPort;
                            PublicationImageSource.read(msg).then(files=>replyPort.postMessage({action:'publicationImagesResponse',requestId:msg.requestId,ok:true,files}))
                                .catch(error=>{try{replyPort.postMessage({action:'publicationImagesResponse',requestId:msg.requestId,ok:false,error:error.message});}catch(_){};});
                        }
                        if (msg.action === 'publishSaved') handlePublishSaved(msg);
                        if (msg.action === 'colorTaskAccepted') handleColorTaskAccepted(msg);
                        if (msg.action === 'colorTaskStopped') handleColorTaskStopped(msg);
                        if (msg.action === 'colorTaskComplete') {
                            handleColorTaskComplete(msg);
                        }
                        if (msg.action === 'colorFileSwitched') {
                            handleColorFileSwitched(msg);
                        }
                        if (msg.action === 'publishImageProgress') window.UnifiedPublishProgress?.(msg);
                        if (msg.action === 'publishState') {
                            handlePublishState(msg);
                        }
                        if (msg.action === 'publishResumed') {
                            handlePublishResumed(msg);
                        }
                        if (msg.action === 'publishResumeRejected') {
                            handlePublishResumeRejected(msg);
                        }
                        if (msg.action === 'publishAllFilled') {
