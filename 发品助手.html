// 渲染发品任务状态（由扩展 publishState / getPublishState 驱动）
function renderPublishState(s) {
    if (!s) return;
    lastPublishState = s;
    const total = s.total || 0;
    const filled = s.filledCount || 0;
    const remain = s.remaining || 0;
    const running = s.state === 'running';
    const paused = s.state === 'paused';
    const done = s.state === 'done';

    const idle = (s.state === 'idle');
    // 两类任务使用同款大进度条，未开始时隐藏；不随详情重绘而销毁。
    showPublishProgress(!idle);
    const barRow = document.getElementById('pubBarRow');
    const textRow = document.getElementById('pubTextRow');
    if (barRow) barRow.style.display = idle ? 'none' : 'block';
    if (textRow) textRow.style.display = idle ? 'none' : 'flex';

    const st = publishStatusEl();
    if (st) {
        if (idle) st.textContent = "";
        else if (done) st.textContent = `✅ 发品预填完成（${filled}/${total} 款，待检查保存）`;
        else if (paused) st.textContent = `⏸ 发品已暂停 · ${PUBLISH_REASON_TEXT[s.pauseReason] || s.pauseReason || ''}`;
        else st.textContent = `🚀 发品预填中 ${filled}/${total}`;
    }
    const fill = publishFillEl();
    if (fill) fill.style.width = (total > 0 ? Math.round((filled / total) * 100) : 0) + '%';
    const c = publishCounterEl();
    if (c) c.textContent = `${filled}/${total}`;
    const cur = publishCurrentEl();
    if (cur) cur.textContent = s.currentRow ? (s.rowRetryable ? `row${s.currentRow} 待处理` : `row${s.currentRow}${paused ? ' 尚未结束' : ' 正在填写'}`) : (done ? '预填完成' : `剩 ${remain} 款`);

    const b = publishBatchEl();
    if (b) b.textContent = `本批已开 ${s.batchOpened || 0}/${s.batchSize || 0} · 本批已填 ${s.batchFilled || 0}`;
    const p = publishPendingEl();
    if (p) p.textContent = `待保存 ${s.pendingSaveCount || 0}`;
    const pg = publishPagesEl();
    if (pg) pg.textContent = `页面 ${s.pages || 0}/${s.pageLimit || 0}`;

    const pauseEl = publishPauseEl();
    if (pauseEl) {
        const parts = [];
        if (paused && s.pauseDetail) parts.push('⏸ ' + s.pauseDetail);
        if (paused && s.resourceBlockDetail && s.resourceBlockDetail !== s.pauseDetail) parts.push('⛔ ' + s.resourceBlockDetail);
        if (paused && s.rowRetryable) parts.push(`↻ 第 ${s.currentRow} 行可重试（已重试 ${s.rowRetries || 0} 次）`);
        if (parts.length) { pauseEl.style.display = 'block'; pauseEl.textContent = parts.join('\n'); }
        else { pauseEl.style.display = 'none'; }
    }

    // 当前行处于"已失效"状态时（rowRetryable 由扩展的行失效状态决定，与资源暂停原因分开），
    // 「继续」只会空等 → 禁用并引导用重试/跳过
    const needExplicit = paused && s.rowRetryable === true;
    const btn = publishToggleEl();
    if (btn) {
        btn.style.display = idle ? 'none' : 'inline-block';
        if (running) { btn.textContent = '⏸ 暂停'; btn.disabled = false; btn.title = '暂停后不再开新页，当前页仍保留'; }
        else if (done) { btn.textContent = '已完成'; btn.disabled = true; btn.title = ''; }
        else if (needExplicit) {
            btn.textContent = '▶ 继续下一批'; btn.disabled = true;
            btn.title = '当前行页面已失效，请先「↻ 重试当前行」或「⏭ 跳过当前行」';
        } else {
            btn.textContent = '▶ 继续下一批'; btn.disabled = false;
            btn.title = `继续下一批（${s.batchSize || s.settingsBatchSize || 50} 款）`;
        }
    }
    // 仅"当前行卡住"时提供重试 / 明确跳过
    const rb = publishRetryEl(); if (rb) rb.style.display = needExplicit ? 'inline-block' : 'none';
    const sb = publishSkipEl(); if (sb) sb.style.display = needExplicit ? 'inline-block' : 'none';

    // 每批款数：运行中不可改（改的是"下一批"，由扩展在继续时同步到任务）
    const inp = publishBatchInput();
    if (inp) {
        if (document.activeElement !== inp) inp.value = String(s.batchSize || s.settingsBatchSize || 50);
        inp.disabled = running;
        inp.title = running
            ? '运行中不改当前批次；改了下一批生效（暂停后可编辑）'
            : '每批发几款（1-500）。改的是下一批，不会打断当前批次';
        // 赋值而非 addEventListener：重绘时覆盖同一属性，不会累积监听
        inp.onchange = (typeof onPublishBatchSizeChange === 'function') ? onPublishBatchSizeChange : null;
    }
}

// 每批款数：空/非数字回退当前值，小于 1 夹到 1，大于 500 夹到 500，再写回扩展设置
function onPublishBatchSizeChange() {
    const inp = publishBatchInput();
    if (!inp) return;
    const cur = Number((lastPublishState && (lastPublishState.settingsBatchSize || lastPublishState.batchSize)) || 50) || 50;
    const raw = String(inp.value === null || inp.value === undefined ? '' : inp.value).trim();
    let v = parseInt(raw, 10);
    if (raw === '' || !Number.isFinite(v)) {     // 空 / 非数字 → 回退当前值，不发请求
        inp.value = String(cur);
        showToast(`⚠️ 每批需填 1-500 的整数，已恢复为 ${cur} 款`);
        return;
    }
    if (v < 1) v = 1;                             // 0 / 负数 → 1（与扩展侧口径一致）
    if (v > 500) v = 500;
    inp.value = String(v);
    if (v === cur) return;                        // 没变化，不写库也不打扰
    try {
        chrome.runtime.sendMessage(EXTENSION_ID, { action: 'setPublishSettings', patch: { batchSize: v } }, (r) => {
            if (chrome.runtime.lastError || !r || !r.ok) {
                showToast('❌ 每批款数保存失败，已恢复为 ' + cur + ' 款');
                inp.value = String(cur);
                return;
            }
            const saved = Number((r.settings && r.settings.batchSize) || v) || v;
            inp.value = String(saved);
            showToast(`✅ 每批 ${saved} 款（下一批生效）`);
            refreshPublishState();
        });
    } catch (e) {
        showToast('❌ ' + e.message + '，已恢复为 ' + cur + ' 款');
        inp.value = String(cur);
    }
}

function computeColorResumeRows() {

    const inFlight = batchColorState.inFlightRow;
    const rest = batchColorState.queue.slice(batchColorState.currentIndex)
        .filter(p => p.row !== inFlight)
        .map(p => p.row);
    return [...new Set([...(batchColorState.failedRows || []), ...rest])];
}

// ===== 换色任务状态持久化：刷新/重连后恢复队列与在途身份，不自动重复派发 =====
const COLOR_BATCH_STATE_KEY = 'polo_color_batch_state';

function saveColorBatchState() {
    if (!batchColorState) { localStorage.removeItem(COLOR_BATCH_STATE_KEY); return; }
    const snap = {
        // 绑定任务创建时的文件：切文件后原任务仍归原文件，不被新文件接管
        fileKey: (typeof batchColorState.fileKey === 'string') ? batchColorState.fileKey : currentFileKey(),
        batchId: batchColorState.batchId || null,
        executionId: batchColorState.executionId || null,
        fileFolder: batchColorState.fileFolder || loadedFileName || '默认',
        label: batchColorState.label || '批量换色',
        rows: batchColorState.queue.map(p => p.row),
        currentIndex: batchColorState.currentIndex,
        successCount: batchColorState.successCount,
        failCount: batchColorState.failCount,
        failedRows: batchColorState.failedRows || [],
        skippedRows: batchColorState.skippedRows || [],
        inFlightRow: batchColorState.inFlightRow,
        inFlightSince: batchColorState.inFlightSince || 0,
        pendingAckRow: batchColorState.pendingAckRow || null,   // 未确认接收的阻挡事实必须持久化
        pausedReason: batchColorState.pausedReason || '',
        running: batchColorState.running,
        startTime: batchColorState.startTime
    };
    // 单一全局快照会互相覆盖：按文件分槽保存，保留每个文件自己的未完成任务
    localStorage.setItem(COLOR_BATCH_STATE_KEY + '::' + snap.fileKey, JSON.stringify(snap));
    localStorage.setItem(COLOR_BATCH_STATE_KEY, JSON.stringify(snap));   // 兼容读取
    return snap;
}

function loadColorBatchState() {
    try {
        // 优先读当前文件的专属槽位，再回退兼容槽位
        const cur = currentFileKey();
        const raw = localStorage.getItem(COLOR_BATCH_STATE_KEY + '::' + cur)
            || localStorage.getItem(COLOR_BATCH_STATE_KEY);
        return raw ? JSON.parse(raw) : null;
    } catch (_) { return null; }
}

// 刷新后恢复：只恢复状态与在途身份，绝不自动派发
function restoreColorBatchState() {
    if (batchColorState) return false;
    const snap = loadColorBatchState();
    if (!snap || !Array.isArray(snap.rows) || snap.rows.length === 0) return false;
    // 不同文件的待办不得互相接管
    if (snap.fileKey !== currentFileKey()) {
        console.warn(`⚠️ 持久化换色任务属于其它文件（${snap.fileKey || '(无文件名)'}），当前为 ${currentFileKey() || '(无文件名)'}，保留但不恢复`);
        return false;
    }
    const byRow = new Map((products || []).map(p => [p.row, p]));
    const queue = snap.rows.map(r => byRow.get(r)).filter(Boolean);
    // 产品缺失时不能 filter 后沿用旧 currentIndex：停下说明身份缺失，交用户处理
    if (queue.length !== snap.rows.length) {
        const missing = snap.rows.filter(r => !byRow.get(r));
        updateBatchColorStatus(`⚠️ 上次换色任务有 ${missing.length} 款不在当前 Excel（${missing.slice(0, 20).join(' ')}），未自动恢复。请确认文件是否一致`);
        showToast(`⚠️ 上次换色任务缺 ${missing.length} 款，未自动恢复：请确认 Excel 文件`);
        return false;
    }
    if (queue.length === 0) return false;
    batchColorState = {
        running: false,               // 恢复后保持暂停；需用户明确继续
        stopRequested: false,
        queue: queue.map((p, i) => ({ ...p, _idx: i })),
        currentIndex: Math.min(snap.currentIndex || 0, queue.length),
        successCount: snap.successCount || 0,
        failCount: snap.failCount || 0,
        startTime: snap.startTime || Date.now(),
        startRow: queue[0].row,
        lastAdvancedRow: null,
        lastProcessedTimestamp: 0,
        pollTimer: null,
        label: snap.label || '批量换色',
        failedRows: snap.failedRows || [],
        skippedRows: snap.skippedRows || [],
        lastMemMB: 0,
        batchId: snap.batchId || null,
        executionId: snap.executionId || null,
        fileFolder: snap.fileFolder || loadedFileName || '默认',
        fileKey: typeof snap.fileKey === 'string' ? snap.fileKey : currentFileKey(),
        inFlightRow: null,
        inFlightSince: 0,
        pendingAckRow: null,
        timedOutRows: [],
        retryOf: null,
        freshChatNext: false,
        supplementDone: false,
        pausedReason: /内存|提交额度|监测不可用|Failed to fetch/i.test(snap.pausedReason || '')
            ? '上次任务已暂停，等待你继续'
            : (snap.pausedReason || (snap.inFlightRow ? '刷新后恢复：等待在途款结束' : '刷新后恢复'))
    };
    if (snap.inFlightRow || snap.pendingAckRow) {
        const idx = queue.findIndex(p => p.row === (snap.inFlightRow || snap.pendingAckRow));
        if (idx >= 0) batchColorState.currentIndex = idx;
    }
    batchColorState.executionId = null;
    // 不要在这里清空 pausedReason：刷新后状态栏仍要能显示「额度已用完（预计 … 恢复）」，
    // 且 resumeColorBatch 靠它判断「额度暂停 → 继续时换新对话」。队列停在哪一款由 currentIndex 决定，与此无关。
    setColorTimeoutRows([]);
    refreshColorResumeRowsFromState();
    saveColorBatchState();
    showBatchColorProgress();
    updateBatchColorProgress();
    restoreBatchColorUI();
    updateBatchColorStatus('换色已暂停' + (batchColorState.pausedReason ? ` · ${batchColorState.pausedReason}` : ''));
    return true;
}


function refreshColorResumeRowsFromState() {
    setColorResumeRows(computeColorResumeRows());
}

function advanceBatchColorForRow(rowNum, source, msgBatchId, results, quota) {
    if (!batchColorState) return;
    // ① 任务标识校验：批量任务必须有标识，且必须匹配。
    //    缺标识的消息一律拒绝（旧任务同行的迟到消息不得冒充新任务完成）；
    //    单款任务不经过本函数（batchColorState 为空时已在上面返回），语义天然分开。
    if (!batchColorState.batchId) {
        console.warn(`🎨 当前没有批量任务标识，忽略 row${rowNum} 的完成消息 (${source})`);
        return;
    }
    if (!msgBatchId || msgBatchId !== batchColorState.batchId) {
        console.warn(`🎨 row${rowNum} 完成消息标识不匹配（收到 ${msgBatchId || '(缺失)'} / 当前 ${batchColorState.batchId}），已忽略 (${source})`);
        return;
    }
    // ①b 迟到完成：该行此前已判超时（待确认）→ 只提示，不重复入账
    if (getColorTimeoutRows().indexOf(rowNum) >= 0) {
        console.warn(`🎨 row${rowNum} 迟到完成（此前已判超时），仅提示不重复入账 (${source})`);
        showToast(`ℹ️ row${rowNum} 迟到完成（此前已判超时），请确认该款是否已生成`);
        return;
    }
    // ② 只接受当前执行行的完成；暂停清除此标识，旧完成不能入账。
    if (batchColorState.inFlightRow !== rowNum) {
        console.warn(`🎨 row${rowNum} 不是当前在途行(在途=${batchColorState.inFlightRow})，已忽略 (${source})`);
        return;
    }
    // ③ 同一行只推进一次（重复完成消息）
    if (batchColorState.lastAdvancedRow === rowNum) {
        console.log(`🎨 row${rowNum} 已推进过，跳过 (${source})`);
        return;
    }
    batchColorState.lastAdvancedRow = rowNum;
    batchColorState.inFlightRow = null;
    batchColorState.pendingAckRow = null;
    batchColorState.inFlightSince = 0;

    // ③b 豆包额度用完（内容脚本判定，quota 字段可选）：整批暂停，不是这一款失败。
    //     不记 failedRows（切号/等恢复后还要重跑本款）、不前进 currentIndex；继续时先重跑本款。
    //     暂停后先自动切到有额度的账号；所有账号都没额度才真的等恢复。
    if (quota && quota.exhausted) {
        if (batchColorState.currentTimeoutId) {
            clearTimeout(batchColorState.currentTimeoutId);
            batchColorState.currentTimeoutId = null;
        }
        // 停在本款：继续时先重跑它（而不是从别的失败款起跑）
        const quotaIdx = batchColorState.queue.findIndex(p => p.row === rowNum);
        if (quotaIdx >= 0) batchColorState.currentIndex = quotaIdx;
        const resumeAt = String(quota.resumeAt || '').trim();
        const reason = '豆包额度已用完' + (resumeAt ? `（预计 ${resumeAt} 恢复）` : '');
        console.warn(`⏸ row${rowNum} 豆包额度已用完，整批暂停 (${source})`);
        // 切号器不在（旧版页面/精简包）→ 退回原来的「暂停等恢复」
        if (typeof colorQuotaAutoSwitch === 'function') {
            colorQuotaAutoSwitch(rowNum, reason);
        } else {
            finishBatchColor(false, reason);
            showToast('⏸ ' + reason + '，整批已暂停');
        }
        return;
    }

    // ④ 结果判定：执行结束 ≠ 成功。四色目标必须逐项确认，部分完成按失败处理并保留可处理行
    const REQUIRED_COLORS = ['white', 'black', 'gray', 'navy'];
    const verdict = judgeColorTaskResult(results, rowNum);
    if (!verdict.ok) {
        console.warn(`⚠️ row${rowNum} 换色未完整成功：${verdict.reason}`);
        if (batchColorState.currentTimeoutId) {
            clearTimeout(batchColorState.currentTimeoutId);
            batchColorState.currentTimeoutId = null;
        }
        // 记失败 → 跳过 → 继续下一款，整批结束后统一补跑
        const skipRow = () => {
            if (!Array.isArray(batchColorState.failedRows)) batchColorState.failedRows = [];
            if (batchColorState.failedRows.indexOf(rowNum) < 0) {
                batchColorState.failedRows.push(rowNum);
                batchColorState.failCount++;
            }
            batchColorState.inFlightRow = null;
            batchColorState.pendingAckRow = null;
            batchColorState.inFlightSince = 0;
            batchColorState.executionId = null;
            batchColorState.currentTimeoutId = null;
            batchColorState.retryOf = null;
            batchColorState.currentIndex++;
            batchColorState.freshChatNext = true;   // 下一款先开新对话，防上一款的迟到图串款
            saveColorBatchState();
            refreshColorResumeRowsFromState();
            updateBatchColorProgress();
            showToast(`❌ row${rowNum} 换色失败（${verdict.reason}），已跳过（整批结束后补跑）`);
            console.log(`🎨 失败入账并跳过: row${rowNum} (${source})`);
            processNextBatchColor();
        };
        // ④a 一张图都没生成（不是额度的错）：先让后台给这个账号记一次「生成失败」。
        //     后台连续 3 次才会回 disabled:true → 走与额度完全相同的换号流程、重跑本款、不记失败；
        //     偶发失败后台只回 disabled:false（或记账不可用）→ 仍按原逻辑记失败跳过。
        //     部分出图（1~3 色）不算「不会生图」，不进这条分支。
        const downloads = Array.isArray(results && results.downloads) ? results.downloads : null;
        const noImage = !downloads || !downloads.some(d => d && d.ok === true);
        if (noImage && typeof colorGenFailReport === 'function' && colorGenFailReport(rowNum, verdict.reason, source, skipRow)) return;
        skipRow();
        return;
    }

    if (batchColorState.currentTimeoutId) {
        clearTimeout(batchColorState.currentTimeoutId);
        batchColorState.currentTimeoutId = null;
    }
    if ((batchColorState.failedRows || []).includes(rowNum)) {
        batchColorState.failedRows = batchColorState.failedRows.filter(row => row !== rowNum);
        batchColorState.failCount = Math.max(0, batchColorState.failCount - 1);
    }
    batchColorState.successCount++;
    batchColorState.currentIndex++;
    saveColorBatchState();

    // ⑤ 暂停中：只记录真实完成、刷新剩余列表，**不自动派发下一款**
    if (!batchColorState.running || batchColorState.stopRequested) {
        refreshColorResumeRowsFromState();
        updateBatchColorProgress();
        restoreBatchColorUI();
        if (batchColorState.currentIndex >= batchColorState.queue.length && !(batchColorState.failedRows || []).length) {
            finishBatchColor(true);
            return;
        }
        showToast(`✅ row${rowNum} 换色完成（任务暂停中，未自动派发下一款）`);
        console.log(`🎨 暂停中记录完成: row${rowNum} (${source})`);
        return;
    }

    updateBatchColorProgress();
    showToast(`✅ row${rowNum} 换色完成`);
    console.log(`🎨 推进批量换色: row${rowNum} (${source})`);

    setTimeout(() => {
        processNextBatchColor();
    }, 500);
}

// ===== 换号：额度命中 / 连续 3 次生成不出图（账号不支持生图）=====
// 两个触发条件共用同一条换号链路（同一套防重入、12 次上限、exclude 累积）：
//   ① 额度命中（内容脚本回传 quota）        ② 连续 3 次一张图都没生成（后台判 unsupported）
// 不做任何"试生图"探测：切号成功后直接重跑当前这一款真实任务 ——
//   出图          → 正常推进下一款
//   又弹额度/又不出图 → 把这个号记进「已试」列表，再换下一个号，重跑同一款
//   号都试完没成功 → 暂停，等恢复/加号后再继续
// 防重入只在「一次 doubaoAutoSwitch 请求期间」生效（请求结束立即清），
// 否则重跑后再次命中就进不来了，换号循环会卡死在第一个号上。
var colorAutoSwitchRunning = false;
var colorQuotaTriedAccounts = [];      // 本轮换号已试过的账号名（换批次/换文件时清零）
var colorQuotaAttempts = 0;            // 本轮换号次数（防死循环的硬上限）
var COLOR_QUOTA_SWITCH_LIMIT = 12;     // 一轮最多换 12 次号

// 账号账本类动作（扫描/选号/自动切号/生成结果记账）统一走这里：必须带 EXTENSION_ID，且每次判 lastError。
// 不设超时：扫 10 个号要 1.5~2.3 分钟，任何短超时都会把正在跑的扫描掐死。
function doubaoAccountMessage(action, payload) {
    return new Promise((resolve, reject) => {
        try {
            if (!EXTENSION_ID) throw new Error('尚未记录扩展 ID，请先连接扩展');
            if (typeof chrome === 'undefined' || !chrome.runtime || !chrome.runtime.sendMessage) throw new Error('扩展未连接');
            chrome.runtime.sendMessage(EXTENSION_ID, Object.assign({ action }, payload || {}), (response) => {
                const err = chrome.runtime.lastError;
                if (err) { reject(new Error(err.message || '扩展通道异常')); return; }
                if (!response) { reject(new Error('扩展没有响应')); return; }
                resolve(response);
            });
        } catch (e) { reject(e); }
    });
}

// 生成不出图（0 图 / 超时 / 结果为空）→ 请后台给该账号记一次失败，并问它是不是已经被判不可用。
// 只上报、不在页面侧数次数：阈值（连续 3 次）只由 background 判，页面只认 disabled:true。
// 返回 true  已接管：后台回了 disabled:true → 走与额度完全相同的换号流程（不记失败、重跑本款），
//                    或 disabled:false → 立刻走 fallback 记失败跳过；两种情况都由异步回调决定。
// 返回 false 本页没有可用通道 → 调用方按原逻辑记失败跳过。
function colorGenFailReport(rowNum, reason, source, fallback) {
    const state = batchColorState;
    if (!state) return false;
    if (typeof doubaoAccountMessage !== 'function') return false;
    const fallbackOnce = () => {
        if (batchColorState !== state) return;
        if (typeof fallback === 'function') fallback();
    };
    doubaoAccountMessage('doubaoGenResult', { ok: false, row: rowNum, reason: String(reason || '').slice(0, 120) })
        .then(res => {
            if (batchColorState !== state) return;
            if (res && res.disabled === true) {
                // 期间用户已停/已暂停 → 不接管（不能替用户继续跑）
                if (!state.running || state.stopRequested) { fallbackOnce(); return; }
                const name = String(res.name || '').trim();
                const streak = Number(res.streak) || 3;
                const line = `已连续 ${streak} 次生成失败，判定该账号不支持生图`
                    + (name ? `（${name}）` : '') + '，正在换号…';
                console.warn(`🔀 row${rowNum} ${line} (${source})`);
                colorQuotaAutoSwitch(rowNum, `已连续 ${streak} 次生成失败，判定该账号不支持生图`, { kind: 'genfail' });
                return;
            }
            fallbackOnce();
        }, err => {
            // 记账失败只是没拿到结论 → 不能因此卡住整批，照原逻辑记失败跳过
            console.warn(`账号生成失败记账失败（不影响换色主流程）：${(err && err.message) || err}`);
            fallbackOnce();
        });
    return true;
}

// 换号（kind='quota' 额度命中 / kind='genfail' 连续 3 次生成不出图）：先暂停（保留可恢复状态），
// 再异步换一个可用账号；换号成功就从当前款重跑。两种原因共用计数/上限/已试列表，日志文案分开。
// 中途不把当前款记进 failedRows：这不是这一款的错，换号/等恢复后都要重跑它。
function colorQuotaAutoSwitch(rowNum, reason, opts) {
    const state = batchColorState;
    if (!state) return;
    const o = opts || {};
    const kind = o.kind === 'genfail' ? 'genfail' : 'quota';
    // 暂停原因后缀：两种原因必须一眼能分开（额度 / 不支持生图），applyColorAutoSwitch 靠它认领结果
    const marker = kind === 'genfail' ? '，正在换号…' : '，正在查找有额度的账号…';
    if (colorAutoSwitchRunning) {
        console.log('🔀 上一轮换号请求还没返回，本次命中并入该轮（不重复切换）');
        return;
    }
    // 硬上限：连续换 12 个号都没成功，就不再空转，交回人工
    if (colorQuotaAttempts >= COLOR_QUOTA_SWITCH_LIMIT) {
        const tried = colorQuotaAttempts;
        colorQuotaTriedAccounts = [];
        colorQuotaAttempts = 0;
        const text = kind === 'genfail'
            ? `已尝试 ${tried} 个账号仍生成不出图（不支持生图），已暂停（可等恢复或加新账号后再继续）`
            : `已尝试 ${tried} 个账号仍无额度，已暂停（可等恢复或换号后继续）`;
        console.warn('🔀 ' + text);
        finishBatchColor(false, text);
        showToast('⏸ ' + text);
        return;
    }
    colorQuotaAttempts++;
    state.switchKind = kind;
    state.switchMarker = marker;
    finishBatchColor(false, reason + marker);
    showToast('⏸ ' + reason + '，整批已暂停' + marker);
    colorAutoSwitchRunning = true;
    const done = () => { colorAutoSwitchRunning = false; };
    // 已试过的号全部排除：切过又不可用的号不能再切回去（否则原地打转）
    const exclude = colorQuotaTriedAccounts.slice();
    if (state.lastSwitchAccount && exclude.indexOf(state.lastSwitchAccount) < 0) exclude.push(state.lastSwitchAccount);
    // quotaExhausted=false：连续 3 次生成不出图 ≠ 这个号没额度，别把它记成「额度用完」
    // （后台会把当前号记 exhausted；记错的话好号当天就不再当候选了）。只有额度命中才让它记。
    doubaoAccountMessage('doubaoAutoSwitch', { exclude, quotaExhausted: kind !== 'genfail' })
        .then(res => applyColorAutoSwitch(state, rowNum, res, null),
              err => applyColorAutoSwitch(state, rowNum, null, err))
        .then(done, done);
}

// 切号结果落地。用户已手动继续/批次已换 → 不接管。
function applyColorAutoSwitch(state, rowNum, res, err) {
    if (batchColorState !== state) return;
    if (state.running) return;
    const marker = String(state.switchMarker || '，正在查找有额度的账号…');
    if (String(state.pausedReason || '').indexOf(marker) < 0) return;
    const genFail = state.switchKind === 'genfail';
    const name = String((res && res.name) || '').trim();
    if (res && res.ok === true && name) {
        state.lastSwitchAccount = name;   // 只存内存：下次命中时也排除它
        if (colorQuotaTriedAccounts.indexOf(name) < 0) colorQuotaTriedAccounts.push(name);
        const line = `第 ${colorQuotaAttempts} 次换号${genFail ? '（不支持生图）' : ''}：已切到 ${name}，重跑 row${rowNum}`;
        console.log('🎨 ' + line);
        updateBatchColorStatus('🔀 ' + line);
        showToast(`🔀 已切到 ${name}，重跑 row${rowNum}`);
        restartColorBatchForRow(state, rowNum);
        return;
    }
    const base = String(state.pausedReason || '').replace(marker, '');
    const code = res && res.reason;
    const triedCount = colorQuotaTriedAccounts.length;
    let text;
    // 文案：额度暂停必须保留「额度」二字，生图暂停必须保留「不支持生图」——
    // resumeColorBatch 靠这两个词判断「继续时要换新对话 + 重跑本款」。
    if (genFail) {
        if (code === 'allExhausted') text = `所有账号均已判定不可用（不支持生图，已试 ${triedCount} 个号），已暂停（可等恢复或加新账号后再继续）`;
        else if (code === 'needLogin') text = '该账号不支持生图，且目标账号需要重新登录，请先在豆包登录后继续';
        else if (code === 'busy') text = '豆包正在生成中，稍后点继续（当前账号仍判定不支持生图）';
        else text = base + `；自动换号失败（已试 ${triedCount} 个号）：` + ((res && res.error) || (err && err.message) || '未知原因');
    } else if (code === 'allExhausted') text = `所有账号额度均已用完（已试 ${triedCount} 个号），已暂停（可等恢复或加新账号后再继续）`;
    else if (code === 'needLogin') text = '豆包额度已用完，且目标账号需要重新登录，请先在豆包登录后继续';
    else if (code === 'busy') text = '豆包正在生成中，稍后点继续（当前账号额度仍用完）';
    else text = base + `；自动切号失败（已试 ${triedCount} 个号）：` + ((res && res.error) || (err && err.message) || '未知原因');
    // 失败即收尾：计数清零，下一次命中重新开一轮（成功分支不清，计数就是本轮换号次数）
    colorQuotaTriedAccounts = [];
    colorQuotaAttempts = 0;
    state.switchMarker = '';
    state.switchKind = '';
    console.warn('🔀 自动切号未成功：' + text);
    finishBatchColor(false, text);
    showToast('⏸ ' + text);
}

// 换号成功：换新 batchId、置 freshChatNext（旧对话里还留着额度气泡）、从本款重新派发。
function restartColorBatchForRow(state, rowNum) {
    const idx = state.queue.findIndex(p => p.row === rowNum);
    if (idx >= 0) state.currentIndex = idx;
    if (state.currentTimeoutId) { clearTimeout(state.currentTimeoutId); state.currentTimeoutId = null; }
    setColorTimeoutRows([]); state.timedOutRows = [];
    state.inFlightRow = null; state.pendingAckRow = null; state.inFlightSince = 0;
    state.executionId = null;
    state.lastAdvancedRow = null;
    state.batchId = 'bc_' + Date.now() + '_' + Math.random().toString(36).slice(2);
    state.pausedReason = '';
    state.freshChatNext = true;
    state.stopRequested = false;
    state.running = true;
    saveColorBatchState();
    showBatchColorProgress();
    updateBatchColorProgress();
    startBatchColorPolling();
    sendNextBatchColor();
}

// 结果判定：只有四色全部下载成功才算成功；否则给出缺失/失败原因
function judgeColorTaskResult(results, rowNum) {
    const REQUIRED = ['white', 'black', 'gray', 'navy'];
    if (!results) return { ok: false, reason: '无执行结果（未收到结果字段）' };
    if (results.error) return { ok: false, reason: `执行报错：${results.error}` };
    const downloads = Array.isArray(results.downloads) ? results.downloads : null;
    if (!downloads) return { ok: false, reason: '缺少下载明细' };
    const got = {};
    for (const d of downloads) {
        const m = String(d && d.filename || '').match(/^row(\d+)_(white|black|gray|navy)\.(?:png|jpe?g)$/i);
        if (m && Number(m[1]) === Number(rowNum) && d.ok) got[m[2].toLowerCase()] = true;
    }
    const missing = REQUIRED.filter(c => !got[c]);
    if (missing.length > 0) {
        const okCount = REQUIRED.length - missing.length;
        return { ok: false, reason: `仅成功 ${okCount}/4 色，缺失：${missing.join('/')}` };
    }
    return { ok: true };
}

// 切换文件暂停原任务，保留当前款，避免新文件接管。
function handleColorFileSwitched(req) {
    const to = (req && req.to) || '';
    // 换文件：额度换号的已试账号与次数作废（新文件是新一轮，不能带着旧结论）
    colorQuotaTriedAccounts = [];
    colorQuotaAttempts = 0;
    if (!batchColorState) return;
    const toKey = to ? String(to).replace(/[^a-zA-Z0-9\u4e00-\u9fff]/g, '_') + '__' : '';
    if (toKey === batchColorState.fileKey) return;
    if (!batchColorState.running && !batchColorState.inFlightRow) return;
    finishBatchColor(false);
}

// ===== 套图（快速五图）：移植参考扩展 pages/doubao/quick-five.js 的组装规则 =====
// 核心：把 5 个单图步骤合成【一次】请求（一次发送 → 一步生成 5 张），不逐张发送。
const SUITE_OUTPUTS = [['111', '卖点图'], ['222', '袖口图'], ['333', '面料图'], ['444', '白底图'], ['666', '领口图']];

// 防重复点击：同一时间只允许一个套图任务在预检/创建中
let suiteTaskRunning = false;
// 状态栏归属：运行中任务的身份（fileKey::rowNum）。跨产品时任务状态不得唤醒

let suiteStatusOwner = null;
const suiteTaskIdentities = new Map();

let suiteAutoState = null;
function readSuiteAutoState() {
    if(suiteAutoState)return suiteAutoState;
    try{const value=JSON.parse(localStorage.getItem('polo_suite_auto_v1')||'null');if(value&&value.taskId&&value.fileKey&&Number.isInteger(value.rowNum))suiteAutoState=value;}catch(_){}
    return suiteAutoState;
}
function saveSuiteAutoState(state) {
    localStorage.setItem('polo_suite_auto_v1',JSON.stringify(state));suiteAutoState=state;renderSuiteAutoControls();
}
function renderSuiteAutoControls() {
    const state=readSuiteAutoState();
    let banner=document.getElementById('suiteGlobalProgress');
    if(!banner){
        banner=document.createElement('div');banner.id='suiteGlobalProgress';
        banner.style.cssText='position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:9990;display:none;align-items:center;gap:16px;max-width:calc(100vw - 32px);padding:12px 18px;border:1px solid #b5a3db66;border-radius:14px;background:#393249;color:#f5efff;box-shadow:0 8px 30px #17102455;font-size:13px';

        button.onclick=()=>{
            const task=readSuiteAutoState();if(!task)return;

            document.getElementById('suiteAutoControls')?.scrollIntoView({block:'center',behavior:'smooth'});
        };
        banner.append(button);document.body.append(banner);
    }
    const active=state&&state.phase!=='completed';
    banner.style.display=active?'flex':'none';
    if(active){
        const phases={preparing:'准备中',generating:'生成中',processing:'后处理中',saving:'保存中',error:'处理未完成'};
        // 指定重生成只跑部分步骤：标题和分母都要跟着变，不能显示成整套套图
        const bannerGoal=Number(state.total)||((typeof targetedRegenerationRunning!=='undefined'&&targetedRegenerationRunning)?1:5);
        const bannerKind=(typeof targetedRegenerationRunning!=='undefined'&&targetedRegenerationRunning)?'指定重生成':'套图任务';
        banner.firstElementChild.textContent=`${bannerKind} · 行${state.rowNum} · ${state.paused?'已暂停 · ':''}${phases[state.phase]||'未完成'} · ${state.done||0}/${bannerGoal}`;
    }

    const relevant=state&&currentProduct&&state.fileKey===currentFileKey()&&state.rowNum===currentProduct.row;
    box.style.display=relevant?'flex':'none';if(!relevant)return;
    const labels={preparing:'准备中',generating:'生成中',processing:'后处理中',saving:'保存中',completed:'已完成',error:'处理未完成'};
    const label=labels[state.phase]||'准备中';
    const total=state.total||5;
    const text=document.getElementById('suiteAutoProgress');if(text)text.textContent=`${state.phase==='completed'?'✅':state.paused?'⏸':'⏳'} ${state.paused?(suiteTaskRunning?'暂停中 · ':'已暂停 · '):''}${label}${state.currentKey?' · '+state.currentKey:''} · ${state.done||0}/${total}`;
    const button=document.getElementById('suiteAutoToggle');if(button){button.style.display=state.phase==='completed'?'none':'';button.textContent=state.paused||!suiteTaskRunning?'▶ 继续':'⏸ 暂停';}
}
window.PoloRecycleTask=async function(kind){
    if(kind==='suite'||kind==='suiteBatch'){
        const state=readSuiteAutoState();
        if(state&&state.taskId){try{await suiteSend('suiteCancel',{taskId:state.taskId,reason:'用户回收进度'});}catch(_){}}
        try{localStorage.removeItem('polo_suite_auto_v1');}catch(_){}
        suiteAutoState=null;renderSuiteAutoControls();
        if(kind==='suiteBatch'){
            try{localStorage.removeItem('polo_suite_batch_v1');}catch(_){}
            if(typeof suiteBatchState!=='undefined')suiteBatchState={fileKey:currentFileKey(),rows:[],index:0,paused:true,completed:true,recycled:true};
        }
    }else if(kind==='publish'||kind==='publishImage'){
        try{chrome.runtime.sendMessage(EXTENSION_ID,{action:'discardPublishTask'},()=>{void chrome.runtime.lastError;refreshPublishState();});}catch(_){refreshPublishState();}
    }else if(kind==='color'){
        const btn=document.getElementById('batchColorToggleBtn');if(btn&&!btn.disabled&&typeof batchColorState!=='undefined'&&batchColorState&&batchColorState.running)btn.click();
        try{setColorResumeRows([]);}catch(_){}
        if(typeof batchColorState!=='undefined'){batchColorState=null;try{saveColorBatchState();}catch(_){}}
        try{localStorage.removeItem('polo_color_batch_state');localStorage.removeItem('polo_color_batch_state::'+currentFileKey());}catch(_){}
        if(typeof updateBatchColorStatus==='function')updateBatchColorStatus('已回收');
        if(typeof restoreBatchColorUI==='function')restoreBatchColorUI();
    }
};
function suiteAutoCheckpoint(taskId,phase,done) {
    const state=readSuiteAutoState();if(!state||state.taskId!==taskId)return true;
    saveSuiteAutoState({...state,phase,done,total:SUITE_FIVE_TOTAL});
    if(state.paused){updateSuiteStatus('⏸ 套图已暂停，结果已保留；点击继续，不会重新生图');return false;}
    updateSuiteStatus(`⏳ 套图自动处理 · ${done}/${SUITE_FIVE_TOTAL} · ${phase==='processing'?'后处理':'保存'}`);return true;
}
async function cancelSuiteProductTasks(state) {
    const active = await suiteSend('suiteListTasks', {fileKey:state.fileKey,rowNum:state.rowNum,activeOnly:true});
    if (!active.ok) throw Error(active.error || '无法读取待停止的套图任务');
    for (const task of active.tasks || []) {
        const result = await suiteSend('suiteCancel', {taskId:task.taskId,reason:'用户暂停当前套图'});
        if (!result.ok) throw Error(result.error || '套图停止失败');
    }
}
async function toggleSuiteAuto() {
    const state=readSuiteAutoState();if(!state||state.phase==='completed')return;
    if(!currentProduct||state.fileKey!==currentFileKey()||state.rowNum!==currentProduct.row){showToast('请切回该任务产品后继续');return;}
    if(!state.paused&&suiteTaskRunning){saveSuiteAutoState({...state,paused:true});await cancelSuiteProductTasks(state).catch(e=>showToast(e.message));updateSuiteStatus('⏸ 已暂停；点击继续从当前产品整套重新生成（五张全部重做）');return;}
    if(suiteTaskRunning){showToast('当前套图正在停止，请稍后点击继续');return;}
    // 必须先在点击手势内申请目录权限，再进行任何异步任务读取。
    if(typeof ensurePsDirPermission==='function')await ensurePsDirPermission();
    saveSuiteAutoState({...state,paused:false});
    if(typeof suiteBatchState!=='undefined'&&suiteBatchState&&!suiteBatchState.completed&&
        suiteBatchState.fileKey===state.fileKey&&suiteBatchState.rows[suiteBatchState.index]===state.rowNum){
        await runSuiteBatch();return;
    }
    if(!suiteTaskRunning)await resumeSuiteAuto();
}
async function resumeSuiteAuto() {
    if(suiteTaskRunning)return;
    const state=readSuiteAutoState();if(!state||state.paused||state.phase==='completed')return;
    if(!currentProduct||state.fileKey!==currentFileKey()||state.rowNum!==currentProduct.row)return;
    // “继续”= 从当前产品整套重做：五张全部重新生成，不沿用旧图（用户确认的语义）。
    await runSuiteFiveJob({ keys: SUITE_STEP_KEYS, restart: true });
}
async function waitSuiteAutoImages(taskId) {
    const deadline=Date.now()+900000;
    while(Date.now()<deadline){
        const r=await suiteSend('suiteGetTask',{taskId,summary:true});const task=r.task;
        if(!r.ok||!task)throw Error(r.error||'任务记录丢失');
        if(task.stage==='acquired'){const full=await suiteSend('suiteGetTask',{taskId});if(!full.ok||!full.task)throw Error('结果读取失败');return full.task;}
        if(task.stage==='completed')return task;
        if(task.cancelled||['failed','interrupted','generated'].includes(task.stage))throw Error(task.error||'任务已中断或已结束；请点继续按磁盘现状续跑');
        await new Promise(resolve=>setTimeout(resolve,2000));
    }
    throw Error('等待生成超时，任务已保留，继续时只读取已有任务');
}


const SuiteQuickFive = (() => {
    function normalizePrompt(resolved) {
        return String(resolved || '')
            .replace(/\[(?:MODAL_INSTRUCTION|EXECUTE_ONLY)\]/g, '')
            .replace(/(?:只|仅)(?:能|允许)?生成[一1]张(?:纯)?(?:图片|图像|图)[。.!！]?/g, '本段只描述这一张图片。')
            .replace(/(?:只|仅)(?:能|允许)?输出[一1]张(?:图片|图像|图)[。.!！]?/g, '本段只描述这一张图片。')
            .replace(/\b(?:generate|output)\s+only\s+(?:one|1)\s+(?:image|picture)\b[.!]?/gi, 'This section describes one of the five images.')
            .replace(/生成一张纯图片[。.!！]?/g, '这张图片为纯图片。')
            .trim();
    }

    async function build(steps, resolvePrompt) {
        const prompts = [];
        const outputKeys = [];
        const filenames = new Set();
        let model = null, ratio = null;
        for (const [key, name] of SUITE_OUTPUTS) {
            const matches = (steps || []).filter(step => (step.outputKeys || []).some(o =>
                (typeof o === 'string' ? o : o.key).trim() === key));
            if (matches.length !== 1) throw new Error(`快速生成缺少或重复配置：${key} ${name}`);
            const step = matches[0];
            const output = step.outputKeys.find(o => (typeof o === 'string' ? o : o.key).trim() === key);
            outputKeys.push(typeof output === 'string' ? { key, postprocess: null } : { ...output, key });
            if (!step.prompt || !step.prompt.trim()) throw new Error(`${name}提示词为空`);
            const stepModel = step.model || '5.0';
            const stepRatio = step.ratio || '1:1';
            if (model && (model !== stepModel || ratio !== stepRatio)) {
                throw new Error('五张快速生成要求五个步骤的模型与比例一致');
            }
            model = stepModel; ratio = stepRatio;
            for (const upload of step.uploads || []) {
                if (upload.type === 'none') continue;
                if (upload.type !== 'current_file') throw new Error(`${name}包含外部或随机参考图，快速生成仅支持当前套装参考图`);
                for (const f of upload.filenames) filenames.add(String(f).trim());
            }
            const resolved = await resolvePrompt(step);
            prompts.push(`${prompts.length + 1}、步骤${prompts.length + 1}\n${normalizePrompt(resolved)}`);
        }
        if (!filenames.size) throw new Error('快速生成未配置当前套装参考图');
        return {
            name: '五张快速生成', expectCount: 5, model, ratio,
            uploads: [{ type: 'current_file', filenames: [...filenames] }],
            outputKeys, promptResolved: true, combinedFive: true,
            prompt: '五张图合并生成：\n请根据提示词来生成五张图片\n\n' + prompts.join('\n\n')
        };
    }

    function validateImages(images) {
        if (!Array.isArray(images) || images.length !== 5 || new Set(images).size !== 5
            || images.some(u => typeof u !== 'string' || !u.trim())) {
            throw new Error(`快速生成必须返回五张不同图片，实际 ${images ? images.length : 0} 张`);
        }
        return true;
    }

    return { build, validateImages, normalizePrompt };
})();


// 行数据快照解析：传入行快照（含 cell）直接使用；传入产品对象/行号时用当前导入 Excel 现场冻结。
// 提示词与后处理都走这里拿同一份行数据，避免「提示词读界面行、后处理读任务行」。
function suiteRowSnapshot(input) {
    if (input && typeof input.cell === 'function') return input;
    const row = (input && typeof input === 'object') ? input.row : input;
    if (row === undefined || row === null || row === '') throw new Error('缺少产品行号，无法读取 Excel 行数据');
    return buildExcelRowSnapshot(row);
}

// 提示词变量渲染：与配置面板 CustomStepConfig.renderPrompt 共用【同一实现、同一行快照、同一套真实 Excel 列名】。
// 页面与面板共用CategoryFieldRules固定字段规则，不再维护第二套可编辑映射。
function suiteRenderPrompt(step, input) {
    const api = window.CustomStepConfig;
    if (!api || typeof api.renderPrompt !== 'function') throw new Error('缺少步骤配置模块（custom-step-config.js），无法渲染提示词');
    return api.renderPrompt(step, suiteRowSnapshot(input));
}

function renderSuitePrompt(step, input) {

}

// 执行用的步骤 = 面板按【该行类目】保存的步骤（唯一真源），与「预览」看到的是同一份配置。

    if (!api || typeof api.stepsForCategory !== 'function') throw new Error('缺少步骤配置模块（custom-step-config.js），无法取步骤配置');

function updateSuiteStatus(text) {
    // 跨产品门控：运行中任务属于其它行时，不更新/不弹出当前产品的套图区
    const owner = (typeof suiteStatusOwner !== 'undefined') ? suiteStatusOwner : null;
    const cur = currentFileKey() + '::' + ((currentProduct && currentProduct.row) || '');
    if (owner && owner !== cur) return;
    const el = document.getElementById('suiteStatusText');
    if (el) el.textContent = text || '';
    const area = document.getElementById('suiteImagesArea');
    // 空 grid 且无任务在跑 → 不显示（避免失败收尾把空区弹出来占位置）

// ===== 套图素材预检：发往豆包前必须全部通过（有路径 ≠ 有图片） =====
// 页面自己的「产品原图目录」句柄（PS 编辑流程保存过，见 psEditDirHandle）。句柄在、但 FSA 授权是
// 会话级的：页面刷新后会回落为 prompt，且扩展后台没有用户手势、不能代申请，所以必须在点击手势里就地恢复。
function psDirHandleRef() {
    try { return (typeof psEditDirHandle !== 'undefined' && psEditDirHandle) ? psEditDirHandle : null; }
    catch (_) { return null; }
}

// 只能在用户点击（「生成套图」）的手势窗口内调用；不弹二级界面，只出现浏览器自己的权限确认。
async function ensurePsDirPermission() {
    if(typeof PageDirectories!=='undefined'){
        try{const permissions=await PageDirectories.permissions();return {ok:permissions.every(p=>p==='granted'),reason:permissions.some(p=>p!=='granted')?'请在页面路径配置确认目录授权':''};}
        catch(e){return {ok:false,reason:e.message};}
    }
    const dir = psDirHandleRef();
    if (!dir) return { ok: false, reason: '页面没有保存过产品原图目录句柄' };
    try {
        // requestPermission 必须在点击手势里最先调用：先 await queryPermission 会丢失用户激活，
        // Chrome 会抛 "User activation is required to request permissions"。
        // 已授权时 requestPermission 直接返回 granted，不会重复弹窗。
        const granted = await dir.requestPermission({ mode: 'readwrite' });
        if (granted === 'granted') return { ok: true, permission: granted };
        return { ok: false, needsPermission: true, permission: granted, reason: '产品原图目录权限未授予（当前 ' + granted + '）' };
    } catch (e) { return { ok: false, needsPermission: true, reason: (e && e.message) || '申请产品原图目录权限失败' }; }
}

// 直读当前行原图：file:// 页面既 fetch 不到本地图片（Failed to fetch），也不能把 <img> 画进 canvas
// （Tainted canvases），所以只能走页面自己已授权的目录句柄，不绕扩展弹窗、不需要重新选择目录。
async function readSuiteMainImageFromPsDir(rowNum) {
    const dir = psDirHandleRef();
    if (!dir) return { ok: false, reason: '页面没有产品原图目录句柄，无法直读原图' };
    try {
        if (await dir.queryPermission({ mode: 'readwrite' }) !== 'granted') {
            return { ok: false, reason: '产品原图目录权限未确认（点击「生成套图」时会自动申请）' };
        }
    } catch (e) { return { ok: false, reason: '产品原图目录权限检查失败：' + ((e && e.message) || '') }; }
    for (const ext2 of ['jpg', 'png', 'jpeg', 'webp']) {
        try {
            const fh = await dir.getFileHandle(`row${rowNum}_main.${ext2}`);
            const f = await fh.getFile();
            if (!f || !f.size) continue;
            const dataUrl = await suiteBlobToDataUrl(f);
            const p = await probeSuiteImage('主图', dataUrl);
            return p.ok ? { ok: true, dataUrl, probe: p } : { ok: false, reason: p.error };
        } catch (e) {
            if (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')) return { ok: false, reason: '产品原图目录读取被拒绝：' + ((e && e.message) || '') };
        }
    }
    return { ok: false, reason: `产品原图目录里没有 row${rowNum}_main.*` };
}

async function probeSuiteImage(label, url) {
    if (!url) return { ok: false, error: `${label}：没有可用的图片来源` };
    try {
        const resp = await fetch(url, { cache: 'no-store' });
        if (!resp.ok) return { ok: false, error: `${label}：读取失败 HTTP ${resp.status}` };
        const blob = await resp.blob();
        if (!blob || blob.size === 0) return { ok: false, error: `${label}：文件为空` };
        if (!/^image\/(png|jpeg|jpg|webp|bmp)$/i.test(blob.type || '')) {
            return { ok: false, error: `${label}：不是位图（${blob.type || '未知类型'}）` };
        }
        const bmp = await createImageBitmap(blob);
        const w = bmp.width, h = bmp.height;
        if (typeof bmp.close === 'function') bmp.close();
        if (!(w >= 64 && h >= 64)) return { ok: false, error: `${label}：尺寸无效 ${w}×${h}` };
        return { ok: true, bytes: blob.size, width: w, height: h, type: blob.type };
    } catch (e) {
        return { ok: false, error: `${label}：无法解码（${e && e.message}）` };
    }
}

// 按「源表文件标识 + 产品行号」取当前产品素材，不依赖全局最后一次生成
async function resolveSuiteAssets(product) {
    const fileKey = currentFileKey();
    const assets = {};
    const problems = [];
    // 与颜色图同源：都优先用 Excel 提取图 extracted_images/rowN_main.*（实际多为 .png）。
    // 按扩展名逐个试，绝不写死 .jpg —— 写死会导致探测必然失败、静默改用另一个目录的图。
    const mainCandidates = [];
    if (product.imagePath) mainCandidates.push(product.imagePath);
    for (const ext of ['png', 'jpg', 'jpeg', 'webp']) mainCandidates.push('extracted_images/row' + product.row + '_main.' + ext);
    let mainUrl = '', probe = { ok: false };
    for (const candidate of mainCandidates) {
        const url = (typeof SuiteRuntime !== 'undefined') ? SuiteRuntime.imageUrl(candidate) : candidate;
        const got = await probeSuiteImage('主图', url);
        if (got.ok) { mainUrl = url; probe = got; break; }
        probe = got;
        // 文件本身存在但不可用（尺寸过小/不是位图）→ 停止换候选，直接把它报出来；
        // 只有「这个扩展名没有这个文件」才继续试下一个扩展名。
        if (!/HTTP 40[34]|Failed to fetch|ERR_FILE_NOT_FOUND|没有可用的图片来源/.test(String(got.error || ''))) { mainUrl = url; break; }
    }
    if (!mainUrl) mainUrl = (typeof SuiteRuntime !== 'undefined') ? SuiteRuntime.imageUrl(mainCandidates[0]) : mainCandidates[0];
    let pageReadReason = '';
    // 首选：用页面自己的「产品原图目录」句柄直读同一行（在点击手势里已恢复授权，不再需要扩展弹窗授权）。
    // typeof 守卫：本函数被单测按函数切片隔离运行时，该助手不在切片内，此时走下面的扩展后备路径。
    if (!probe.ok && typeof readSuiteMainImageFromPsDir === 'function') {
        const pageRead = await readSuiteMainImageFromPsDir(product.row);
        if (pageRead.ok) { probe = pageRead.probe; mainUrl = pageRead.dataUrl; }
        else pageReadReason = pageRead.reason || '';
    }
    // 后备：由扩展侧读同一行（仍可用，但需要扩展自己的原图目录授权）。
    if (!probe.ok && extensionInstalled) {
        for (const ext of ['jpg', 'png', 'jpeg', 'webp']) {
            const response = await suiteSend('readPsImage', { fileName: `row${product.row}_main.${ext}` });
            if (response.ok && (response.dataUrl || response.data)) {
                const dataUrl = response.dataUrl || await suiteBlobToDataUrl(new Blob([new Uint8Array(response.data)], { type: response.type || 'image/jpeg' }));
                const candidate = await probeSuiteImage('主图', dataUrl);
                if (candidate.ok) { probe = candidate; mainUrl = dataUrl; break; }
            }
            if (response.error && /权限|授权|未配置/.test(response.error)) {
                probe = { ok: false, error: `${probe.error}；${response.error}` };
                break;
            }
        }
    }
    if (!probe.ok && /_main\.jpg$/i.test(mainUrl)) {
        const pngUrl = mainUrl.replace(/_main\.jpg$/i, '_main.png');
        const p2 = await probeSuiteImage('主图', pngUrl);
        if (p2.ok) { probe = p2; mainUrl = pngUrl; }
    }
    if (probe.ok) assets.main = Object.assign({ color: 'main', url: mainUrl, fileKey, row: product.row }, probe);
    else problems.push(pageReadReason ? `${pageReadReason}；原图路径读取失败（${probe.error}）` : probe.error);

    for (const color of ['white', 'black', 'gray', 'navy']) {
        let url = (typeof getColorImagePath === 'function') ? getColorImagePath(product.row, color) : null;
        let p = await probeSuiteImage(color, url);
        if (!p.ok && extensionInstalled) {
            const dataUrl = await new Promise((res) => {
                try {
                    chrome.runtime.sendMessage(EXTENSION_ID, { action: 'getColorImage', rowNum: product.row, color, fileKey }, (r) => res(r && r.ok ? r.dataUrl : null));
                } catch (_) { res(null); }
            });
            if (dataUrl) { const p2 = await probeSuiteImage(color, dataUrl); if (p2.ok) { p = p2; url = dataUrl; } }
        }
        if (p.ok) assets[color] = Object.assign({ color, url, fileKey, row: product.row }, p);
        else problems.push(p.error);
    }
    return { assets, problems, fileKey };
}

// 变量解析校验：任何未解析的 {变量} 都要在发送前失败并指明步骤（与面板「预览」同一实现）
function checkSuiteVariables(steps, input) {
    const problems = [];
    let snapshot;
    try { snapshot = suiteRowSnapshot(input); }
    catch (e) { return [`无法读取当前产品行数据：${e.message}`]; }
    for (const [key, name] of SUITE_OUTPUTS) {
        const step = (steps || []).find(s => String(s.key || '') === key
            || (s.outputKeys || []).some(o => (typeof o === 'string' ? o : o.key).trim() === key));
        if (!step) { problems.push(`${key} ${name}：缺少该编号的步骤配置`); continue; }
        let rendered;
        try { rendered = suiteRenderPrompt(step, snapshot); }
        catch (e) { problems.push(`${name}：提示词渲染失败 ${e.message}`); continue; }
        if (rendered.missing.length) problems.push(`${name}：未解析变量 ${rendered.missing.join(' ')}`);
    }
    return problems;
}

async function prepareSuiteAssets(assets) {
    return Promise.all(Object.values(assets).map(async a => {
        const response = await fetch(a.url);
        if (!response.ok) throw new Error('素材读取失败：' + a.color);
        const blob = await response.blob();
        const url = await new Promise((resolve, reject) => { const r = new FileReader(); r.onload = () => resolve(r.result); r.onerror = () => reject(r.error); r.readAsDataURL(blob); });
        return Object.assign({}, a, { url, filename: `row${a.row}_${a.color}.png` });
    }));
}
async function suiteDecodeSize(blob) {
    const b = await createImageBitmap(blob);
    try { return { width: b.width, height: b.height }; } finally { if (b.close) b.close(); }
}
async function suiteContentHash(blob) {
    const bytes = await crypto.subtle.digest('SHA-256', await blob.arrayBuffer());
    return Array.from(new Uint8Array(bytes), b => b.toString(16).padStart(2, '0')).join('');
}
// 输出目录句柄只存在于扩展源，页面无法直接写盘；图片数据经 base64 交给扩展由其实施写入与回读校验。
function suiteBlobToDataUrl(blob) {
    return new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => resolve(r.result);
        r.onerror = () => reject(r.error || new Error('结果图片读取失败'));
        r.readAsDataURL(blob);
    });
}
async function suiteProgressChecked(report) {
    const r = await suiteSend('suiteProgress', { report });
    if (!r.ok) throw new Error(r.error || '任务状态未保存');
    return r.task;
}
async function assertSuiteTaskActive(taskId, fileKey, rowNum) {
    const r = await suiteSend('suiteGetTask', { taskId });
    if (!r.ok || !r.task || r.task.cancelled || ['failed','interrupted','completed'].includes(r.task.stage) || r.task.fileKey !== fileKey || r.task.rowNum !== rowNum) throw new Error('任务已取消、中断或身份不符，停止写入');
    return r.task;
}
async function persistSuitePending(pending) {
    const candidates = [];
    for (const c of pending.candidates) {
        let blob = c.blob;
        if (!blob) { const r = await fetch(c.url); if (!r.ok) throw new Error('候选图缓存失败'); blob = await r.blob(); c.blob = blob; }
        await suiteDecodeSize(blob);
        candidates.push(Object.assign({}, c, { blob }));
    }
    await SuiteCore.ResultStore('polo_suite_pending').put({ fileKey: pending.fileKey, rowNum: pending.rowNum, key: 'pending', taskId: pending.taskId, meta: { pending: Object.assign({}, pending, { candidates }) } });
}

// 统一消息封装：带超时与"扩展上下文失效"的真实提示，不无限重试
function suiteSend(action, payload, timeoutMs = 8000) {
    return new Promise((resolve) => {
        let done = false;
        const timer = setTimeout(() => { if (!done) { done = true; resolve({ ok: false, error: '扩展未响应（超时）' }); } }, timeoutMs);
        try {
            if (payload && payload.report) {
                const identity = suiteTaskIdentities.get(payload.report.taskId);
                if (identity) payload = Object.assign({}, payload, { report: Object.assign({}, identity, payload.report) });
            }
            chrome.runtime.sendMessage(EXTENSION_ID, Object.assign({ action }, payload || {}), (resp) => {
                if (done) return;
                done = true; clearTimeout(timer);
                if (chrome.runtime.lastError) { resolve({ ok: false, error: chrome.runtime.lastError.message }); return; }
                if (resp && resp.task) suiteTaskIdentities.set(resp.task.taskId, { fileKey: resp.task.fileKey, rowNum: resp.task.rowNum });
                if (resp && resp.tasks) resp.tasks.forEach(t => suiteTaskIdentities.set(t.taskId, { fileKey: t.fileKey, rowNum: t.rowNum }));
                resolve(resp || { ok: false, error: '空响应' });
            });
        } catch (e) {
            if (!done) { done = true; clearTimeout(timer); resolve({ ok: false, error: '扩展上下文失效，请刷新本页：' + (e && e.message) }); }
        }
    });
}

// 整套与单图共用执行入口；整套一次请求五张，单图按指定编号生成。
// 语义与面板一致：预览 = 未保存草稿；执行 = 任务启动时冻结的配置与行快照。
// 字段、原图与保存目录共用同一配置，任务开始时冻结。
const SUITE_WIRED_STEP_KEY = '222';

// 一键生成套图：整套一次请求，按输出顺序自动后处理和保存。
// 继续 = 从当前产品整套重做（用户确认的语义）：五张全部重新生成，不复用旧图。
async function startSuiteGeneration() {
    if(typeof targetedRegenerationRunning!=='undefined'&&targetedRegenerationRunning)return showToast("指定重生成正在执行，请先等待完成");
    const existing=readSuiteAutoState();
    if(existing&&existing.phase!=='completed'){
        if(existing.fileKey!==currentFileKey()||existing.rowNum!==currentProduct?.row){renderSuiteAutoControls();showToast('已有未完成套图任务，请点击顶部「查看任务」继续');return;}
        // 有任务记录就进入继续分支；继续语义是整套重做（resumeSuiteAuto → restart），五张全部重来。
        if(['preparing','generating','processing','saving','error'].includes(existing.phase)){
            const five=await readSuiteFive(existing.fileKey,existing.rowNum);
            if(five&&five.main&&five.main.dataUrl){saveSuiteAutoState({...existing,paused:false});return resumeSuiteAuto();}
        }
        // 没有冻结数据（例如预检阶段就失败）：只能按新任务重新发起。
    }
    // 重做会重新读当前产品主图，因此同样要先申请原图读取权限。
    const perm = await ensurePsDirPermission();
    if (!perm.ok && perm.reason) console.warn('产品原图目录授权未恢复：' + perm.reason);
    return runSuiteFiveJob({ keys: SUITE_STEP_KEYS });
}

async function runSuiteSingleStep(key) {
    const perm = await ensurePsDirPermission();
    if (!perm.ok && perm.reason) console.warn('产品原图目录授权未恢复：' + perm.reason);
    return runSuiteFiveJob({ keys: [String(key || '').trim()] });
}

async function runSuiteJob(keys, {automatic=false,targeted=false} = {}) {
    if(typeof targetedRegenerationRunning!=='undefined'&&targetedRegenerationRunning&&!targeted)return showToast("指定重生成正在执行");
    if (suiteTaskRunning) return null;
    window.UnifiedTaskStarted?.();
    const product = currentProduct;
    if (!product || !product.row) { showToast('❌ 请先导入 Excel 并选择一个产品'); return null; }
    if(!Array.isArray(keys)||![1,5].includes(keys.length)||new Set(keys).size!==keys.length||keys.some(k=>!['111','444','222','333','666'].includes(k))){showToast('❌ 输出编号配置无效');return null;}
    suiteStatusOwner = currentFileKey() + '::' + product.row;
    const outKey=keys[0],expectCount=keys.length;
    const hit = SUITE_OUTPUTS.find(o => o[0] === outKey);
    const stepName = expectCount===5?'五张产品套图':(hit ? hit[1] : outKey);

    const btn = document.getElementById('suiteGenBtn');
    suiteTaskRunning = true;
    if (btn) { btn.disabled = true; btn.textContent = '⏳ 预检中...'; }
    try {
        const fileKey = currentFileKey();
        const rowNum = product.row;

        // ① 行快照 + 步骤（唯一真源：面板按该类目保存的配置）
        const spec = excelRowSpec(rowNum);
        const snapshot = window.ExcelRow.build(spec);
        const steps = suiteFrozenSteps(snapshot);
        const selected=keys.map(key=>{const step=steps.find(s=>String(s.key)===key);if(!step)throw new Error(key+'：缺少步骤配置');return step;});
        const step=selected[0];

        // ② 提示词渲染：任何未解析变量都必须在发送前失败（与面板「预览」同一实现）
        const prompts=selected.map(item=>{const rendered=suiteRenderPrompt(item,snapshot);if(rendered.missing.length)throw new Error(item.key+'：未解析变量 '+rendered.missing.join(' '));const text=SuiteQuickFive.normalizePrompt(rendered.text);if(!text)throw new Error(item.key+'：提示词为空');return text;});
        const prompt=expectCount===1?prompts[0]:'请按以下顺序分别生成5张独立图片。每项一张，必须输出5张图片，不能拼成一张、不能拼九宫格。五张都使用上传的同一件衣服，保持同色同款。\n'+prompts.map((p,i)=>`第${i+1}张：${selected[i].name}\n${p}`).join('\n\n');
        if (!prompt) throw new Error(`${outKey} ${stepName}：提示词为空`);

        // ③ 后处理配置校验：不消耗额度，先于发送；空脚本必须在此明确报错
        const ppConfig = await SuitePostprocess.checkInputs(steps, keys, snapshot);
        if (!ppConfig.ok) throw new Error('后处理配置校验未通过：' + ppConfig.problems.join('；'));

        // 输出能力不就绪时不发送生成请求，避免生成后才发现无法保存。
        // 目录授权是会话级的，扩展重载/浏览器重启都会回落到 prompt；此时不再阻塞：
        // 权限在 → 用磁盘句柄写盘+回读；权限回落 → 扩展自动改走下载通道落到「下载/<已选目录名>/」。
        const outputStatus = await suiteSend('suiteOutputStatus', {}, 10000);
        if (!outputStatus.ok) throw new Error('套图输出检查失败：' + (outputStatus.error || '扩展没有响应') + '；请重新加载扩展后重试，尚未发送生成请求');
        if (!outputStatus.configured) throw new Error('请在扩展中选择产品套图目录并保存（只需一次）；尚未发送生成请求');
        if (outputStatus.permission !== 'granted' && !outputStatus.canFallback) {
            throw new Error(`产品套图目录权限为 ${outputStatus.permission} 且无法降级到下载通道：请在扩展中展开该项并点击保存确认权限；尚未发送生成请求`);
        }
        const outputFallback = outputStatus.permission !== 'granted';

        // ④ 素材预检：只读当前产品原图，取不到真实位图就不发送
        const resolved = await resolveSuiteAssets(product);
        if (!resolved.assets.main) throw new Error('原图不可用：' + (resolved.problems[0] || '没有可用原图'));
        const prepared = await prepareSuiteAssets({ main: resolved.assets.main });
        const assets = prepared.map(a => ({ color: a.color, filename: a.filename, url: a.url, fileKey: a.fileKey, row: a.row, bytes: a.bytes, width: a.width, height: a.height }));

        // ⑤ 创建任务：单张重生成 → expectCount=1 且只能指定 1 个输出编号
        const created = await suiteSend('suiteCreate', {
            task: {
                fileKey, rowNum, productId: product.id,
                mode: expectCount===5?'quick-five':'single-regen', expectCount, targetKeys: keys,
                prompt,
                assets,
                configSnapshot: { model: step.model || '5.0', ratio: step.ratio || '1:1' }
            }
        });
        if (!created.ok || !created.task) throw new Error(created.error || '任务创建失败');
        const taskId = created.task.taskId;
        suiteTaskIdentities.set(taskId, { fileKey, rowNum });
        // 必须在消耗生成额度之前保存启动时的数据，不能等结果回来后再读当前表格。
        try {
            await persistSuiteFreeze({ fileKey, rowNum, taskId }, { spec, snapshot, steps });
        } catch (error) {
            await suiteSend('suiteCancel', { taskId, reason: '生成前冻结数据保存失败' });
            throw new Error('生成前冻结数据保存失败，未发送生成请求：' + error.message);
        }
        updateSuiteStatus(`⏳ 任务 ${taskId}｜${outKey} ${stepName}｜已发出一次生成请求，等待结果...${outputFallback ? `｜产品套图目录未授权：完成后将落盘到「下载/${outputStatus.name}/」` : ''}`);

        if(automatic)saveSuiteAutoState({taskId,fileKey,rowNum,paused:false,phase:'generating',done:0});

        // ⑥ 执行：一次请求；失败只诊断，不自动重发
        if (btn) btn.textContent = '⏳ 生成中...';
        let run = await suiteSend('suiteRun', { taskId }, 600000);
        if (!run.ok) throw new Error(run.error || '套图执行失败');
        if(run.accepted){
            const deadline=Date.now()+900000;
            while(Date.now()<deadline){
                const {task}=await suiteSend('suiteGetTask',{taskId,summary:true});
                if(!task)throw new Error('任务记录丢失');
                if(task.stage==='acquired'){const full=await suiteSend('suiteGetTask',{taskId});run={ok:true,images:full.task.images};break;}
                if(['failed','interrupted','completed'].includes(task.stage))throw new Error(task.error||'任务已结束');
                await new Promise(resolve=>setTimeout(resolve,2000));
            }
            if(!run.images)throw new Error('等待生成超时，已保留任务；可恢复已有结果');
        }

        // ⑦ 结果识别：单张重生成必须正好 1 张图片
        const rec = await SuiteCore.recognize(run.images || [], keys.map(key=>({key})), { expectCount });
        if (!rec.ok) throw new Error('结果识别失败：' + rec.error);
        const candidates = rec.results.map((r, i) => ({ key: r.key, index: i, url: r.url, fingerprint: r.fingerprint || null, source: 'appearance-order' }));

        // ⑧ 先可靠缓存原始结果；自动整套直接继续，单图保留手动确认入口。
        suitePendingNumbering = { candidates, taskId, fileKey, rowNum, steps, excelRowSpec: spec, restored: false, automatic };
        await persistSuitePending(suitePendingNumbering);
        if(automatic){
            if(!suiteAutoCheckpoint(taskId,'processing',1))return null;
            const assigned=SuiteCore.applyNumberingAssignment(candidates,Object.fromEntries(candidates.map(c=>[c.key,c.index]))).map(item=>({...item,source:'automatic-order'}));
            await finishSuiteTask({taskId,fileKey,rowNum,steps,assigned});return null;
        }
        renderSuitePendingNumbering();
        updateSuiteStatus(`✅ 已获取 ${expectCount} 张结果（任务 ${taskId}）；请确认编号后继续（后处理→保存→完成）`);
        showToast('✅ 已获取结果，请确认编号');
        return null;
    } catch (e) {
        updateSuiteStatus(`❌ ${e.message}`);
        showToast(`❌ ${e.message}`);
        return null;
    } finally {
        const auto=readSuiteAutoState();
        if(auto&&auto.phase!=='completed')saveSuiteAutoState({...auto,paused:true});
        suiteStatusOwner = null;
        suiteTaskRunning = false;hideSuiteAreaIfEmpty();renderSuiteAutoControls();
        if (btn) { btn.disabled = false; btn.textContent = '🖼️ 一键生成套图'; }
    }
}

// ===== 五步混合流程：111/444 直接用产品主图，222/333/666 才调用 AI 生成 =====
// 复用既有 SuitePostprocess 执行器、Excel 行快照注入、脚本顺序与保存通道，不另建后处理实现。
const SUITE_STEP_KEYS = ['111', '444', '222', '333', '666'];
const SUITE_FIVE_KEY = 'fivefreeze';
const SUITE_FIVE_TOTAL = 5;

function suiteSourceOf(step) {
    if (step && step.imageSource === 'product') return 'product';
    if (step && step.imageSource === 'generated') return 'generated';
    return ['111', '444'].includes(String((step && step.key) || '').trim()) ? 'product' : 'generated';
}

function suiteStepName(key) {
    const hit = SUITE_OUTPUTS.find(o => o[0] === String(key));
    return hit ? hit[1] : String(key);
}

function suiteBlobFromDataUrl(dataUrl) {
    return fetch(dataUrl).then(r => r.blob());
}

function suiteDataUrlHeader(dataUrl) {
    const m = String(dataUrl || '').match(/^data:([^;]+);base64,/);
    return m ? m[1] : 'image/png';
}

async function readSuiteFive(fileKey, rowNum) {
