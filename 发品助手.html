function stopBatchColorChange() {
    if (!batchColorState) return;
    batchColorState.stopRequested = true;
    updateBatchColorStatus('⏸ 正在暂停...');
    // 立即收尾：扩展侧没有取消通道，若只设标记，推进只能等单款超时（最长 100 秒），表现为「卡住」
    // finishBatchColor 内部会清超时、停轮询、恢复按钮
    finishBatchColor(false);
}

function finishBatchColor(completed, reason) {
    if (!batchColorState) return;
    // 补跑一轮：整批跑完、没有在途款、还没补跑过且存在失败款 → 把失败款排到队尾再跑一遍
    if (completed && batchColorState.running && !batchColorState.inFlightRow
        && !batchColorState.supplementDone && (batchColorState.failedRows || []).length) {
        const byRow = new Map((products || []).map(p => [p.row, p]));
        const extra = batchColorState.failedRows.map(r => byRow.get(r)).filter(Boolean);
        batchColorState.failedRows = [];
        batchColorState.failCount = 0;
        batchColorState.supplementDone = true;
        extra.forEach(p => batchColorState.queue.push(Object.assign({}, p, { _idx: batchColorState.queue.length })));
        saveColorBatchState();
        if (extra.length) showToast(`🔁 补跑 ${extra.length} 款失败款`);
        processNextBatchColor();
        return;
    }
    if (!completed) {
        const state = batchColorState;
        const row = state.inFlightRow || state.pendingAckRow;
        const idx = state.queue.findIndex(p => p.row === row);
        if (idx >= 0) state.currentIndex = idx;
        state.running = false; state.stopRequested = true;
        state.inFlightRow = null; state.pendingAckRow = null; state.inFlightSince = 0;
        state.executionId = null; state.pausedReason = reason || '';
        if (state.currentTimeoutId) clearTimeout(state.currentTimeoutId);
        state.currentTimeoutId = null;
        stopBatchColorPolling();
        setColorTimeoutRows([]); state.timedOutRows = [];
        refreshColorResumeRowsFromState(); saveColorBatchState();
        try { chrome.runtime.sendMessage(EXTENSION_ID, { action: 'pauseColorDispatch' }, () => { void chrome.runtime.lastError; }); } catch (_) {}
        restoreBatchColorUI(); updateBatchColorProgress();
        updateBatchColorStatus(reason ? `换色已暂停 · ${reason}` : '换色已暂停');
        return;
    }
    const finishedState = batchColorState;
    const batchLabel = batchColorState.label || '批量换色';
    // 在途行仍会在豆包继续生成：保留其超时定时器与完成轮询，让完成/失败都能入账
    const hasInFlight = !!batchColorState.inFlightRow;
    if (!hasInFlight && batchColorState.currentTimeoutId) {
        clearTimeout(batchColorState.currentTimeoutId);
        batchColorState.currentTimeoutId = null;
    }
    if (!hasInFlight) stopBatchColorPolling();
    batchColorState.running = false;
    batchColorState.pausedReason = reason || '';
    saveColorBatchState();
    try { chrome.runtime.sendMessage(EXTENSION_ID, { action: 'pauseColorDispatch' }, () => { void chrome.runtime.lastError; }); } catch (_) {}
    const total = batchColorState.queue.length;
    const success = batchColorState.successCount;
    const fail = batchColorState.failCount;
    const elapsed = Math.round((Date.now() - batchColorState.startTime) / 1000);
    const minutes = Math.floor(elapsed / 60);
    const seconds = elapsed % 60;
    const timeStr = minutes > 0 ? `${minutes}分${seconds}秒` : `${seconds}秒`;

    // 记下「失败 + 尚未派发」的行（**不含**仍在生成中的在途行，否则「继续」会重复提交它）
    const leftOver = computeColorResumeRows();
    setColorResumeRows(leftOver);

    updateBatchColorStatus(`✅ ${batchLabel}完成 ${success} 款`);
    updateBatchColorFill(100);
    restoreBatchColorUI();

    if (colorPollTimer) { clearInterval(colorPollTimer); colorPollTimer = null; }

    setTimeout(() => {
        // 5 秒内若已开新任务，勿干扰新任务的状态与按钮
        if (batchColorState && batchColorState !== finishedState) return;
        const btn = document.getElementById('batchColorBtn');
        if (btn) { btn.disabled = false; btn.innerHTML = '🚀 一键换色'; }
        const rowsBtn = document.getElementById('colorRowsBtn');
        if (rowsBtn) rowsBtn.disabled = false;
        if (batchColorState.inFlightRow) {
            // 在途行还在豆包生成：保留面板与状态，等它结束（不重复提交该款）
            restoreBatchColorUI();
            return;
        }
        if (getColorResumeRows().length > 0) {
            // 还有没跑完的：保留进度面板、按钮停在「继续」，state 不置空（供再次续跑）
            restoreBatchColorUI();
            return;
        }
        const el = batchColorProgressEl();
        if (el) el.style.display = 'none';
        if (batchColorState === finishedState) {
            const key = colorBatchFileKey();
            localStorage.removeItem(COLOR_BATCH_STATE_KEY + '::' + key);
            const global = localStorage.getItem(COLOR_BATCH_STATE_KEY);
            try { if (global && JSON.parse(global).fileKey === key) localStorage.removeItem(COLOR_BATCH_STATE_KEY); } catch (_) {}
            batchColorState = null;
        }
        setBatchColorToggle('stop');
    }, 5000);
}

    const btn = document.getElementById('batchColorBtn');

function updateBatchColorProgress() {
    if (!batchColorState) return;
    const total = batchColorState.queue.length;
    const current = batchColorState.currentIndex;
    const percent = total > 0 ? Math.round((current / total) * 100) : 0;
    updateBatchColorFill(percent);
    const counter = batchColorCounterEl();
    if (counter) counter.textContent = `${current}/${total}`;
    const product = batchColorState.queue[current];
    const cur = batchColorCurrentEl();
    if (cur) cur.textContent = batchColorState.inFlightRow ? `正在处理 row${batchColorState.inFlightRow}` : '';
    let status;
    if (batchColorState.running) status = `换色中 ${current}/${total}${batchColorState.inFlightRow ? ` · row${batchColorState.inFlightRow}` : ''}`;
    else if (current >= total && !(batchColorState.failedRows || []).length) status = `换色已结束 · 成功 ${batchColorState.successCount} 款`;
    else status = '换色已暂停' + (batchColorState.pausedReason ? ` · ${batchColorState.pausedReason}` : '');
    if (colorBatchFileKey() !== currentFileKey()) status = `原文件「${batchColorState.fileFolder || '默认'}」：${status}`;
    updateBatchColorStatus(status);
}

function openPhotopea(rowNum) {
    const imgFileName = `row${rowNum}_main.jpg`;
    const imgPath = `extracted_images/${imgFileName}`;
    const pngFileName = `row${rowNum}_main.png`;
    const pngPath = `extracted_images/${pngFileName}`;
    const isFileProtocol = location.protocol === 'file:';

    const tryFsAccessWay = async (fileName = imgFileName) => {
        try {
            const status=await psDirectoryMessage({action:'psDirectoryStatus'});
            if(status.configured && status.permission === 'granted'){
                let r=await psDirectoryMessage({action:'readPsImage',fileName});
                if(!r.ok && !/权限|授权/.test(r.error || '') && fileName===imgFileName){fileName=pngFileName;r=await psDirectoryMessage({action:'readPsImage',fileName});}
                if(!r.ok)throw new Error(r.error);
                // 磁盘上 png/jpg 混存：扩展读图会带回实际命中的文件名，按真实名打开并保存，避免写出重复副本。
                if(r.filename)fileName=r.filename;
                // 目录桥返回的是 dataUrl（不带字节数组 data）；直接用 dataUrl，避免读成空图。
                if(r.dataUrl){openPhotopeaWithExtension(r.dataUrl,fileName,rowNum);return;}
                const reader=new FileReader();reader.onload=()=>openPhotopeaWithExtension(reader.result,fileName,rowNum);
                reader.readAsDataURL(new Blob([new Uint8Array(r.data)],{type:r.type}));return;
            }
        }catch(e){
            if (!psEditDirHandle) {showToast('❌ PS图片读取失败: '+e.message);return;}
        }

        if (!psEditDirHandle) {
            showToast('❌ 请在扩展中展开产品原图目录，点击保存确认权限');
            return;
        }
        try {
            // 在PS编辑的点击流程内恢复助手页面自己的授权，不再依赖短命扩展弹窗。
            let permission = await psEditDirHandle.queryPermission({mode:'readwrite'});
            if (permission !== 'granted') permission = await psEditDirHandle.requestPermission({mode:'readwrite'});
            if (permission !== 'granted') throw new Error('尚未允许助手读取和保存原图');
            let fileHandle;
            try {
                fileHandle = await psEditDirHandle.getFileHandle(fileName);
            } catch (e) {
                if (!e || e.name !== 'NotFoundError') throw e;
                // 磁盘上 png/jpg 混存：同名换其它图片后缀再试，命中哪个就按哪个打开与保存。
                const base = String(fileName).replace(/\.(png|jpe?g|webp)$/i, '');
                let last = e;
                for (const ext of ['png', 'jpg', 'jpeg', 'webp']) {
                    const candidate = base + '.' + ext;
                    if (candidate === fileName) continue;
                    try { fileHandle = await psEditDirHandle.getFileHandle(candidate); fileName = candidate; last = null; break; }
                    catch (err) { last = err; }
                }
                if (last) throw last;
            }
            const file = await fileHandle.getFile();
            psPageSaveRows.add(rowNum);
            const reader = new FileReader();
            reader.onload = () => {
                openPhotopeaWithExtension(reader.result, fileName, rowNum);
            };
            reader.onerror = () => {
                showToast('❌ 图片转码失败');
            };
            reader.readAsDataURL(file);
        } catch (e) {
            console.warn('File System Access 读取失败:', e);
            showToast('❌ 加载图片失败: ' + e.message);
        }
    };

    const tryFetchWay = (path = imgPath, fileName = imgFileName) => {
        fetch(path + '?t=' + Date.now())
            .then(res => {
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return res.blob();
            })
            .then(blob => {
                const reader = new FileReader();
                reader.onload = () => {
                    openPhotopeaWithExtension(reader.result, fileName, rowNum);
                };
                reader.onerror = () => {
                    showToast('❌ 图片转码失败');
                };
                reader.readAsDataURL(blob);
            })
            .catch(e => {
                console.warn('fetch 失败:', e);
                if (path === imgPath) {
                    tryFetchWay(pngPath, pngFileName);
                } else if (isFileProtocol) {
                    tryFsAccessWay();
                } else {
                    tryImageWay();
                }
            });
    };

    const tryImageWay = (path = imgPath, fileName = imgFileName) => {
        const tempImg = new Image();
        if (!isFileProtocol) tempImg.crossOrigin = 'anonymous';
        tempImg.onload = () => {
            try {
                const dataUrl = imgToDataUrl(tempImg);
                openPhotopeaWithExtension(dataUrl, fileName, rowNum);
            } catch (e2) {
                showToast('❌ 图片转码失败: ' + e2.message);
            }
        };
        tempImg.onerror = () => {
            if (path === imgPath) {
                tryImageWay(pngPath, pngFileName);
            } else {
                showToast('❌ 加载图片失败');
            }
        };
        tempImg.src = path + '?t=' + Date.now();
    };

    tryFetchWay();
}

function imgToDataUrl(img) {
    const canvas = document.createElement('canvas');
    canvas.width = img.naturalWidth || img.width;
    canvas.height = img.naturalHeight || img.height;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);
    return canvas.toDataURL('image/png');
}

function openPhotopeaWithExtension(dataUrl, imgFileName, rowNum) {
    try {
        chrome.runtime.sendMessage(EXTENSION_ID, {
            action: 'startPsEdit',

        }, (response) => {
            if (chrome.runtime.lastError) {
                showToast('⚠️ 请确认扩展已安装');
                return;
            }
            if (response && response.ok) {
                showToast('✅ 已打开 Photopea，编辑完点 File → Save 保存');
                startPsEditPolling(rowNum);
            } else {
                showToast('❌ 启动PS编辑失败: ' + (response?.error || '未知错误'));
            }
        });
    } catch (e) {
        showToast('⚠️ 未检测到扩展');
    }
}

let psPollTimer = null;
let psImgCheckState = {};
let lastPsEditTimestamp = 0;

function startPsEditPolling(rowNum) {
    if (psPollTimer) clearInterval(psPollTimer);
    const imgPath = `extracted_images/row${rowNum}_main.jpg`;
    const imgPathPng = `extracted_images/row${rowNum}_main.png`;
    psImgCheckState[rowNum] = { width: 0, height: 0 };
    let count = 0;
    let usePng = false;
    psPollTimer = setInterval(() => {
        count++;
        if (count > 200) {
            clearInterval(psPollTimer);
            psPollTimer = null;
            return;
        }

        try {
            chrome.runtime.sendMessage(EXTENSION_ID, { action: 'getPsEditResult', rowNum }, (response) => {
                if (chrome.runtime.lastError) {
                    console.log('[PS轮询] 扩展未安装或消息发送失败');
                    return;
                }
                const psResult = response?.result;
                console.log('[PS轮询] 检查结果:', psResult ? `有数据 rowNum=${psResult.rowNum}, timestamp=${psResult.timestamp}` : '无数据', '当前 rowNum:', rowNum, 'lastTimestamp:', lastPsEditTimestamp);
                if (psResult && psResult.timestamp > lastPsEditTimestamp && psResult.rowNum === rowNum) {
                    handlePsEditComplete(psResult);
                    return;
                }
            });
        } catch (e) {
            console.error('[PS轮询] 消息发送失败:', e);
        }

        const testImg = new Image();
        testImg.onload = () => {
            const state = psImgCheckState[rowNum];
            if (!state) return;
            if (state.width === 0 && state.height === 0) {
                state.width = testImg.naturalWidth;
                state.height = testImg.naturalHeight;
                return;
            }
            if (testImg.naturalWidth !== state.width || testImg.naturalHeight !== state.height) {
                state.width = testImg.naturalWidth;
                state.height = testImg.naturalHeight;
                refreshMainImage(rowNum);
                showToast('✅ 图片已更新');
                return;
            }
            const canvas = document.createElement('canvas');
            const w = Math.min(testImg.naturalWidth, 50);
            const h = Math.min(testImg.naturalHeight, 50);
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(testImg, 0, 0, w, h);
            try {
                const data = ctx.getImageData(0, 0, w, h).data;
                let hash = 0;
                for (let i = 0; i < data.length; i += 40) {
                    hash = ((hash << 5) - hash + data[i]) | 0;
                }
                if (state.pixelHash && state.pixelHash !== hash) {
                    state.pixelHash = hash;
                    refreshMainImage(rowNum);
                    showToast('✅ 图片已更新');
                } else if (!state.pixelHash) {
                    state.pixelHash = hash;
                }
            } catch (e) {}
        };
        testImg.onerror = () => {
            if (!usePng) {
                usePng = true;
            }
        };
        const path = usePng ? imgPathPng : imgPath;
        testImg.src = path + (path.includes('?') ? '&' : '?') + 't=' + Date.now() + '_' + count;
    }, 3000);
}

function refreshMainImage(rowNum) {
    const imgs = document.querySelectorAll('.main-image img');
    imgs.forEach(img => {
        const src = img.src.split('?')[0];
        if (src.includes(`row${rowNum}_main`)) {

// 绝对路径 → file:// URL（C:.png → file:///C:/a/b.png），带时间戳强制回源
function toFileUrl(absPath) {
    // 反斜杠统一成斜杠（用 split/join 避免正则转义问题）
    const p = String(absPath || '').split(String.fromCharCode(92)).join('/');
    const url = p.startsWith('/') ? 'file://' + p : 'file:///' + p;
    return url + (url.includes('?') ? '&' : '?') + 't=' + Date.now();
}

function hasChinese(s) { return /[\u4e00-\u9fa5]/.test(s); }
function hasEnglish(s) { return /[a-zA-Z]/.test(s); }

// 拆分中英双语单元格：支持「中文\n英文」两行与「中英混排」两种格式，返回 { cn, en }
function splitBilingual(text) {
    if (!text) return { en: '', cn: '' };
    let str = String(text).replace(/\n/g, ' ').trim();
    if (!str) return { en: '', cn: '' };

    const pipeIdx = str.indexOf('||');
    if (pipeIdx !== -1) {
        const left = str.substring(0, pipeIdx).trim();
        const right = str.substring(pipeIdx + 2).trim();
        const leftCn = hasChinese(left);
        const leftEn = hasEnglish(left);
        const rightCn = hasChinese(right);
        const rightEn = hasEnglish(right);
        if (!leftCn && leftEn && rightCn) return { en: left, cn: right };
        if (leftCn && !rightCn && rightEn) return { en: right, cn: left };
    }

    const slashRegex = /[\/／]/g;
    const slashIndices = [];
    let m;
    while ((m = slashRegex.exec(str)) !== null) {
        slashIndices.push(m.index);
    }
    if (slashIndices.length > 0) {
        let bestMatch = null;
        for (const slashIdx of slashIndices) {
            const left = str.substring(0, slashIdx).trim();
            const right = str.substring(slashIdx + 1).trim();
            const leftCn = hasChinese(left);
            const leftEn = hasEnglish(left);
            const rightCn = hasChinese(right);
            const rightEn = hasEnglish(right);

            if (!leftCn && leftEn && rightCn) {
                bestMatch = { en: left, cn: right };
            }
            if (leftCn && !rightCn && rightEn) {
                bestMatch = { en: right, cn: left };
            }
        }
        if (bestMatch) return bestMatch;
    }

    const hasCn = hasChinese(str);
    const hasEn = hasEnglish(str);

    if (!hasCn) return { en: str, cn: '' };
    if (!hasEn) return { en: '', cn: str };

    let firstCn = -1, lastCn = -1;
    let firstEn = -1, lastEn = -1;
    for (let i = 0; i < str.length; i++) {
        if (/[\u4e00-\u9fa5]/.test(str[i])) {
            if (firstCn === -1) firstCn = i;
            lastCn = i;
        }
        if (/[a-zA-Z]/.test(str[i])) {
            if (firstEn === -1) firstEn = i;
            lastEn = i;
        }
    }

    if (lastEn < firstCn) {
        let endEn = lastEn;
        let i = lastEn + 1;
        while (i < str.length && !/[\u4e00-\u9fa5\s]/.test(str[i])) {
            endEn = i;
            i++;
        }
        const en = str.substring(0, endEn + 1).trim();
        const cn = str.substring(endEn + 1).trim();
        return { en, cn };
    }

    if (lastCn < firstEn) {
        let startEn = firstEn;
        let i = firstEn - 1;
        while (i >= 0 && !/[\u4e00-\u9fa5\s]/.test(str[i])) {
            startEn = i;
            i--;
        }
        const cn = str.substring(0, startEn).trim();
        const en = str.substring(startEn).trim();
        return { en, cn };
    }

    let splitIdx = firstCn;
    let i = firstCn - 1;
    while (i >= 0 && /[\d\s%.,\-]/.test(str[i])) {
        i--;
    }
    let j = i;
    while (j >= 0 && /[a-zA-Z]/.test(str[j])) {
        j--;
    }
    if (j < i && i >= 0) {
        splitIdx = i + 1;
    }

    const en = str.substring(0, splitIdx).trim();
    const cn = str.substring(splitIdx).trim();
    return { en, cn };
}

function parseSeoTitle(text) {
    if (!text) return { en: '', cn: '' };
    const str = String(text).trim();
    const markers = ['[中文翻译]：', '【中文翻译】：', '[中文翻译]:', '【中文翻译】:'];
    for (const marker of markers) {
        const idx = str.indexOf(marker);
        if (idx !== -1) return { en: str.substring(0, idx).trim(), cn: str.substring(idx + marker.length).trim() };
    }
    const pipeIdx = str.indexOf('||');
    if (pipeIdx !== -1) {
        const left = str.substring(0, pipeIdx).trim();
        const right = str.substring(pipeIdx + 2).trim();
        const leftCn = hasChinese(left);
        const rightCn = hasChinese(right);
        if (!leftCn && rightCn) return { en: left, cn: right };
        if (leftCn && !rightCn) return { en: right, cn: left };
    }
    return splitBilingual(str);
}

function splitMixedText(s) {
    if (!s) return { en: '', cn: '' };
    if (!hasChinese(s)) return { en: s.trim(), cn: '' };
    if (!hasEnglish(s)) return { en: '', cn: s.trim() };

    const chars = [...s];
    let enParts = [];
    let cnParts = [];
    let curEn = [];
    let curCn = [];
    let lastType = null;

    function flush() {
        if (curEn.length) { enParts.push(curEn.join('')); curEn = []; }
        if (curCn.length) { cnParts.push(curCn.join('')); curCn = []; }
    }

    for (const ch of chars) {
        const isCnChar = /[\u4e00-\u9fa5\u3000-\u303f\uff00-\uffef]/.test(ch);
        const isEnChar = /[a-zA-Z]/.test(ch);
        const isPunctSpace = /[\s,.\-;:!?()\[\]{}'"，。、；：！？（）【】《》""'']/.test(ch);

        if (isCnChar) {
            if (lastType === 'en' && curEn.length) { enParts.push(curEn.join('')); curEn = []; }
            curCn.push(ch);
            lastType = 'cn';
        } else if (isEnChar) {
            if (lastType === 'cn' && curCn.length) { cnParts.push(curCn.join('')); curCn = []; }
            curEn.push(ch);
            lastType = 'en';
        } else if (isPunctSpace) {
            if (lastType === 'en') curEn.push(ch);
            else if (lastType === 'cn') curCn.push(ch);
            else enParts.push(ch);
        } else {
            if (lastType === 'en') curEn.push(ch);
            else if (lastType === 'cn') curCn.push(ch);
            else enParts.push(ch);
        }
    }
    flush();

    return {
        en: enParts.join(' ').replace(/\s+/g, ' ').trim(),
        cn: cnParts.join(' ').replace(/\s+/g, ' ').trim()
    };
}

function parseHighlights(text) {
    if (!text) return [];
    const results = [];
    const lines = String(text).split('\n').map(l => l.trim()).filter(l => l);

    const blocks = [];
    let curBlock = null;
    for (const line of lines) {
        const numMatch = line.match(/^(\d+)[.\u3001)\uff09\u2460-\u2473]\s*/);
        if (numMatch) {
            if (curBlock) blocks.push(curBlock);
            curBlock = { num: numMatch[1], lines: [line.substring(numMatch[0].length).trim()] };
        } else {
            if (curBlock) curBlock.lines.push(line);
            else blocks.push({ num: '', lines: [line] });
        }
    }
    if (curBlock) blocks.push(curBlock);

    for (const block of blocks) {
        let label_en = '', desc_en = '', label_cn = '', desc_cn = '';

        for (let raw of block.lines) {
            let s = raw.trim();
            if (!s) continue;
            s = s.replace(/[\*_]{1,3}/g, '').trim();

            let isCnBracketLine = false;
            const obMatch = s.match(/^[\uff08(](.+)[\uff09)]\s*$/);
            const obMatch2 = s.match(/^[\[\uff3b\u3010\u300a](.+)[\]\uff3d\u3011\u300b]\s*$/);
            if (obMatch && hasChinese(obMatch[1])) { s = obMatch[1].trim(); isCnBracketLine = true; }
            else if (obMatch2 && hasChinese(obMatch2[1])) { s = obMatch2[1].trim(); isCnBracketLine = true; }

            const inlineCn = s.match(/[\[\uff3b\u3010\u300a]([\u4e00-\u9fa5\u3001\uff0c\s]+?)[\]\uff3d\u3011\u300b][\uff1a:]\s*(.+?)\s*$/);
            let cnPart = '';
            if (inlineCn && hasChinese(inlineCn[1])) {
                cnPart = inlineCn[1].trim() + '：' + inlineCn[2].trim();
                s = s.substring(0, s.length - inlineCn[0].length).trim();
            }

            const colonIdx = s.search(/[\uff1a:]/);
            let labelPart = '';
            let descPart = '';
            let hasColon = colonIdx !== -1;
            if (hasColon) {
                labelPart = s.substring(0, colonIdx).trim();
                descPart = s.substring(colonIdx + 1).trim();
            } else {
                descPart = s;
            }

            const labelHasCn = hasChinese(labelPart);
            const isCnLine = isCnBracketLine || labelHasCn;

            if (s) {
                if (isCnLine) {
                    if (labelPart && !label_cn) label_cn = labelPart;
                    if (descPart) {
                        if (!desc_cn) desc_cn = descPart;
                        else desc_cn += ' ' + descPart;
                    }
                } else if (hasChinese(s) && hasEnglish(s)) {
                    if (hasColon) {
                        const labelSplit = splitMixedText(labelPart);
                        const descSplit = splitMixedText(descPart);
                        if (labelSplit.en && !label_en) label_en = labelSplit.en;
                        if (labelSplit.cn && !label_cn) label_cn = labelSplit.cn;
                        if (descSplit.en) {
                            if (!desc_en) desc_en = descSplit.en;
                            else desc_en += ' ' + descSplit.en;
                        }
                        if (descSplit.cn) {
                            if (!desc_cn) desc_cn = descSplit.cn;
                            else desc_cn += ' ' + descSplit.cn;
                        }
                    } else {
                        const split = splitMixedText(s);
                        if (split.en) {
                            if (!desc_en) desc_en = split.en;
                            else desc_en += ' ' + split.en;
                        }
                        if (split.cn) {
                            if (!desc_cn) desc_cn = split.cn;
                            else desc_cn += ' ' + split.cn;
                        }
                    }
                } else {
                    if (hasColon) {
                        if (labelPart && !label_en) label_en = labelPart;
                        if (descPart) {
                            if (!desc_en) desc_en = descPart;
                            else desc_en += ' ' + descPart;
                        }
                    } else {
                        if (!desc_en) desc_en = s;
                        else desc_en += ' ' + s;
                    }
                }
            }

            if (cnPart) {
                const cm = cnPart.match(/^(.+?)[\uff1a:]\s*(.+)$/);
                if (cm) {
                    if (!label_cn) label_cn = cm[1].trim();
                    if (!desc_cn) desc_cn = cm[2].trim();
                } else {
                    if (!desc_cn) desc_cn = cnPart;
                }
            }
        }

        results.push({ num: block.num, label_en, desc_en, label_cn, desc_cn, raw: block.lines.join('\n') });
    }

    return results;
}

function parseFaqs(text) {
    if (!text) return [];
    const faqs = [];

    const lines = String(text).split('\n').map(l => l.trim()).filter(l => l);

    function classifyLine(line) {
        if (/^Q[\uff1a:]\s*/i.test(line)) {
            const rest = line.replace(/^Q[\uff1a:]\s*/i, '').trim();
            const aIdx = rest.search(/\s+A[\uff1a:]\s*/i);
            if (aIdx !== -1) {
                return { type: 'Q_EN', value: rest.substring(0, aIdx).trim(),
                    extra: { type: 'A_EN', value: rest.substring(aIdx).replace(/^\s*A[\uff1a:]\s*/i, '').trim() } };
            }
            return { type: 'Q_EN', value: rest };
        }
        if (/^A[\uff1a:]\s*/i.test(line)) {
            return { type: 'A_EN', value: line.replace(/^A[\uff1a:]\s*/i, '').trim() };
        }
        if (/^\u95ee[\uff1a:]\s*/.test(line)) {
            const rest = line.replace(/^\u95ee[\uff1a:]\s*/, '').trim();
            const aIdx = rest.search(/\s*\u7b54[\uff1a:]\s*/);
            if (aIdx !== -1) {
                return { type: 'Q_CN', value: rest.substring(0, aIdx).trim(),
                    extra: { type: 'A_CN', value: rest.substring(aIdx).replace(/^\s*\u7b54[\uff1a:]\s*/, '').trim() } };
            }
            return { type: 'Q_CN', value: rest };
        }
        if (/^\u7b54[\uff1a:]\s*/.test(line)) {
            return { type: 'A_CN', value: line.replace(/^\u7b54[\uff1a:]\s*/, '').trim() };
        }
        return { type: 'CONT', value: line };
    }

    let current = null;
    let lastType = null;

    function flushFaq() {
        if (current && (current.q_en || current.q_cn)) {
            faqs.push({ ...current });
        }
        current = null;
        lastType = null;
    }

    for (let idx = 0; idx < lines.length; idx++) {
        const line = lines[idx];
        let info = classifyLine(line);

        if (info.type === 'Q_EN') {
            if (current && (current.q_en || current.q_cn)) {
                flushFaq();
            }
            current = { q_en: info.value, a_en: '', q_cn: '', a_cn: '' };
            lastType = 'Q_EN';
            if (info.extra && info.extra.type === 'A_EN') {
                current.a_en = info.extra.value;
                lastType = 'A_EN';
            }
        } else if (info.type === 'A_EN') {
            if (!current) current = { q_en: '', a_en: '', q_cn: '', a_cn: '' };
            current.a_en = info.value;
            lastType = 'A_EN';
        } else if (info.type === 'Q_CN') {
            if (!current) current = { q_en: '', a_en: '', q_cn: '', a_cn: '' };
            const cnInlineMatch = info.value.match(/[\[\uff3b\u3010\u300a]\s*[\u95ee][\uff1a:]?\s*(.+?)\s*[\]\uff3d\u3011\u300b][\uff1a:\s]*[\[\uff3b\u3010\u300a]\s*[\u7b54][\uff1a:]?\s*(.+?)\s*[\]\uff3d\u3011\u300b]\s*$/);
            if (cnInlineMatch) {
                current.q_cn = cnInlineMatch[1].trim();
                current.a_cn = cnInlineMatch[2].trim();
            } else {
                current.q_cn = info.value;
            }
            lastType = 'Q_CN';
            if (info.extra && info.extra.type === 'A_CN') {
                current.a_cn = info.extra.value;
                lastType = 'A_CN';
            }
        } else if (info.type === 'A_CN') {
            if (!current) current = { q_en: '', a_en: '', q_cn: '', a_cn: '' };
            current.a_cn = info.value;
            lastType = 'A_CN';
        } else if (info.type === 'CONT' && current && lastType) {
            if (lastType === 'A_EN') {
                current.a_en += ' ' + info.value;
            } else if (lastType === 'A_CN') {
                current.a_cn += ' ' + info.value;
            } else if (lastType === 'Q_EN') {
                current.q_en += ' ' + info.value;
            } else if (lastType === 'Q_CN') {
                current.q_cn += ' ' + info.value;
            }
        }
    }

    flushFaq();

    for (const f of faqs) {
        const cnInlineMatch = f.a_en.match(/[\[\uff3b\u3010\u300a]\s*[\u95ee][\uff1a:]?\s*(.+?)\s*[\]\uff3d\u3011\u300b][\uff1a:\s]*[\[\uff3b\u3010\u300a]\s*[\u7b54][\uff1a:]?\s*(.+?)\s*[\]\uff3d\u3011\u300b]\s*$/);
        if (cnInlineMatch && !f.q_cn && !f.a_cn) {
            f.q_cn = cnInlineMatch[1].trim();
            f.a_cn = cnInlineMatch[2].trim();
            f.a_en = f.a_en.substring(0, f.a_en.length - cnInlineMatch[0].length).trim();
        }
    }

    return faqs;
}

let uploadPollTimer = null;
checkExtension();
loadFromLocalStorage();
loadSkippedItems();
function startUploadPolling() {
    if (uploadPollTimer) clearInterval(uploadPollTimer);
    if (!products.length) return;
    uploadPollTimer = setInterval(() => {
        if (!chrome?.runtime || products.length === 0) {
            clearInterval(uploadPollTimer);
            uploadPollTimer = null;
            return;
        }
        try {
            const queriedFile = currentFileKey();
            refreshPublishState();
            chrome.runtime.sendMessage(EXTENSION_ID, { action: 'getUploadedRows', fileKey: queriedFile }, (response) => {
                if (queriedFile !== currentFileKey()) return;
                if (!chrome.runtime.lastError && response?.rows) {
                    if (response.fileKey !== undefined && response.fileKey !== queriedFile) return;
                    uploadedRowsFileKey = queriedFile;
                    uploadedRows = response.rows;
                    legacyRows = response.legacy || {};
                    const productCards = document.getElementById('productCards');
                    if (productCards) {
                        productCards.querySelectorAll('.product-card').forEach(card => {
                            const idx = parseInt(card.dataset.idx);
                            const product = products[idx];
                            if (product && response.rows[product.row]) {
                                let badge = card.querySelector('.uploaded-badge');
                                if (!badge) {
                                    badge = document.createElement('span');
                                    const tags = card.querySelector('.product-tags');
                                    if (tags) tags.appendChild(badge);
                                }
                                badge.className = 'uploaded-badge';
                                badge.textContent = '已保存';
                                badge.style.opacity = '';
                                badge.removeAttribute('title');
                            }
                        });
                    }
                    updateBatchBar();
                }
            });
        } catch (e) {}
    }, 3000);
}

// Keyboard shortcut for modal
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeImageModal(); });

function navigateTab(direction) {
    const tabOrder = ['basic', 'highlights', 'faq'];
    const currentIdx = tabOrder.indexOf(currentActiveTab);
    if (currentIdx === -1) return;
    let newIdx;
    if (direction === 'left') {
        newIdx = currentIdx > 0 ? currentIdx - 1 : 0;
    } else {
        newIdx = currentIdx < tabOrder.length - 1 ? currentIdx + 1 : tabOrder.length - 1;
    }
    if (newIdx === currentIdx) return;
    const newTab = tabOrder[newIdx];
    const tabEl = document.querySelector(`.tab[data-tab="${newTab}"]`);
    if (tabEl) tabEl.click();
}

// 键盘选择产品：W/↑ 上移，S/↓ 下移；A/← 左移Tab，D/→ 右移Tab
document.addEventListener('keydown', (e) => {
    if (e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey || e.target?.closest('input,textarea,select,[contenteditable="true"],[contenteditable=""]')) return;
    if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') {
        e.preventDefault();
        navigateProduct('up');
    } else if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') {
        e.preventDefault();
        navigateProduct('down');
    } else if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') {
        e.preventDefault();
        navigateTab('left');
    } else if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') {
        e.preventDefault();
        navigateTab('right');
    }
});

<!-- 目录授权检测：启动/回到页面时查一次，掉了就顶部提示，点一次全部重新授权 -->
<script>
(function(){
  var LABELS={colorImgDir:'产品图片目录',imageDir:'产品原图目录',scriptDir:'JS脚本目录'};
  var banner=null;
  function ensureBanner(){
    if(banner) return banner;
    banner=document.createElement('div');
    banner.id='dirPermBanner';
    banner.style.cssText='position:fixed;left:50%;transform:translateX(-50%);top:10px;z-index:99999;display:none;align-items:center;gap:12px;padding:9px 14px;border-radius:10px;background:#3a2a12;color:#ffc069;border:1px solid #d48806;font-size:12px;box-shadow:0 6px 20px rgba(0,0,0,.45)';
    banner.innerHTML='<span id="dirPermText"></span><button id="dirPermBtn" style="padding:4px 10px;border-radius:8px;border:none;background:#d48806;color:#1a1a1a;font-weight:600;cursor:pointer;white-space:nowrap">重新授权</button>';
    document.body.appendChild(banner);
    banner.querySelector('#dirPermBtn').onclick=function(){
      // 申请必须在点击手势里同步发起：一次点击会把所有已配置目录一起授权
      Promise.resolve(PageDirectories.permissions())
        .then(function(){ return check(); })
        .catch(function(e){ showToast('授权失败：'+((e&&e.message)||e)); });
    };
    return banner;
  }
  async function check(){
    if(typeof PageDirectories==='undefined'||!PageDirectories.queryPermissions) return;
    try{ await PageDirectories.ready; }catch(_){}
    var perms=await PageDirectories.queryPermissions();
    var keys=Object.keys(perms||{});
    if(!keys.length){ var b0=ensureBanner(); b0.style.display='none'; return; }  // 还没配过目录：交给路径配置
    var bad=keys.filter(function(k){ return perms[k]!=='granted'; });
    var b=ensureBanner();
    if(!bad.length){ b.style.display='none'; return; }
    var names=bad.map(function(k){ return LABELS[k]||k; }).join('、');
    b.querySelector('#dirPermText').textContent='目录授权已失效：'+names+'（不授权读不到磁盘图，也可能存不上）';
    b.style.display='flex';
  }
  window.addEventListener('load',function(){ setTimeout(check,800); });
  window.addEventListener('focus',function(){ setTimeout(check,300); });
  
(function () {
    // 更新：授权一次项目目录后，点按钮就能下载并直接写盘替换（不需要解压）
    const bar = document.getElementById('updaterBar');
    const elHead = document.getElementById('updHead');
    const elMsg = document.getElementById('updMsg');
    const checkBtn = document.getElementById('updCheck');
    const btn = document.getElementById('updBtn');
    if (!bar || !btn) return;

    let state = null;
    let busy = false;

    function show(msg, color) {
        bar.style.display = 'flex';
        elMsg.textContent = msg;
        elMsg.style.color = color || 'rgba(255,255,255,.34)';
    }

    function head() {
        const local = (window.PoloUpdater && PoloUpdater.localBuild()) || '';
        elHead.textContent = local ? 'built ' + local.replace('T', ' ').slice(5, 16) : '';
    }

    async function refresh() {
        if (!window.PoloUpdater) { show('更新模块未加载', '#ff9c6e'); return; }
        head();
        bar.style.display = 'flex';
        btn.style.display = 'none';
        try {
            state = await PoloUpdater.check();
        } catch (e) {
            show('检查失败', '#ff9c6e');
            elMsg.title = String((e && e.message) || e);
            return;
        }
        if (!state.hasUpdate) { show('已是最新 · ' + String(state.appliedSha || state.remote.sha).slice(0, 7)); return; }
        show('有新版本 ' + String(state.remote.sha).slice(0, 7), '#69b1ff');
        elMsg.title = state.remote.message || '';
        btn.textContent = '更新到最新';
        btn.style.display = 'inline';
    }

    btn.addEventListener('click', async () => {
        if (busy) return;
        busy = true;
        btn.style.display = 'none';
        try {
            let dir = await PoloUpdater.getDir();
            if (!dir) {
                // 目录授权统一放在「路径配置」里管理，这里只引导过去
                show('请先在「路径配置」选择项目根目录', '#faad14');
                try { PathConfig.open(); } catch (_) {}
                busy = false;
                return;
            } else if (!dir.granted) {
                dir = await PoloUpdater.requestPerm();
                if (!dir || !dir.granted) { show('目录授权被拒绝', '#ff4d4f'); busy = false; return; }
            }
            show('正在下载…', '#69b1ff');
            const r = await PoloUpdater.apply(p => {
                if (p.phase === 'download' && p.total) show('下载 ' + p.done + '/' + p.total, '#69b1ff');
            });
            if (!r.updated) { show('已是最新'); busy = false; return; }
            if (r.failed && r.failed.length) {
                show('已更新 ' + r.written + ' 个文件，' + r.failed.length + ' 个失败', '#faad14');
                elMsg.title = r.failed.slice(0, 10).join(String.fromCharCode(10));
                busy = false;
                return;
            }
            show('已更新 ' + r.written + ' 个文件，正在重载…', '#52c41a');
            try { chrome.runtime.sendMessage((typeof EXTENSION_ID !== 'undefined' ? EXTENSION_ID : ''), { action: 'reloadExtension' }, () => { void chrome.runtime.lastError; }); } catch (_) {}
            setTimeout(() => location.reload(), 1500);
        } catch (e) {
            show('更新失败', '#ff4d4f');
            elMsg.title = String((e && e.message) || e);
            btn.style.display = 'inline';
            busy = false;
        }
    });

    if (checkBtn) {
        checkBtn.addEventListener('click', async () => {
            if (checkBtn.dataset.busy === '1') return;
            checkBtn.dataset.busy = '1';
            checkBtn.style.opacity = '0.4';
            try { await refresh(); } finally {
                checkBtn.dataset.busy = '';
                checkBtn.style.opacity = '';
            }
        });
    }

    refresh();
    setInterval(refresh, 600000);
})();
window.__dirPermCheck=check;
})();
</script>
